    <meta property="og:description" content="从0基础到论文精通：综合评价、计量经济学、时间序列分析、多元统计分析、统计学原理">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }
        /* 侧边栏 */
        .sidebar {
            width: 320px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .sidebar-header h1 {
            font-size: 16px;
            color: #333;
            margin-bottom: 10px;
        }
        .search-box {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .file-tree {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            font-size: 13px;
        }
        .file-tree ul {
            list-style: none;
            padding-left: 15px;
        }
        .file-tree li {
            padding: 3px 0;
            cursor: pointer;
            color: #555;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .file-tree li:hover { color: #007acc; }
        .file-tree li.folder {
            font-weight: bold;
            color: #333;
        }
        .file-tree li.folder::before { content: "📁 "; }
        .file-tree li.file::before { content: "📄 "; }
        .file-tree li.active {
            background: #e3f2fd;
            color: #007acc;
            padding-left: 5px;
            border-radius: 3px;
        }
        .file-tree li.hidden { display: none; }
        /* 主内容区 */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow: hidden;
        }
        .breadcrumb {
            background: #fff;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }
        .breadcrumb a {
            color: #007acc;
            cursor: pointer;
            text-decoration: none;
        }
        .breadcrumb a:hover { text-decoration: underline; }
        .content {
            flex: 1;
            background: #fff;
            padding: 30px;
            border-radius: 4px;
            overflow-y: auto;
            line-height: 1.8;
            color: #333;
        }
        .content h1 { font-size: 28px; margin: 20px 0 15px; color: #222; }
        .content h2 { font-size: 24px; margin: 20px 0 10px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .content h3 { font-size: 20px; margin: 15px 0 10px; color: #444; }
        .content p { margin: 10px 0; }
        .content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 14px;
        }
        .content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .content pre code { background: none; padding: 0; }
        .content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        .content table th, .content table td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        .content table th { background: #f5f5f5; }
        .wikilink {
            color: #007acc;
            cursor: pointer;
            text-decoration: underline;
        }
        .wikilink:hover { color: #005a9e; }
        .wikilink.broken { color: #999; }
        /* 欢迎页 */
        .welcome {
            text-align: center;
            padding: 50px;
        }
        .welcome h1 { font-size: 32px; margin-bottom: 20px; }
        .welcome p { font-size: 16px; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>📚 经济统计学论文写作知识库</h1>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索文件...">
        </div>
        <div class="file-tree" id="fileTree"></div>
    </div>
    <div class="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content" id="content">
            <div class="welcome">
                <h1>欢迎使用经济统计学论文写作知识库</h1>
                <p>从0基础到论文精通</p>
                <p>从左侧选择文件开始阅读</p>
            </div>
        </div>
    </div>

    <script>
        let fileTreeData = {};
        let allFiles = [];

        // 加载文件树
        async function loadFileTree() {
            const res = await fetch('file-tree.json');
            fileTreeData = await res.json();
            renderFileTree(fileTreeData, document.getElementById('fileTree'));
            collectFiles(fileTreeData, '');
        }

        function collectFiles(tree, path) {
            for (const [key, value] of Object.entries(tree)) {
                const newPath = path ? `${path}/${key}` : key;
                if (value === null) {
                    allFiles.push(newPath);
                } else {
                    collectFiles(value, newPath);
                }
            }
        }

        function renderFileTree(data, container, path = "") {
            for (const [key, value] of Object.entries(data)) {
                const li = document.createElement("li");
                const newPath = path ? `${path}/${key}` : key;
                
                if (value === null) {
                    // 文件
                    li.className = "file";
                    li.textContent = key.replace('.md', '');
                    li.dataset.path = newPath;
                    li.onclick = (e) => {
                        e.stopPropagation();
                        loadFile(newPath);
                    };
                    container.appendChild(li);
                } else {
                    // 文件夹
                    li.className = "folder";
                    li.textContent = key;
                    const ul = document.createElement("ul");
                    li.onclick = () => {
                        ul.style.display = ul.style.display === "none" ? "block" : "none";
                    };
                    container.appendChild(li);
                    container.appendChild(ul);
                    renderFileTree(value, ul, newPath);
                }
            }
        }

        // 加载md文件
        async function loadFile(path) {
            document.getElementById("breadcrumb").innerHTML = 
                '<a onclick="showWelcome()">首页</a> / ' + path.split("/").join(" / ");
            
            try {
                const res = await fetch(encodeURI(path));
                let md = await res.text();
                
                // 解析wikilink
                md = md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, target, display) => {
                    // 查找目标文件
                    const targetFile = allFiles.find(f => f.includes(target));
                    if (targetFile) {
                        return `<span class="wikilink" onclick="loadFile('${targetFile}')">${display || target}</span>`;
                    } else {
                        return `<span class="wikilink broken">${display || target}</span>`;
                    }
                });
                
                // 渲染markdown
                const html = marked.parse(md);
                document.getElementById("content").innerHTML = html;
                
                // 高亮当前文件
                document.querySelectorAll(".file-tree li").forEach(li => {
                    li.classList.remove("active");
                    if (li.dataset.path === path) {
                        li.classList.add("active");
                    }
                });
            } catch (err) {
                document.getElementById("content").innerHTML = 
                    `<h1>加载失败</h1><p>无法加载文件: ${path}</p><p>错误: ${err.message}</p>`;
            }
        }

        function showWelcome() {
            document.getElementById("breadcrumb").innerHTML = '<a onclick="showWelcome()">首页</a>';
            document.getElementById("content").innerHTML = `
                <div class="welcome">
                    <h1>欢迎使用经济统计学论文写作知识库</h1>
                    <p>从0基础到论文精通</p>
                    <p>从左侧选择文件开始阅读</p>
                </div>
            `;
        }

        // 搜索
        document.getElementById("searchBox").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll(".file-tree li.file").forEach(li => {
                if (li.dataset.path.toLowerCase().includes(query)) {
                    li.classList.remove("hidden");
                } else {
                    li.classList.add("hidden");
                }
            });
        });

        // 初始化
        loadFileTree();
    </script>
</body>
</html>
