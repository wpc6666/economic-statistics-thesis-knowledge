<body>
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰ 目录</button>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>📚 经济统计学论文写作知识库</h1>
            <input type="text" class="search-box" id="searchBox" placeholder="搜索文件...">

    </div>
    <div class="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content" id="content">
            <div class="welcome">
                <h1>欢迎使用经济统计学论文写作知识库</h1>
                <p>从0基础到论文精通</p>
                <p>从左侧选择文件开始阅读</p>

        </div>
        <div class="footer">
            <p>📦 原仓库地址：<a href="https://github.com/wpc6666/economic-statistics-thesis-knowledge" target="_blank">github.com/wpc6666/economic-statistics-thesis-knowledge</a></p>
            <p>🙏 致谢：香港科技大学李伯岩课题组科研写作指南（<a href="https://github.com/HKUSTDial/Supervisor-Skills" target="_blank">HKUSTDial/Supervisor-Skills</a>）</p>
            <p>© 白澤 程 · 经济统计学论文写作知识库</p>
        </div>
    </div>

    <script>
        let fileTreeData = {};
        let allFiles = [];

        // 移动端侧边栏开关
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("open");
        }

        // 加载文件树
        async function loadFileTree() {
            const res = await fetch('file-tree.json');
            fileTreeData = await res.json();
            renderFileTree(fileTreeData, document.getElementById('fileTree'));
            collectFiles(fileTreeData, '');
        }

        function collectFiles(tree, path) {
            for (const [key, value] of Object.entries(tree)) {
                const newPath = path ? `${path}/${key}` : key;
                if (value === null) {
                    allFiles.push(newPath);
                } else {
                    collectFiles(value, newPath);
                }
            }
        }

        function renderFileTree(data, container, path = "") {
            for (const [key, value] of Object.entries(data)) {
                const li = document.createElement("li");
                const newPath = path ? `${path}/${key}` : key;
                
                if (value === null) {
                    // 文件
                    li.className = "file";
                    li.textContent = key.replace('.md', '');
                    li.dataset.path = newPath;
                    li.onclick = (e) => {
                        e.stopPropagation();
                        loadFile(newPath);
                        // 手机端点击后收起侧边栏
                        if (window.innerWidth <= 768) {
                            document.getElementById("sidebar").classList.remove("open");
                        }
                    };
                    container.appendChild(li);
                } else {
                    // 文件夹 - 默认收起
                    li.className = "folder";
                    li.textContent = key;
                    const ul = document.createElement("ul");
                    li.onclick = (e) => {
                        e.stopPropagation();
                        ul.classList.toggle("collapsed");
                    };
                    container.appendChild(li);
                    container.appendChild(ul);
                    renderFileTree(value, ul, newPath);
                }
            }
        }

        // 加载md文件
        async function loadFile(path) {
            document.getElementById("breadcrumb").innerHTML = 
                '<a onclick="showWelcome()">首页</a> / ' + path.split("/").join(" / ");
            
            try {
                const res = await fetch(encodeURI(path));
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                let md = await res.text();
                
                // 解析wikilink - 改进路径匹配逻辑
                md = md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, target, display) => {
                    const targetClean = target.trim();
                    // 精确匹配文件名
                    let targetFile = allFiles.find(f => f === targetClean || f.endsWith('/' + targetClean));
                    // 模糊匹配 - 包含KP编号或关键词
                    if (!targetFile) {
                        targetFile = allFiles.find(f => {
                            const fileName = f.split('/').pop().replace('.md', '');
                            return fileName.includes(targetClean) || targetClean.includes(fileName);
                        });
                    }
                    if (targetFile) {
                        return `<span class="wikilink" onclick="loadFile('${targetFile}')">${display || target}</span>`;
                    } else {
                        return `<span class="wikilink broken" title="未找到: ${target}">${display || target}</span>`;
                    }
                });
                
                // 渲染markdown
                const html = marked.parse(md);
                document.getElementById("content").innerHTML = html;
                
                // 高亮当前文件
                document.querySelectorAll(".file-tree li").forEach(li => {
                    li.classList.remove("active");
                    if (li.dataset.path === path) {
                        li.classList.add("active");
                    }
                });
                
                // 滚动到顶部
                document.getElementById("content").scrollTop = 0;
                
                // 触发MathJax渲染公式
                if (window.MathJax && window.MathJax.typesetPromise) {
                    window.MathJax.typesetPromise([document.getElementById("content"]]);
                }
            } catch (err) {
                document.getElementById("content").innerHTML = 
                    `<h1>加载失败</h1><p>无法加载文件: ${path}</p><p>错误: ${err.message}</p>`;
            }
        }

        function showWelcome() {
            document.getElementById("breadcrumb").innerHTML = '<a onclick="showWelcome()">首页</a>';
            document.getElementById("content").innerHTML = `
                <div class="welcome">
                    <h1>欢迎使用经济统计学论文写作知识库</h1>
                    <p>从0基础到论文精通</p>
                    <p>从左侧选择文件开始阅读</p>
                </div>
            `;
        }

        // 搜索
        document.getElementById("searchBox").addEventListener("input", (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll(".file-tree li.file").forEach(li => {
                if (li.dataset.path.toLowerCase().includes(query)) {
                    li.classList.remove("hidden");
                } else {
                    li.classList.add("hidden");
                }
            });
        });

        // 初始化
        loadFileTree();
    </script>
</body>
