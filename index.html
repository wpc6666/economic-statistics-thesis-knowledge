<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经济统计学论文写作知识库</title>
    <meta name="msvalidate.01" content="F519A4DA9F13C310A90496F067A99A78">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script>
    mermaid.initialize({ 
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        fontFamily: 'inherit'
    });
    </script>
    <script>
    window.MathJax = {
        tex: {
            inlineMath: [['$', '$'], ['\\(', '\\)']],
            displayMath: [['$$', '$$'], ['\\[', '\\]']],
            processEscapes: true
        },
        options: {
            skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
        }
    };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script" async></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        .sidebar { width: 300px; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        .sidebar-header { padding: 15px; border-bottom: 1px solid #ddd; }
        .sidebar-header h1 { font-size: 16px; margin-bottom: 10px; }
        .repo-btn { display: inline-block; padding: 6px 12px; background: #24292e; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; margin-bottom: 5px; }
        .hkust-btn { display: inline-block; padding: 6px 12px; background: #28a745; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .file-tree { padding: 10px; font-size: 13px; }
        .file-tree ul { list-style: none; padding-left: 15px; }
        .file-tree li { padding: 3px 0; cursor: pointer; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-tree li:hover { color: #007acc; }
        .file-tree li.folder { font-weight: bold; }
        .file-tree li.folder::before { content: "📁 "; }
        .file-tree li.file::before { content: "📄 "; }
        .file-tree li.active { background: #e3f2fd; color: #007acc; padding-left: 5px; border-radius: 3px; }
        .file-tree ul.collapsed { display: none; }
        .main { flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden; min-width: 0; }
        .breadcrumb { background: #fff; padding: 10px 15px; border-radius: 4px; margin-bottom: 10px; font-size: 14px; color: #666; }
        .content { flex: 1; background: #fff; padding: 30px; border-radius: 4px; overflow-y: auto; line-height: 2; color: #333; font-size: 16px; }
        .content p, .content li { margin-bottom: 15px; }
        .content table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        .content th, .content td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        .content th { background: #f5f5f5; font-weight: bold; }
        .content h1, .content h2, .content h3 { margin-top: 30px; margin-bottom: 15px; }
        .content h1 { font-size: 28px; margin: 20px 0 15px; }
        .content h2 { font-size: 24px; margin: 20px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .content h3 { font-size: 20px; margin: 15px 0 10px; }
        .content code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; }
        .content pre { background: #f5f5f5; padding: 15px; border-radius: 5px; overflow-x: auto; margin: 10px 0; }
        .content table { border-collapse: collapse; width: 100%; margin: 15px 0; }
        .content table th, .content table td { border: 1px solid #ddd; padding: 8px 12px; }
        .content img, .content svg { max-width: 100%; height: auto; }
        .welcome { text-align: center; padding: 100px; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; left: -300px; top: 0; height: 100vh; z-index: 999; transition: left 0.3s; }
            .sidebar.open { left: 0; }
            .mobile-btn { display: block !important; }
            .main { padding: 10px; padding-top: 50px; }
            .content { padding: 20px 15px; }
        }
        .mobile-btn { display: none; position: fixed; top: 10px; left: 10px; z-index: 1000; padding: 8px 12px; background: #007acc; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <button class="mobile-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰ 目录</button>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h1>📚 知识库</h1>
            <a href="https://github.com/wpc6666/economic-statistics-thesis-knowledge" target="_blank" class="repo-btn">⭐ 本仓库</a>
            <br>
            <a href="https://github.com/HKUSTDial/Supervisor-Skills" target="_blank" class="hkust-btn">📚 HKUST科研写作指南</a>
        </div>
        <div class="file-tree" id="fileTree">
            <p style="padding: 20px; color: #999;">加载中...</p>
        </div>
    </div>
    <div class="main">
        <div class="breadcrumb" id="breadcrumb">首页</div>
        <div class="content" id="content">
            <div class="welcome">
                <h1>欢迎使用经济统计学论文写作知识库</h1>
                <p>从0基础到论文精通</p>
                <p>从左侧选择文件开始阅读</p>
            </div>
        </div>
        <div style="background: #fff; padding: 12px 15px; border-radius: 4px; margin-top: 10px; font-size: 12px; color: #888; text-align: center;">
            <p>
                <a href="https://github.com/wpc6666/economic-statistics-thesis-knowledge" target="_blank" style="color: #007acc; margin-right: 15px;">⭐ 本仓库</a>
                <a href="https://github.com/HKUSTDial/Supervisor-Skills" target="_blank" style="color: #28a745;">📚 HKUST科研写作指南</a>
            </p>
            <p style="margin-top: 5px;">© 白澤 程 · 经济统计学论文写作知识库</p>
        </div>
    </div>

    <script>
        let allFiles = [];

        async function loadFileTree() {
            try {
                const res = await fetch('file-tree.json');
                const data = await res.json();
                const container = document.getElementById('fileTree');
                container.innerHTML = '';
                
                renderTree(data, container);
                collectFiles(data, '');
            } catch (err) {
                document.getElementById('fileTree').innerHTML = '<p style="color: red; padding: 20px;">加载失败: ' + err.message + '</p>';
            }
        }

        function renderTree(data, container) {
            for (const key in data) {
                const value = data[key];
                const li = document.createElement('li');
                const newPath = (container.dataset.path || '') + '/' + key;
                
                if (value === null) {
                    li.className = 'file';
                    li.textContent = key;
                    li.dataset.path = newPath.substring(1);
                    li.onclick = (e) => {
                        e.stopPropagation();
                        // 手机端直接收起侧边栏
                        document.getElementById('sidebar').classList.remove('open');
                        loadFile(li.dataset.path);
                        document.querySelectorAll('.file-tree li').forEach(l => l.classList.remove('active'));
                        li.classList.add('active');
                    };
                    container.appendChild(li);
                } else {
                    li.className = 'folder';
                    li.textContent = key;
                    const ul = document.createElement('ul');
                    ul.dataset.path = newPath;
                    ul.classList.add('collapsed'); // 默认收起
                    li.onclick = (e) => {
                        e.stopPropagation();
                        ul.classList.toggle('collapsed');
                    };
                    container.appendChild(li);
                    container.appendChild(ul);
                    renderTree(value, ul);
                }
            }
        }

        function collectFiles(tree, path) {
            for (const key in tree) {
                const value = tree[key];
                const newPath = path ? path + '/' + key : key;
                if (value === null) {
                    allFiles.push(newPath);
                } else {
                    collectFiles(value, newPath);
                }
            }
        }

        async function loadFile(path) {
            // 手机端自动收起侧边栏
            if (window.innerWidth <= 768) {
                document.getElementById('sidebar').classList.remove('open');
            }
            
            document.getElementById('breadcrumb').textContent = '首页 / ' + path;
            document.getElementById('content').innerHTML = '<p style="padding:20px;color:#666;">加载中...</p>';
            
            try {
                // ===== 第1步：读取文件 =====
                let res, md;
                try {
                    res = await fetch(encodeURI(path));
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    md = await res.text();
                } catch(e) {
                    document.getElementById('content').innerHTML = '<h1>加载失败</h1><p>无法读取文件: ' + path + '</p><p>错误: ' + e.message + '</p>';
                    return;
                }
                
                // ===== 第2步：处理wikilink =====
                const fileMap = {};
                allFiles.forEach(f => {
                    const fileName = f.split('/').pop();
                    const nameNoExt = fileName.replace(/\.md$/, '');
                    fileMap[nameNoExt] = f;
                    fileMap[fileName] = f;
                });
                
                let processedMd = md.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (match, target, display) => {
                    const targetClean = target.trim();
                    let filePath = fileMap[targetClean];
                    if (!filePath) {
                        filePath = Object.keys(fileMap).find(k => k.includes(targetClean) || targetClean.includes(k));
                        if (filePath) filePath = fileMap[filePath];
                    }
                    if (filePath) {
                        const safePath = filePath.replace(/'/g, "\'");
                        return `<span style="color: #007acc; cursor: pointer; text-decoration: underline;" onclick="loadFile('${safePath}')">${display || target}</span>`;
                    } else {
                        return `<span style="color: #999;">${display || target}</span>`;
                    }
                });
                
                // ===== 第3步：渲染markdown（多种方法自动切换） =====
                let html = '';
                
                // 方法1：先提取公式，再渲染
                try {
                    const formulas = [];
                    let mdWithoutFormulas = processedMd.replace(/\$\$([\s\S]*?)\$\$/g, (match, f) => {
                        formulas.push({type: 'block', content: f});
                        return `@@FORMULA_${formulas.length - 1}@@`;
                    });
                    mdWithoutFormulas = mdWithoutFormulas.replace(/\$([^$\n]+)\$/g, (match, f) => {
                        formulas.push({type: 'inline', content: f});
                        return `@@FORMULA_${formulas.length - 1}@@`;
                    });
                    
                    html = marked.parse(mdWithoutFormulas);
                    
                    formulas.forEach((f, i) => {
                        if (f.type === 'block') {
                            html = html.replace(`<p>@@FORMULA_${i}@@</p>`, `$$${f.content}$$`);
                        } else {
                            html = html.replace(`@@FORMULA_${i}@@`, `$${f.content}$$`);
                        }
                    });
                    
                    // 检查有没有残留的@@FORMULA
                    if (html.includes('@@FORMULA_')) {
                        throw new Error('公式提取失败');
                    }
                } catch(e1) {
                    // 方法2：直接marked.parse()，然后还原转义
                    try {
                        html = marked.parse(processedMd);
                        html = html.replace(/\\\\/g, '\\');
                        html = html.replace(/\\\$/g, '\$');
                    } catch(e2) {
                        // 方法3：直接显示原始markdown
                        html = '<pre>' + processedMd + '</pre>';
                    }
                }
                
                // ===== 第4步：设置到页面上 =====
                document.getElementById('content').innerHTML = html;
                
                // ===== 第5步：渲染SVG =====
                try {
                    document.querySelectorAll('img[src$=".svg"]').forEach(img => {
                        const src = img.getAttribute('src');
                        fetch(src).then(r => r.text()).then(svg => {
                            const div = document.createElement('div');
                            div.innerHTML = svg;
                            if (div.firstElementChild) {
                                img.replaceWith(div.firstElementChild);
                            }
                        });
                    });
                } catch(e) {
                    console.log('SVG渲染失败:', e);
                }
                
                // ===== 第6步：渲染mermaid图（多种方法自动切换） =====
                if (window.mermaid) {
                    try {
                        document.querySelectorAll('pre code.language-mermaid').forEach(el => {
                            const pre = el.parentElement;
                            const code = el.textContent;
                            
                            // 方法1：标准mermaid.render()
                            try {
                                mermaid.render('mermaid-' + Math.random().toString(36).substr(2, 9), code)
                                    .then(({svg}) => { 
                                        pre.innerHTML = svg; 
                                    })
                                    .catch((err) => { 
                                        // 方法1失败，尝试方法2：用mermaid.run()
                                        try {
                                            pre.innerHTML = '<div class="mermaid">' + code + '</div>';
                                            mermaid.run({
                                                nodes: [pre.querySelector('.mermaid')]
                                            });
                                        } catch(e2) {
                                            // 方法2也失败，直接显示代码
                                            pre.innerHTML = '<div style="color:#666;padding:10px;background:#f5f5f5;">Mermaid代码:</div><pre>' + code + '</pre>';
                                        }
                                    });
                            } catch(e) {
                                pre.innerHTML = '<div style="color:#666;padding:10px;background:#f5f5f5;">Mermaid代码:</div><pre>' + code + '</pre>';
                            }
                        });
                    } catch(e) {
                        console.log('mermaid渲染失败:', e);
                    }
                }
                
                // ===== 第7步：渲染公式（MathJax） =====
                if (window.MathJax && window.MathJax.typesetPromise) {
                    try {
                        window.MathJax.typesetPromise([document.getElementById('content')]).catch(err => {
                            console.log('MathJax渲染失败:', err);
                        });
                    } catch(e) {
                        console.log('MathJax渲染失败:', e);
                    }
                }
                
                document.getElementById('content').scrollTop = 0;
            } catch (err) {
                document.getElementById('content').innerHTML = '<h1>加载失败</h1><p>无法加载文件: ' + path + '</p><p>错误: ' + err.message + '</p>';
            }
        }
        
        loadFileTree();
    </script>
</body>
</html>
