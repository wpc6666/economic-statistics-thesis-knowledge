<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">

<style>
:root{
  --bg:#f6f7f9; --bg-elev:#ffffff; --bg-sunken:#eef1f5;
  --fg:#1f2328; --fg-mute:#656d76; --fg-faint:#8b949e;
  --border:#e1e4e8; --border-strong:#d0d7de;
  --accent:#2563eb; --accent-soft:#e8f0fe; --accent-fg:#ffffff;
  --code-bg:#f3f4f6; --code-fg:#b3005e;
  --mark:#fff3a3;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 14px rgba(0,0,0,.06);
  --radius:10px;
  --sidebar-w:312px;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1117; --bg-elev:#161b22; --bg-sunken:#21262d;
    --fg:#e6edf3; --fg-mute:#9da7b3; --fg-faint:#6e7681;
    --border:#30363d; --border-strong:#3d444d;
    --accent:#4493f8; --accent-soft:#0d2a4d; --accent-fg:#ffffff;
    --code-bg:#1c2128; --code-fg:#ff9bb3;
    --mark:#4a3d00;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.4);
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:var(--sans); font-size:16px; line-height:1.75;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  display:flex; overflow:hidden;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}

/* ───────── 侧栏 ───────── */
.sidebar{
  width:var(--sidebar-w); flex:0 0 var(--sidebar-w);
  background:var(--bg-elev); border-right:1px solid var(--border);
  display:flex; flex-direction:column; height:100%; min-height:0; z-index:60;
}
.sidebar-head{padding:14px 14px 10px; border-bottom:1px solid var(--border); flex:0 0 auto}
.brand{display:flex; align-items:center; gap:9px; margin-bottom:11px}
.brand-mark{
  width:28px; height:28px; border-radius:8px; flex:0 0 auto;
  background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff;
  display:grid; place-items:center; font-size:15px; font-weight:700;
}
.brand-txt{min-width:0}
.brand-txt b{display:block; font-size:14px; line-height:1.3; font-weight:650; letter-spacing:.01em}
.brand-txt span{display:block; font-size:11.5px; color:var(--fg-faint); line-height:1.4}
.search-wrap{position:relative}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:14px; height:14px; color:var(--fg-faint); pointer-events:none}
#search{
  width:100%; padding:7px 9px 7px 29px; font-size:13px; font-family:inherit;
  color:var(--fg); background:var(--bg-sunken); border:1px solid var(--border);
  border-radius:8px; outline:none; transition:border-color .15s, box-shadow .15s;
}
#search:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft)}
#search::placeholder{color:var(--fg-faint)}
.sidebar-links{display:flex; gap:6px; margin-top:9px}
.sidebar-links a{
  flex:1; text-align:center; padding:5px 6px; font-size:12px; border-radius:7px;
  background:var(--bg-sunken); color:var(--fg-mute); border:1px solid var(--border);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sidebar-links a:hover{color:var(--accent); border-color:var(--accent); text-decoration:none}

.tree-scroll{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; padding:8px 6px 24px}
.tree-scroll::-webkit-scrollbar{width:9px}
.tree-scroll::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:9px; border:2px solid var(--bg-elev)}
.tree-scroll::-webkit-scrollbar-track{background:transparent}
.tree, .tree ul{list-style:none; margin:0; padding:0}
.tree ul{padding-left:11px; margin-left:5px; border-left:1px solid var(--border)}
.tree li{min-width:0}
.node{
  display:flex; align-items:center; gap:5px; width:100%; min-width:0;
  padding:4px 7px; border:0; border-radius:6px; background:none; cursor:pointer;
  font:inherit; font-size:12.9px; line-height:1.5; color:var(--fg-mute); text-align:left;
}
.node:hover{background:var(--bg-sunken); color:var(--fg)}
.node .tw{flex:0 0 12px; display:grid; place-items:center; color:var(--fg-faint); transition:transform .14s ease}
.node .ico{flex:0 0 14px; display:grid; place-items:center; color:var(--fg-faint)}
.node .lbl{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dir > .node{font-weight:600; color:var(--fg)}
.dir.open > .node .tw{transform:rotate(90deg)}
.dir:not(.open) > ul{display:none}
.file.active > .node{background:var(--accent-soft); color:var(--accent); font-weight:600}
.file.active > .node .ico{color:var(--accent)}
.tree mark{background:var(--mark); color:inherit; border-radius:2px; padding:0 1px}
.tree .hidden{display:none !important}
.empty-hint{padding:14px 12px; color:var(--fg-faint); font-size:12.5px; text-align:center}

/* ───────── 主区 ───────── */
.main{flex:1 1 auto; display:flex; flex-direction:column; min-width:0; height:100%; min-height:0}
.topbar{
  flex:0 0 auto; display:flex; align-items:center; gap:10px;
  padding:9px 16px; background:var(--bg-elev); border-bottom:1px solid var(--border);
  padding-top:max(9px, env(safe-area-inset-top));
}
.exam-btn{color:var(--accent)}
.exam-btn:hover{background:var(--accent-soft)}
.icon-btn{
  display:none; place-items:center; width:34px; height:34px; flex:0 0 auto;
  border:1px solid var(--border); border-radius:8px; background:var(--bg-elev);
  color:var(--fg-mute); cursor:pointer; padding:0;
}
.icon-btn:hover{color:var(--accent); border-color:var(--accent)}
.icon-btn svg{width:17px; height:17px}
.crumbs{flex:1 1 auto; min-width:0; font-size:12.8px; color:var(--fg-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.crumbs b{color:var(--fg); font-weight:600}
.crumbs .sep{margin:0 5px; opacity:.5}
.scroll{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; scroll-behavior:smooth}
.scroll::-webkit-scrollbar{width:11px}
.scroll::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:11px; border:3px solid var(--bg)}
.page{max-width:900px; margin:0 auto; padding:26px 26px 72px}
.card{background:var(--bg-elev); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:30px 34px 36px}
@media (max-width:820px){ .card{border-radius:0; border-left:0; border-right:0; box-shadow:none; margin:0; padding:20px 16px 32px} }

/* ───────── 排版 ───────── */
.md{font-size:16px; line-height:1.8; word-wrap:break-word; overflow-wrap:break-word}
.md > :first-child{margin-top:0}
.md > :last-child{margin-bottom:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.35; margin:1.7em 0 .6em; font-weight:650; scroll-margin-top:16px}
.md h1{font-size:1.72em; padding-bottom:.35em; border-bottom:1px solid var(--border); margin-top:0}
.md h2{font-size:1.38em; padding-bottom:.28em; border-bottom:1px solid var(--border)}
.md h3{font-size:1.16em}
.md h4{font-size:1.02em}
.md h5,.md h6{font-size:.95em; color:var(--fg-mute)}
.md p{margin:0 0 1em}
.md ul,.md ol{margin:0 0 1em; padding-left:1.6em}
.md li{margin:.28em 0}
.md li > ul,.md li > ol{margin:.28em 0}
.md hr{height:1px; border:0; background:var(--border); margin:2em 0}
.md blockquote{
  margin:0 0 1em; padding:.6em 1em; color:var(--fg-mute);
  background:var(--bg-sunken); border-left:3px solid var(--border-strong); border-radius:0 6px 6px 0;
}
.md blockquote > :last-child{margin-bottom:0}
.md strong{font-weight:650}
.md del{color:var(--fg-faint)}
.md code{
  font-family:var(--mono); font-size:.875em; padding:.15em .38em;
  background:var(--code-bg); color:var(--code-fg); border-radius:4px;
  word-break:break-word;
}
.md pre{
  margin:0 0 1em; padding:14px 16px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:var(--code-bg); border:1px solid var(--border); border-radius:8px; line-height:1.6;
}
.md pre code{background:none; color:var(--fg); padding:0; font-size:13px; white-space:pre}
.md pre{max-width:100%}
.md pre code{display:block; max-width:100%}
.md .table-wrap{margin:0 0 1.2em; overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--border); border-radius:8px}
.md .table-wrap > table{display:table; width:auto; min-width:100%}
.md .table-wrap table{margin:0; border:0; min-width:100%; max-width:none}
.md table{border-collapse:collapse; width:100%; margin:0 0 1.2em; font-size:14.5px; display:table}
.md th,.md td{border-bottom:1px solid var(--border); padding:9px 13px; text-align:left; vertical-align:top}
.md th{background:var(--bg-sunken); font-weight:650; white-space:nowrap}
.md tr:last-child td{border-bottom:0}
.md img{max-width:100%; height:auto; display:block; margin:1em auto; border-radius:6px}
/* 公式：超长公式横向滚动，绝不撑破页面。
   注意 MathJax 块级公式是 <mjx-container class="MathJax" jax="CHTML" display="true">，
   行内公式无 display 属性；用 display 属性区分，且必须允许横向滚动。 */
/* 公式溢出控制。
   坑：MathJax 自带 CSS 用 mjx-container[jax="CHTML"][display="true"][width="full"]{display:flex}，
   特异性(2属性+元素)高于普通类选择器，会把 display 改回 flex → 公式撑破页面。
   所以这里必须 !important，并且选择器要带上属性提高特异性。 */
.md mjx-container{display:inline-block !important; max-width:100% !important;
  min-width:0 !important;      /* 关键：MathJax 内联写了 min-width:25.865em，min 会压过 max-width */
  overflow-x:auto !important; overflow-y:hidden !important;
  vertical-align:middle; -webkit-overflow-scrolling:touch}
.md mjx-container[jax][display="true"], .md mjx-container[display="true"]{
  display:block !important; margin:1em 0 !important; padding:2px 0;
  max-width:100% !important; min-width:0 !important; width:auto !important;
  overflow-x:auto !important; overflow-y:hidden !important; text-align:center}
.md mjx-container[jax][display="true"][width="full"]{display:block !important; width:auto !important; min-width:0 !important}
.md .katex-display{max-width:100%; overflow-x:auto; overflow-y:hidden}
.md .katex{font-size:1.02em}
.md figure{margin:1em 0}
.md .mermaid-box{
  margin:0 0 1.2em; padding:12px; overflow-x:auto; -webkit-overflow-scrolling:touch;
  background:var(--bg-elev); border:1px solid var(--border); border-radius:8px;
}
.md .mermaid-box svg{max-width:100%; height:auto; display:block; margin:0 auto}
.md .mermaid-err{
  margin:0 0 1em; padding:11px 14px; border:1px solid var(--border); border-left:3px solid #d29922;
  border-radius:0 8px 8px 0; background:var(--bg-sunken); font-size:13px; color:var(--fg-mute);
}
.md .mermaid-err pre{margin:8px 0 0; background:var(--code-bg)}
.md .wikilink{color:var(--accent); cursor:pointer; border-bottom:1px dashed var(--accent); text-decoration:none}
.md .wikilink:hover{text-decoration:none; background:var(--accent-soft)}
.md .wikilink.missing{color:var(--fg-faint); border-bottom:1px dotted var(--fg-faint); cursor:help}
.md .anchor-flash{animation:anchorFlash 1.6s ease-out}
@keyframes anchorFlash{0%{background:var(--mark); box-shadow:0 0 0 4px var(--mark)}100%{background:transparent; box-shadow:0 0 0 0 transparent}}
.md a.md-link{cursor:pointer}
.md a[href^="http"]::after{content:"↗"; font-size:.72em; margin-left:2px; opacity:.55; vertical-align:super}

/* ───────── 状态 ───────── */
.state{padding:64px 20px; text-align:center; color:var(--fg-mute)}
.state .big{font-size:15px; margin-bottom:6px; color:var(--fg)}
.state .sub{font-size:13px; color:var(--fg-faint)}
.spinner{
  width:22px; height:22px; margin:0 auto 12px; border-radius:50%;
  border:2.5px solid var(--border); border-top-color:var(--accent);
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{
  margin:0 auto; max-width:520px; padding:18px 20px; text-align:left;
  background:var(--bg-elev); border:1px solid var(--border); border-left:3px solid #f85149; border-radius:0 8px 8px 0;
}
.err-box b{display:block; margin-bottom:6px; color:var(--fg)}
.err-box code{font-family:var(--mono); font-size:12.5px; word-break:break-all; color:var(--fg-mute)}
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px);
  padding:9px 18px; border-radius:999px; background:var(--fg); color:var(--bg-elev);
  font-size:13px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:200;
}
.toast.show{opacity:.94; transform:translate(-50%,0)}
.backdrop{display:none; position:fixed; inset:0; background:rgba(0,0,0,.42); z-index:55; -webkit-tap-highlight-color:transparent}
.backdrop.show{display:block}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* ───────── 手机 ───────── */
@media (max-width:820px){
  body{display:block; overflow:auto; height:auto}
  .sidebar{
    position:fixed; top:0; bottom:0; left:0; width:86%; max-width:330px;
    transform:translateX(-102%); transition:transform .24s cubic-bezier(.4,0,.2,1);
    box-shadow:0 0 24px rgba(0,0,0,.28); padding-bottom:env(safe-area-inset-bottom);
  }
  .sidebar.open{transform:translateX(0)}
  .main{height:auto; min-height:100vh; display:block}
  .topbar{position:sticky; top:0; z-index:40}
  .icon-btn{display:grid}
  .scroll{overflow:visible}
  .page{padding:0 0 40px}
  .md{font-size:15.5px}
  .md h1{font-size:1.5em}
  .md h2{font-size:1.28em}
  .md pre{border-radius:0; margin-left:-16px; margin-right:-16px; border-left:0; border-right:0; padding:12px 16px}
  .md .table-wrap{border-radius:0; margin-left:-16px; margin-right:-16px; border-left:0; border-right:0}
  .md th,.md td{padding:8px 11px; font-size:13.5px}
  .md .mermaid-box{border-radius:0; margin-left:-16px; margin-right:-16px; border-left:0; border-right:0; padding:8px}
  .md img{border-radius:0}
}
@media (max-width:380px){
  .brand-txt span{display:none}
  .page{padding-left:0; padding-right:0}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important; transition-duration:.01ms !important}
  .scroll{scroll-behavior:auto}
}
</style>

<script>
/* ════════════════════════════════════════════════════════════
   知识库阅读器
   关键修复（相对上一版）：
   1. 链接/图片按「md 所在目录」解析 —— 上一版按页面根解析，
      .md 链接全部 404（GitHub 深色 404 页 = 用户说的"跳转显示黑色"），
      37 张图片也全部 404。
   2. 站内跳转拦截，不再离开阅读器。
   3. mermaid 占位符用不可碰撞的串，id 全局唯一，逐块 try/catch。
   4. 表格套横滑容器；mermaid/图片限宽。
   5. CDN 三级兜底 + 超时提示。
   ════════════════════════════════════════════════════════════ */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var contentEl = $('content'), treeEl = $('tree'), crumbsEl = $('crumbs');
  var scrollEl = $('scroll'), sidebarEl = $('sidebar'), backdropEl = $('backdrop');
  var searchEl = $('search'), statEl = $('stat'), toastEl = $('toast');
  var menuBtn = $('menuBtn'), topBtn = $('topBtn');

  var allFiles = [];          // 全部 .md 相对路径
  var fileByBase = {};        // basename(无扩展) -> 相对路径（wikilink 用）
  var fileByLower = {};       // 小写 basename -> 路径（容错）
  var pathSet = {};           // 全部相对路径集合（判断目标是否存在）
  var currentPath = '';
  var mermaidSeq = 0;
  var loadingToken = 0;
  var pendingAnchor = '';

  /* ───────── 工具 ───────── */
  function dirname(p) { var i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
  function basename(p) { var i = p.lastIndexOf('/'); return i < 0 ? p : p.slice(i + 1); }
  function stripExt(n) { return n.replace(/\.(md|markdown)$/i, ''); }

  // 把相对路径按基准目录归一化，去掉 ./ 与 ../
  function resolvePath(base, rel) {
    if (!rel) return '';
    if (/^[a-z]+:\/\//i.test(rel) || rel.charAt(0) === '/' || rel.charAt(0) === '#') return null;
    var stack = base ? base.split('/') : [];
    rel.split('/').forEach(function (seg) {
      if (seg === '' || seg === '.') return;
      if (seg === '..') { stack.pop(); return; }
      stack.push(seg);
    });
    return stack.join('/');
  }

  function safeDecode(s) { try { return decodeURIComponent(s); } catch (e) { return s; } }

  function toast(msg, ms) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { toastEl.classList.remove('show'); }, ms || 1800);
  }

  /* ───────── 依赖加载（三级 CDN 兜底） ───────── */
  var CDN = [
    'https://cdn.jsdelivr.net/npm/',
    'https://fastly.jsdelivr.net/npm/',
    'https://unpkg.com/'

      if (!s) return;
      if (/^(https?:|data:|blob:)/i.test(s)) { img.loading = 'lazy'; return; }
      var p = resolvePath(base, safeDecode(s.split('#')[0]));
      if (p) img.src = encodeURI(p);
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('error', function () {
        var ph = document.createElement('div');
        ph.className = 'mermaid-err';
        ph.textContent = '图片无法加载：' + safeDecode(s);
        if (img.parentElement) img.parentElement.replaceChild(ph, img);
      }, { once: true });
    });

    // 1.5) 同页锚点双链 [[#标题]]：点了滚到本文档的那个标题
    container.querySelectorAll('a.wikilink.same-page').forEach(function (a) {
      var anc = a.getAttribute('data-anchor') || '';
      a.addEventListener('click', function (e) {
        e.preventDefault();
        scrollToAnchor(anc);
      });
    });

    // 2) 链接按 md 所在目录解析；站内 md 走内部跳转
    container.querySelectorAll('a[href]').forEach(function (a) {
      var href = a.getAttribute('href');
      if (!href) return;
      // 页内锚点：[...](#xxx) —— JS 接管，不碰 location.hash（否则会触发 hashchange 把页面打回欢迎页）
      if (href.charAt(0) === '#' && href.length > 1) {
        var selfAnchor = safeDecode(href.slice(1));
        a.addEventListener('click', function (e) {
          e.preventDefault();
          scrollToAnchor(selfAnchor);
        });
        return;
      }
      if (/^(https?:|mailto:|tel:)/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
      var hashPart = '';
      var hi = href.indexOf('#');
      if (hi >= 0) { hashPart = href.slice(hi); href = href.slice(0, hi); }
      var dec = safeDecode(href);
      var p = resolvePath(base, dec);
      if (!p) return;

      if (/\.md$/i.test(p)) {
        if (pathSet[p]) {
          a.className = (a.className ? a.className + ' ' : '') + 'md-link';
          a.setAttribute('data-go', p);
          if (hashPart) a.setAttribute('data-anchor', safeDecode(hashPart.slice(1)));
          a.removeAttribute('href');
          a.addEventListener('click', function (e) { e.preventDefault(); go(p, a.dataset.anchor || ''); });
        } else {
          a.className = (a.className ? a.className + ' ' : '') + 'md-link';
          a.removeAttribute('href');
          a.style.color = 'var(--fg-faint)';
          a.title = '目标文件不存在：' + p;
          a.addEventListener('click', function (e) { e.preventDefault(); toast('目标不存在：' + p, 2400); });
        }
      } else if (pathSet[p] || /\.(svg|png|jpe?g|gif|webp|pdf)$/i.test(p)) {
        a.href = encodeURI(p) + hashPart;
        a.target = '_blank';
        a.rel = 'noopener';
      } else {
        // 未知目标：保持原样但按正确基准解析
        a.href = encodeURI(p) + hashPart;
      }
    });

    // 3) wikilink 点击
    container.querySelectorAll('a.wikilink[data-go]').forEach(function (a) {
      a.addEventListener('click', function (e) {
        e.preventDefault();
        go(a.dataset.go, a.dataset.anchor || '');
      });
    });

    // 4) 表格套横滑容器
    container.querySelectorAll('table').forEach(function (tb) {
      if (tb.parentElement && tb.parentElement.classList.contains('table-wrap')) return;
      var w = document.createElement('div');
      w.className = 'table-wrap';
      tb.parentNode.insertBefore(w, tb);
      w.appendChild(tb);
    });

    // 5) 给标题加 id（marked 老版本可能没加），并记 data-anchor=标题原文
    //    同时解析 {#xxx} 自定义锚点（Python Markdown / Obsidian 风格）
    container.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(function (h, i) {
      var txt = h.textContent.trim();
      // 提取并移除 {#xxx}
      var m = txt.match(/^(.*?)\s*\{#([^}]+)\}\s*$/);
      var customId = '';
      if (m) {
        txt = m[1].trim();
        customId = m[2];
        h.textContent = txt;
      }
      h.setAttribute('data-anchor', txt);
      if (customId) {
        h.id = customId;
      } else if (!h.id) {
        h.id = slugify(txt) || ('h-' + i);
      }
    });

    // 6) 处理 Obsidian 块ID：段落/行尾的 ^xxx 转成元素 id
    //    渲染时 marked 会把 ^xxx 留在文本里，这里清理并挂到父元素
    container.querySelectorAll('p, li, blockquote').forEach(function (el) {
      var m = el.innerHTML.match(/^(.*?)\s*\^([A-Za-z0-9_-]+)\s*$/);
      if (m) {
        el.id = m[2];
        el.setAttribute('data-block-id', m[2]);
        el.innerHTML = m[1];
      }
    });
  }

  function renderMermaid(container, blocks) {
    if (!blocks.length) return Promise.resolve();
    if (!libs.mermaid || !window.mermaid) {
      container.querySelectorAll('.mermaid-box').forEach(function (box, i) {
        box.className = 'mermaid-err';
        box.textContent = '流程图库未加载，以下为源码：';
        var pre = document.createElement('pre');
        pre.textContent = blocks[i] || '';
        box.appendChild(pre);
      });
      return Promise.resolve();
    }
    var jobs = [];
    container.querySelectorAll('.mermaid-box').forEach(function (box) {
      var i = Number(box.dataset.mermaid);
      var code = blocks[i];
      if (!code) return;
      var id = 'mmd-' + (++mermaidSeq) + '-' + i;
      jobs.push(
        window.mermaid.render(id, code).then(function (res) {
          box.innerHTML = res.svg;
          var svg = box.querySelector('svg');
          if (svg) {
            svg.removeAttribute('height');
            svg.style.maxWidth = '100%';
            svg.style.height = 'auto';
          }
        }).catch(function (err) {
          box.className = 'mermaid-err';
          box.textContent = '流程图渲染失败（语法可能有误）：' + ((err && err.message) || '') ;
          var pre = document.createElement('pre');
          pre.textContent = code;
          box.appendChild(pre);
          // 清理 mermaid 可能残留的临时节点
          var junk = document.getElementById('d' + id);
          if (junk) junk.remove();
        })
      );
    });
    return Promise.all(jobs);
  }

  function typesetMath(container) {
    if (!libs.mathjax || !window.MathJax) return Promise.resolve();
    var MJ = window.MathJax;
    var start = MJ.startup && MJ.startup.promise ? MJ.startup.promise : Promise.resolve();
    return start.then(function () {
      if (MJ.typesetPromise) return MJ.typesetPromise([container]);
    }).catch(function () { /* 公式失败不影响正文 */ });
  }

  /* ───────── 加载文件 ───────── */
  function loadFile(path, anchor) {
    var token = ++loadingToken;
    currentPath = path;
    pendingAnchor = anchor || '';
    setCrumbs(path);
    revealActive(path);
    closeSidebar();
    showLoading();
    scrollEl.scrollTop = 0;

    var url = encodeURI(path);
    fetch(url, { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.text();
      })
      .then(function (md) {
        if (token !== loadingToken) return;   // 已被更新的请求取代
        var base = dirname(path);
        // 等 marked 就绪（首次渲染时可能还没加载完），否则公式/表格全丢
        return libsReady.then(function () {
          if (token !== loadingToken) return;
          var r = renderMarkdown(md, base);
          contentEl.innerHTML = r.html;
          postProcess(contentEl, base);
          var p1 = renderMermaid(contentEl, r.blocks);
          var p2 = p1.then(function () { return typesetMath(contentEl); });
          return p2.then(function () {
            if (token === loadingToken) {
              afterRender(path);
              if (pendingAnchor) { var a = pendingAnchor; pendingAnchor = ''; scrollToAnchor(a); }
            }
          });
        });
      })
      .catch(function (err) {
        if (token !== loadingToken) return;
        showError('文件加载失败', err.message + '（可能是网络中断或该文件已被移动）', path);
      });
  }

  // 滚动到锚点：支持 Obsidian 的 #标题、#^块ID、#自定义ID（如 {#s1}）三种格式
  function scrollToAnchor(anchor) {
    if (!anchor) return;
    var target = null;
    if (anchor.charAt(0) === '^') {
      // Obsidian 块ID：^xxx
      var bid = anchor.slice(1);
      target = contentEl.querySelector('[id="' + cssEscape(bid) + '"]') ||
               contentEl.querySelector('[data-block-id="' + cssEscape(bid) + '"]');
    } else {
      // 1) 直接按 id 命中（覆盖 {#s1}、{#KP01} 等自定义锚点）
      target = contentEl.querySelector('[id="' + cssEscape(anchor) + '"]');
      // 2) 按 slug 命中（marked 自动生成的标题 id）
      if (!target) {
        var slug = slugify(anchor);
        if (slug && slug !== anchor) target = contentEl.querySelector('#' + cssEscape(slug));
      }
      // 3) 按 data-anchor（标题原文）命中
      if (!target) target = contentEl.querySelector('[data-anchor="' + cssEscape(anchor) + '"]');
      // 4) 遍历标题模糊匹配：先精确，再 data-anchor 精确，再前缀匹配
      if (!target) {
        var heads = contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
        for (var i = 0; i < heads.length; i++) {
          var txt = heads[i].textContent.trim();
          var da = heads[i].getAttribute('data-anchor') || '';
          if (txt === anchor || da === anchor) { target = heads[i]; break; }
        }
      }
      // 5) 前缀匹配（Obsidian 行为：#KP01 能命中 "## KP01 xxx（回知识点）"）
      if (!target) {
        var heads2 = contentEl.querySelectorAll('h1,h2,h3,h4,h5,h6');
        for (var j = 0; j < heads2.length; j++) {
          var t2 = (heads2[j].getAttribute('data-anchor') || heads2[j].textContent || '').trim();
          if (t2.indexOf(anchor) === 0 || anchor.indexOf(t2) === 0) { target = heads2[j]; break; }
        }
      }
    }
    if (target) {
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      target.classList.add('anchor-flash');
      setTimeout(function () { target.classList.remove('anchor-flash'); }, 1600);
    } else {
      toast('未找到锚点：' + anchor, 2400);
    }
  }

  // 简易 slugify：与 Obsidian/marked 近似（小写、空格转-、去特殊字符）
  function slugify(s) {
    return String(s).trim().toLowerCase()
      .replace(/[^\w\一-龥\s-]/g, '')
      .replace(/\s+/g, '-');
  }

  function afterRender(path) {
    // 高亮当前文件在树里可见
    revealActive(path);
  }

  /* ───────── 侧栏开关 ───────── */
  function openSidebar() {
    sidebarEl.classList.add('open');
    backdropEl.classList.add('show');
    menuBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSidebar() {
    sidebarEl.classList.remove('open');
    backdropEl.classList.remove('show');
    menuBtn.setAttribute('aria-expanded', 'false');
  }
  menuBtn.addEventListener('click', function () {
    if (sidebarEl.classList.contains('open')) closeSidebar(); else openSidebar();
  });
  backdropEl.addEventListener('click', closeSidebar);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSidebar();
    // "/" 聚焦搜索
    if (e.key === '/' && document.activeElement !== searchEl) {
      e.preventDefault();
      if (window.innerWidth <= 820) openSidebar();
      searchEl.focus();
      searchEl.select();
    }
  });

  /* ───────── 回到顶部 ───────── */
  window.addEventListener('scroll', onScrollPassive, { passive: true });
  scrollEl.addEventListener('scroll', onScrollPassive, { passive: true });
  function onScrollPassive() {
    var y = window.pageYOffset || scrollEl.scrollTop || 0;
    topBtn.style.display = y > 600 ? 'grid' : 'none';
  }
  topBtn.addEventListener('click', function () {
    scrollEl.scrollTo({ top: 0, behavior: 'smooth' });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ───────── 随机 ───────── */
  $('randomLink').addEventListener('click', function (e) {
    e.preventDefault();
    if (!allFiles.length) return;
    var p = allFiles[Math.floor(Math.random() * allFiles.length)];
    go(p);
  });

  /* ───────── 启动 ───────── */
  function init() {
    var lp = bootLibs();
    // 关键：必须等 marked 就绪再首次渲染，否则会落到「纯文本」降级分支，
    // 公式与表格全部丢失（实测竞态：marked 已加载但 libs.marked 仍 false）。
    // mermaid / mathjax 失败不阻塞，正文仍可读。
    libsReady = lp.marked.catch(function () { return null; });

    fetch('file-tree.json', { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        allFiles = [];
        pathSet = {};
        collectFiles(data, '', allFiles);
        fileByBase = {};
        fileByLower = {};
        allFiles.forEach(function (p) {
          var k = stripExt(basename(p));
          if (!fileByBase[k]) fileByBase[k] = p;
          var kl = k.toLowerCase();
          if (!fileByLower[kl]) fileByLower[kl] = p;
        });
        renderTree(data);

        var r0 = pathFromHash();
        if (r0.path) {
          if (pathSet[r0.path]) loadFile(r0.path, r0.anchor);
          else { showError('文件不存在', '地址里的路径在仓库里找不到', r0.path); }
        } else {
          showWelcome();
        }
      })
      .catch(function (err) {
        treeEl.innerHTML = '<div class="empty-hint" style="color:#f85149">目录加载失败：' + escapeHtml(err.message) + '</div>';
        showError('目录加载失败', err.message, 'file-tree.json');
      });
  }

  init();
})();
</script>
</body>
