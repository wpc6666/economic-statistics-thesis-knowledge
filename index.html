<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经济统计学论文写作知识库</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            display: flex;
            height: 100vh;
            background: #f5f5f5;
        }
        /* 侧边栏 */
        .sidebar {
            width: 300px;
            background: #fff;
            border-right: 1px solid #e0e0e0;
            overflow-y: auto;
            padding: 20px;
        }
        .sidebar h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
        }
        .file-tree {
            font-size: 14px;
        }
        .file-tree ul {
            list-style: none;
            padding-left: 15px;
        }
        .file-tree li {
            padding: 3px 0;
            cursor: pointer;
            color: #555;
        }
        .file-tree li:hover {
            color: #007acc;
        }
        .file-tree li.folder {
            font-weight: bold;
            color: #333;
        }
        .file-tree li.active {
            background: #e3f2fd;
            color: #007acc;
            padding-left: 5px;
            border-radius: 3px;
        }
        /* 主内容区 */
        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: #fff;
            margin: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .content {
            max-width: 900px;
            margin: 0 auto;
            line-height: 1.8;
            color: #333;
        }
        .content h1 { font-size: 28px; margin: 20px 0 15px; color: #222; }
        .content h2 { font-size: 24px; margin: 20px 0 10px; color: #333; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .content h3 { font-size: 20px; margin: 15px 0 10px; color: #444; }
        .content p { margin: 10px 0; }
        .content code {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 14px;
        }
        .content pre {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 10px 0;
        }
        .content pre code {
            background: none;
            padding: 0;
        }
        .content table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
        }
        .content table th, .content table td {
            border: 1px solid #ddd;
            padding: 8px 12px;
            text-align: left;
        }
        .content table th {
            background: #f5f5f5;
        }
        .wikilink {
            color: #007acc;
            cursor: pointer;
            text-decoration: underline;
        }
        .wikilink:hover {
            color: #005a9e;
        }
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
        }
        .breadcrumb a {
            color: #007acc;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>📚 知识库</h2>
        <div class="file-tree" id="fileTree"></div>
    </div>
    <div class="main">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="content" id="content">
            <h1>欢迎使用经济统计学论文写作知识库</h1>
            <p>从左侧选择文件开始阅读。</p>
            <h2>📖 快速开始</h2>
            <ul>
                <li>如果你是小白：从 <strong>00_学前准备</strong> 开始</li>
                <li>如果你要写论文：从 <strong>11_方法选择决策</strong> 开始</li>
                <li>如果你想查知识点：在左侧目录搜索</li>
            </ul>
        </div>
    </div>

    <script>
        // 文件树数据（简化版）
        const fileTree = {
            "经济统计学论文从0基础到精通": {
                "00_学前准备": ["README.md"],
                "01_基础数学": ["README.md", "01_线性代数.md", "02_概率统计.md"],
                "02_描述统计": ["README.md", "01_集中趋势.md", "02_离散程度.md"],
                "03_相关与回归": ["README.md", "01_相关分析.md", "02_一元回归.md", "03_多元回归.md"],
                "11_方法选择决策": ["README.md", "01_决策树.md", "02_15种套路.md"],
                "12_毕业论文实战": ["README.md", "06_错误vs正确.md", "07_答辩50问.md"],
            },
            "教材笔记": {
                "01_综合评价": ["README.md"],
                "02_计量经济学": ["README.md"],
                "03_时间序列": ["README.md"],
                "04_多元统计": ["README.md"],
                "05_统计学原理": ["README.md"],
            },
            "原文件": {
                "综合评价": ["陈正伟_综合评价技术及应用_全书.md"],
                "计量经济学": ["陈强_计量经济学及Stata应用_全书.md"],
                "时间序列分析": ["王燕_时间序列分析基于R_全书.md"],
                "多元统计分析": ["何晓群_多元统计分析_全书.md"],
                "统计学原理": ["韩兆洲_统计学原理第7版_全书.md"],
            },
        };

        // 渲染文件树
        function renderFileTree(data, container, path = "") {
            for (const [key, value] of Object.entries(data)) {
                const li = document.createElement("li");
                const newPath = path ? `${path}/${key}` : key;
                
                if (Array.isArray(value)) {
                    // 文件
                    li.textContent = key;
                    li.onclick = () => loadFile(newPath);
                    container.appendChild(li);
                } else {
                    // 文件夹
                    li.className = "folder";
                    li.textContent = "📁 " + key;
                    const ul = document.createElement("ul");
                    li.onclick = () => {
                        ul.style.display = ul.style.display === "none" ? "block" : "none";
                    };
                    container.appendChild(li);
                    container.appendChild(ul);
                    renderFileTree(value, ul, newPath);
                }
            }
        }

        // 加载文件内容（模拟）
        function loadFile(path) {
            document.getElementById("breadcrumb").innerHTML = 
                '<a onclick="goHome()">首页</a> / ' + path.split("/").join(" / ");
            
            // 模拟加载（实际项目中用fetch加载md文件）
            document.getElementById("content").innerHTML = `
                <h1>${path.split("/").pop().replace(".md", "")}</h1>
                <p>正在加载 <code>${path}</code>...</p>
                <p style="color: #666; margin-top: 20px;">
                    💡 提示：这是演示页面。实际使用时，请用Obsidian打开本文件夹，
                    或用GitHub Pages部署后通过网页阅读。
                </p>
            `;

            // 高亮当前文件
            document.querySelectorAll(".file-tree li").forEach(li => {
                li.classList.remove("active");
            });
        }

        function goHome() {
            document.getElementById("breadcrumb").innerHTML = '<a onclick="goHome()">首页</a>';
            document.getElementById("content").innerHTML = `
                <h1>欢迎使用经济统计学论文写作知识库</h1>
                <p>从左侧选择文件开始阅读。</p>
            `;
        }

        // 初始化
        renderFileTree(fileTree, document.getElementById("fileTree"));
    </script>
</body>
</html>
