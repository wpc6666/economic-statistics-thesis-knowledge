<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>经济统计学论文写作知识库</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; display: flex; height: 100vh; }
        .sidebar { width: 300px; background: #f5f5f5; border-right: 1px solid #ddd; overflow-y: auto; }
        .sidebar-header { padding: 15px; background: #fff; border-bottom: 1px solid #ddd; }
        .sidebar-header h1 { font-size: 16px; margin-bottom: 10px; }
        .repo-btn { display: inline-block; padding: 6px 12px; background: #24292e; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; margin-bottom: 5px; }
        .hkust-btn { display: inline-block; padding: 6px 12px; background: #28a745; color: #fff; border-radius: 4px; text-decoration: none; font-size: 13px; }
        .file-tree { padding: 10px; font-size: 13px; }
        .file-tree ul { list-style: none; padding-left: 15px; }
        .file-tree li { padding: 3px 0; cursor: pointer; color: #333; }
        .file-tree li:hover { color: #007acc; }
        .file-tree li.folder { font-weight: bold; }
        .main { flex: 1; padding: 20px; overflow-y: auto; background: #fff; }
        .breadcrumb { margin-bottom: 15px; padding: 10px; background: #f5f5f5; border-radius: 4px; }
        .content { line-height: 1.8; }
        .welcome { text-align: center; padding: 100px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>📚 知识库</h1>
            <a href="https://github.com/wpc6666/economic-statistics-thesis-knowledge" target="_blank" class="repo-btn">⭐ 本仓库</a>
            <br>
            <a href="https://github.com/HKUSTDial/Supervisor-Skills" target="_blank" class="hkust-btn">📚 HKUST科研写作指南</a>
        </div>
        <div class="file-tree" id="fileTree">
            <p style="padding: 20px; color: #999;">加载中...</p>
        </div>
    </div>
    <div class="main">
        <div class="breadcrumb" id="breadcrumb">首页</div>
        <div class="content" id="content">
            <div class="welcome">
                <h1>欢迎使用经济统计学论文写作知识库</h1>
                <p>从0基础到论文精通</p>
                <p>从左侧选择文件开始阅读</p>
            </div>
        </div>
    </div>

    <script>
        let allFiles = [];

        async function loadFileTree() {
            try {
                const res = await fetch('file-tree.json');
                const data = await res.json();
                
                const container = document.getElementById('fileTree');
                container.innerHTML = '';
                
                renderTree(data, container);
                collectFiles(data, '');
            } catch (err) {
                document.getElementById('fileTree').innerHTML = '<p style="color: red; padding: 20px;">加载失败: ' + err.message + '</p>';
            }
        }

        function renderTree(data, container) {
            for (const key in data) {
                const value = data[key];
                const li = document.createElement('li');
                
                if (value === null) {
                    li.textContent = '📄 ' + key;
                    li.onclick = () => loadFile(key);
                    container.appendChild(li);
                } else {
                    li.textContent = '📁 ' + key;
                    const ul = document.createElement('ul');
                    li.onclick = () => {
                        ul.style.display = ul.style.display === 'none' ? 'block' : 'none';
                    };
                    container.appendChild(li);
                    container.appendChild(ul);
                    renderTree(value, ul);
                }
            }
        }

        function collectFiles(tree, path) {
            for (const key in tree) {
                const value = tree[key];
                const newPath = path ? path + '/' + key : key;
                if (value === null) {
                    allFiles.push(newPath);
                } else {
                    collectFiles(value, newPath);
                }
            }
        }

        async function loadFile(path) {
            document.getElementById('breadcrumb').textContent = '首页 / ' + path;
            
            try {
                const res = await fetch(encodeURI(path));
                const md = await res.text();
                document.getElementById('content').innerHTML = '<pre style="white-space: pre-wrap;">' + md + '</pre>';
            } catch (err) {
                document.getElementById('content').innerHTML = '<h1>加载失败</h1><p>' + err.message + '</p>';
            }
        }

        loadFileTree();
        
        // 在文件树最前面加特殊链接
        setTimeout(() => {
            const fileTree = document.getElementById('fileTree');
            
            // GitHub仓库链接
            const ghLi = document.createElement('li');
            ghLi.style.cssText = 'padding: 10px; background: #f6f8fa; border-radius: 4px; margin-bottom: 10px;';
            ghLi.innerHTML = '<a href="https://github.com/wpc6666/economic-statistics-thesis-knowledge" target="_blank" style="color: #24292e; text-decoration: none; font-weight: bold;">⭐ 前往GitHub仓库</a>';
            fileTree.insertBefore(ghLi, fileTree.firstChild);
            
            // HKUST链接
            const hkustLi = document.createElement('li');
            hkustLi.style.cssText = 'padding: 10px; background: #e6f7e6; border-radius: 4px; margin-bottom: 10px;';
            hkustLi.innerHTML = '<a href="https://github.com/HKUSTDial/Supervisor-Skills" target="_blank" style="color: #28a745; text-decoration: none; font-weight: bold;">📚 HKUST科研写作指南（原库实时更新）</a>';
            fileTree.insertBefore(hkustLi, fileTree.firstChild);
        }, 500);
    </script>
</body>
</html>
