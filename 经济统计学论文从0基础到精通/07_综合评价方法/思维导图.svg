  <text x="720" y="436" text-anchor="middle" fill="#1e3a8a" font-size="12">Excel实操：SUMPRODUCT算熵权，距离用…</text>
  <line x1="720" y1="450" x2="720" y2="460" stroke="#1e40af" stroke-width="1.2"/>
