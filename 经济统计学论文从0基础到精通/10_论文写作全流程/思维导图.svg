  <text x="450" y="672" text-anchor="middle" fill="#1e40af" font-size="13" font-style="italic">💡 论文=一个好问题+可信实证+清晰故事，前期定生死，后期定档次</text>
  <text x="450" y="732" text-anchor="middle" fill="#1e40af" font-size="11.5">📚 相关：11_方法选择决策 12_毕业论文实战 04_回归三大问题</text>
