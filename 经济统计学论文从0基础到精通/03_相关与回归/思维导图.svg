  <text x="720" y="236" text-anchor="middle" fill="#1e3a8a" font-size="12">原假设H₀:β=0，p值=拒绝H₀犯错的概率</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#1e40af" stroke-width="1.2"/>
