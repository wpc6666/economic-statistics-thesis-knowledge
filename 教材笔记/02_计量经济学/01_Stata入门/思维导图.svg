  <text x="450" y="236" text-anchor="middle" fill="#14532d" font-size="12">describe/list 看数据结构</text>
  <line x1="450" y1="250" x2="450" y2="260" stroke="#166534" stroke-width="1.2"/>
  <rect x="300" y="260" width="300" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" fill="#14532d" font-size="12">summarize, detail 偏度峰度</text>
