  <text x="450" y="436" text-anchor="middle" fill="#14532d" font-size="12">pwcorr x y, sig star(.05)…</text>
  <path d="M450 90 L450 120 L720 120 L720 150" stroke="#166534" stroke-width="1.8" fill="none"/>
  <rect x="580" y="150" width="280" height="50" rx="10" fill="#22c55e" stroke="#166534" stroke-width="1.5"/>
  <text x="720" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">变量与日志管理</text>
  <line x1="720" y1="200" x2="720" y2="210" stroke="#166534" stroke-width="1.2"/>
  <rect x="580" y="210" width="280" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="720" y="236" text-anchor="middle" fill="#14532d" font-size="12">gen lns=log(s) 生成新变量</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#166534" stroke-width="1.2"/>
  <rect x="580" y="260" width="280" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="720" y="286" text-anchor="middle" fill="#14532d" font-size="12">gen col=(s&gt;=16) 虚拟变量</text>
  <line x1="720" y1="300" x2="720" y2="310" stroke="#166534" stroke-width="1.2"/>
  <rect x="580" y="310" width="280" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="720" y="336" text-anchor="middle" fill="#14532d" font-size="12">rename/replace 修改数据</text>
  <line x1="720" y1="350" x2="720" y2="360" stroke="#166534" stroke-width="1.2"/>
  <rect x="580" y="360" width="280" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="720" y="386" text-anchor="middle" fill="#14532d" font-size="12">log using/close 记录输出</text>
  <line x1="720" y1="400" x2="720" y2="410" stroke="#166534" stroke-width="1.2"/>
  <rect x="580" y="410" width="280" height="42" rx="8" fill="#dcfce7" stroke="#22c55e" stroke-width="1.2"/>
  <text x="720" y="436" text-anchor="middle" fill="#14532d" font-size="12">ssc install 装外部命令</text>
  <rect x="80" y="500" width="740" height="80" rx="12" fill="#ffffff" stroke="#166534" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="528" text-anchor="middle" fill="#14532d" font-size="14" font-weight="bold">🔗 概念关系链</text>
  <text x="450" y="552" text-anchor="middle" fill="#14532d" font-size="13">use载入 → describe/sum审视 → 画图看分布 → 相关分析 → 回归</text>
  <text x="450" y="622" text-anchor="middle" fill="#166534" font-size="13" font-style="italic">💡 实证工具课:命令可复现,先描述统计再回归</text>
  <text x="450" y="682" text-anchor="middle" fill="#166534" font-size="11.5">📚 相关：第1章导论｜第3章数学回顾｜第4章一元回归</text>
</svg>