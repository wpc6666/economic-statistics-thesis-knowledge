<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="100%" height="100%" fill="#f0fdfa"/>
  <rect x="300" y="30" width="300" height="60" rx="14" fill="#0e7490" stroke="#164e63" stroke-width="2"/>
  <text x="450" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">第十章 因子分析</text>
  <path d="M450 90 L450 120 L180 120 L180 150" stroke="#0e7490" stroke-width="1.8" fill="none"/>
  <rect x="40" y="150" width="280" height="50" rx="10" fill="#06b6d4" stroke="#0e7490" stroke-width="1.5"/>
  <text x="180" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">FA基本原理</text>
  <line x1="180" y1="200" x2="180" y2="210" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="210" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="236" text-anchor="middle" fill="#164e63" font-size="12">因子模型：X=AF+ε</text>
  <line x1="180" y1="250" x2="180" y2="260" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="260" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="286" text-anchor="middle" fill="#164e63" font-size="12">公因子F不可测+特殊因子ε</text>
  <line x1="180" y1="300" x2="180" y2="310" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="310" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="336" text-anchor="middle" fill="#164e63" font-size="12">载荷aᵢⱼ=xᵢ与Fⱼ相关系数</text>
  <line x1="180" y1="350" x2="180" y2="360" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="360" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="386" text-anchor="middle" fill="#164e63" font-size="12">共同度hᵢ²=Σaᵢⱼ²</text>
  <line x1="180" y1="400" x2="180" y2="410" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="410" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="436" text-anchor="middle" fill="#164e63" font-size="12">主成分法估载荷：a=u√λ</text>
  <path d="M450 90 L450 120 L450 120 L450 150" stroke="#0e7490" stroke-width="1.8" fill="none"/>
  <rect x="300" y="150" width="300" height="50" rx="10" fill="#06b6d4" stroke="#0e7490" stroke-width="1.5"/>
  <text x="450" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">综合评价九步</text>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="210" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="236" text-anchor="middle" fill="#164e63" font-size="12">前四步同PCA(标准化→R)</text>
  <line x1="450" y1="250" x2="450" y2="260" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="260" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" fill="#164e63" font-size="12">求初始载荷矩阵A</text>
  <line x1="450" y1="300" x2="450" y2="310" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="310" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="336" text-anchor="middle" fill="#164e63" font-size="12">方差最大正交旋转(Kaiser)</text>
  <line x1="450" y1="350" x2="450" y2="360" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="360" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="386" text-anchor="middle" fill="#164e63" font-size="12">Thomson得分：F̂=A&#x27;R⁻¹X</text>
  <line x1="450" y1="400" x2="450" y2="410" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="410" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="436" text-anchor="middle" fill="#164e63" font-size="12">加权综合：F̂=ΣωᵢF̂ᵢ排序</text>
  <line x1="450" y1="450" x2="450" y2="460" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="300" y="460" width="300" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="486" text-anchor="middle" fill="#164e63" font-size="12">前提：KMO&gt;0.6且Bartlett显著</text>
  <path d="M450 90 L450 120 L720 120 L720 150" stroke="#0e7490" stroke-width="1.8" fill="none"/>
  <rect x="580" y="150" width="280" height="50" rx="10" fill="#06b6d4" stroke="#0e7490" stroke-width="1.5"/>
  <text x="720" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">PCA与FA异同</text>
  <line x1="720" y1="200" x2="720" y2="210" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="210" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="236" text-anchor="middle" fill="#164e63" font-size="12">同：标准化/消相关/降维</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="260" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="286" text-anchor="middle" fill="#164e63" font-size="12">异：FA分解模型vsPCA变换</text>
  <line x1="720" y1="300" x2="720" y2="310" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="310" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="336" text-anchor="middle" fill="#164e63" font-size="12">FA因子可解释但得分带误差</text>
  <line x1="720" y1="350" x2="720" y2="360" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="360" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="386" text-anchor="middle" fill="#164e63" font-size="12">PCA得分精确但含义模糊</text>
  <line x1="720" y1="400" x2="720" y2="410" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="410" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="436" text-anchor="middle" fill="#164e63" font-size="12">可结合：+聚类/判别/典型相关</text>
  <rect x="80" y="550" width="740" height="80" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="578" text-anchor="middle" fill="#164e63" font-size="14" font-weight="bold">🔗 概念关系链</text>
  <text x="450" y="602" text-anchor="middle" fill="#164e63" font-size="13">标准化 → 因子模型X=AF+ε → 旋转命名 → Thomson估分 → 加权综合排序</text>
  <text x="450" y="672" text-anchor="middle" fill="#0e7490" font-size="13" font-style="italic">💡 找潜在公因子的可解释降维</text>
  <text x="450" y="732" text-anchor="middle" fill="#0e7490" font-size="11.5">📚 相关：第九章 主成分分析(合成vs分解)</text>
</svg>