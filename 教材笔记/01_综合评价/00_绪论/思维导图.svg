  <text x="720" y="236" text-anchor="middle" fill="#164e63" font-size="12">单指标→指标体系→综合评价</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="260" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="286" text-anchor="middle" fill="#164e63" font-size="12">单指标局限：方向矛盾排不出名</text>
  <line x1="720" y1="300" x2="720" y2="310" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="310" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="336" text-anchor="middle" fill="#164e63" font-size="12">指标体系局限：全面但整体性退步</text>
  <line x1="720" y1="350" x2="720" y2="360" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="360" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="386" text-anchor="middle" fill="#164e63" font-size="12">多标准交叉验证防片面</text>
  <line x1="720" y1="400" x2="720" y2="410" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="580" y="410" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="720" y="436" text-anchor="middle" fill="#164e63" font-size="12">批判：拼凑指标/滥用算术平均</text>
  <rect x="80" y="500" width="740" height="80" rx="12" fill="#ffffff" stroke="#0e7490" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="528" text-anchor="middle" fill="#164e63" font-size="14" font-weight="bold">🔗 概念关系链</text>
  <text x="450" y="552" text-anchor="middle" fill="#164e63" font-size="13">评价 → 统计评价(数量性) → 单指标失效 → 指标体系整体退步 → 综合评价加权排序</text>
  <text x="450" y="622" text-anchor="middle" fill="#0e7490" font-size="13" font-style="italic">💡 全书总纲：三大关键技术总览</text>
  <text x="450" y="682" text-anchor="middle" fill="#0e7490" font-size="11.5">📚 相关：第一章 一般问题 · 第二~四章 指标/权数/方法</text>
</svg>