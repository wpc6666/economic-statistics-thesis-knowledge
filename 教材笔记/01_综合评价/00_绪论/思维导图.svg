  <text x="450" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">绪论 评价与综合评价</text>
  <path d="M450 90 L450 120 L180 120 L180 150" stroke="#0e7490" stroke-width="1.8" fill="none"/>
