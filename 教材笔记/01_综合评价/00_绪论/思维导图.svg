  <line x1="180" y1="200" x2="180" y2="210" stroke="#0e7490" stroke-width="1.2"/>
  <rect x="40" y="210" width="280" height="42" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="180" y="236" text-anchor="middle" fill="#164e63" font-size="12">评价：按标准量化测量下结论</text>
