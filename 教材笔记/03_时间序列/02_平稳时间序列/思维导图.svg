<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="100%" height="100%" fill="#faf5ff"/>
  <rect x="300" y="30" width="300" height="60" rx="14" fill="#6d28d9" stroke="#4c1d95" stroke-width="2"/>
  <text x="450" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">第2章 平稳时间序列</text>
  <path d="M450 90 L450 120 L180 120 L180 150" stroke="#6d28d9" stroke-width="1.8" fill="none"/>
  <rect x="40" y="150" width="280" height="50" rx="10" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="180" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">一、特征统计量</text>
  <line x1="180" y1="200" x2="180" y2="210" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="40" y="210" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="180" y="236" text-anchor="middle" fill="#4c1d95" font-size="12">均值 μ_t=E(X_t)</text>
  <line x1="180" y1="250" x2="180" y2="260" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="40" y="260" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="180" y="286" text-anchor="middle" fill="#4c1d95" font-size="12">方差 σ_t²=D(X_t)</text>
  <line x1="180" y1="300" x2="180" y2="310" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="40" y="310" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="180" y="336" text-anchor="middle" fill="#4c1d95" font-size="12">自协方差 γ(t,s)=E[(X_t-μ_t)(X…</text>
  <line x1="180" y1="350" x2="180" y2="360" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="40" y="360" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="180" y="386" text-anchor="middle" fill="#4c1d95" font-size="12">自相关 ρ=γ/√(DX_t·DX_s)</text>
  <line x1="180" y1="400" x2="180" y2="410" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="40" y="410" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="180" y="436" text-anchor="middle" fill="#4c1d95" font-size="12">ρ_k=γ(k)/γ(0)，规范性对称性非负定</text>
  <path d="M450 90 L450 120 L450 120 L450 150" stroke="#6d28d9" stroke-width="1.8" fill="none"/>
  <rect x="300" y="150" width="300" height="50" rx="10" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="450" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">二、平稳性定义</text>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="210" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="236" text-anchor="middle" fill="#4c1d95" font-size="12">严平稳：有限维分布不随时间平移</text>
  <line x1="450" y1="250" x2="450" y2="260" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="260" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" fill="#4c1d95" font-size="12">宽平稳：二阶矩存在+均值常数</text>
  <line x1="450" y1="300" x2="450" y2="310" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="310" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="336" text-anchor="middle" fill="#4c1d95" font-size="12">宽平稳③：γ仅依赖时间间隔k</text>
  <line x1="450" y1="350" x2="450" y2="360" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="360" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="386" text-anchor="middle" fill="#4c1d95" font-size="12">时序图：常数附近有界波动无趋势</text>
  <line x1="450" y1="400" x2="450" y2="410" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="410" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="436" text-anchor="middle" fill="#4c1d95" font-size="12">ACF图：ρ̂_k快速衰减到0</text>
  <line x1="450" y1="450" x2="450" y2="460" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="300" y="460" width="300" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="450" y="486" text-anchor="middle" fill="#4c1d95" font-size="12">正态序列：宽平稳⇔严平稳</text>
  <path d="M450 90 L450 120 L720 120 L720 150" stroke="#6d28d9" stroke-width="1.8" fill="none"/>
  <rect x="580" y="150" width="280" height="50" rx="10" fill="#a78bfa" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="720" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">三、纯随机检验</text>
  <line x1="720" y1="200" x2="720" y2="210" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="210" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="236" text-anchor="middle" fill="#4c1d95" font-size="12">白噪声：γ(k)=0,∀k≠0</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="260" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="286" text-anchor="middle" fill="#4c1d95" font-size="12">H0: ρ1=ρ2=...=ρm=0</text>
  <line x1="720" y1="300" x2="720" y2="310" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="310" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="336" text-anchor="middle" fill="#4c1d95" font-size="12">Q统计量=nΣρ̂²_k ~ χ²(m)</text>
  <line x1="720" y1="350" x2="720" y2="360" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="360" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="386" text-anchor="middle" fill="#4c1d95" font-size="12">LB统计量小样本更优</text>
  <line x1="720" y1="400" x2="720" y2="410" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="410" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="436" text-anchor="middle" fill="#4c1d95" font-size="12">p&gt;0.05白噪声停止分析</text>
  <line x1="720" y1="450" x2="720" y2="460" stroke="#6d28d9" stroke-width="1.2"/>
  <rect x="580" y="460" width="280" height="42" rx="8" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="720" y="486" text-anchor="middle" fill="#4c1d95" font-size="12">p&lt;0.05平稳非白噪声→建模</text>
  <rect x="80" y="550" width="740" height="80" rx="12" fill="#ffffff" stroke="#6d28d9" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="578" text-anchor="middle" fill="#4c1d95" font-size="14" font-weight="bold">🔗 概念关系链</text>
  <text x="450" y="602" text-anchor="middle" fill="#4c1d95" font-size="13">时序图 → ACF图衰减 → LB白噪声检验 → 平稳非白噪声 → ARMA</text>
  <text x="450" y="672" text-anchor="middle" fill="#6d28d9" font-size="13" font-style="italic">💡 建模前置筛选：只有平稳且非白噪声才值得建模</text>
  <text x="450" y="732" text-anchor="middle" fill="#6d28d9" font-size="11.5">📚 相关：第1章 五步法 / 第3章 ARMA建模</text>
</svg>