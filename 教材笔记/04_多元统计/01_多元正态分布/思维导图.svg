<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 730" width="900" height="730" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="100%" height="100%" fill="#fff7ed"/>
  <rect x="300" y="30" width="300" height="60" rx="14" fill="#c2410c" stroke="#7c2d12" stroke-width="2"/>
  <text x="450" y="68" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">第1章 多元正态分布</text>
  <path d="M450 90 L450 120 L180 120 L180 150" stroke="#c2410c" stroke-width="1.8" fill="none"/>
  <rect x="40" y="150" width="280" height="50" rx="10" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="180" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">一、数字特征与距离</text>
  <line x1="180" y1="200" x2="180" y2="210" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="210" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="236" text-anchor="middle" fill="#7c2d12" font-size="12">均值向量 μ=E(X)</text>
  <line x1="180" y1="250" x2="180" y2="260" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="260" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="286" text-anchor="middle" fill="#7c2d12" font-size="12">协方差阵 Σ=E[(X-μ)(X-μ)&#x27;]</text>
  <line x1="180" y1="300" x2="180" y2="310" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="310" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="336" text-anchor="middle" fill="#7c2d12" font-size="12">相关阵 R=标准化后</text>
  <line x1="180" y1="350" x2="180" y2="360" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="360" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="386" text-anchor="middle" fill="#7c2d12" font-size="12">马氏距离 d²=(x-μ)&#x27;Σ⁻¹(x-μ)</text>
  <line x1="180" y1="400" x2="180" y2="410" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="410" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="436" text-anchor="middle" fill="#7c2d12" font-size="12">样本协差阵 L/(n-1) 无偏</text>
  <path d="M450 90 L450 120 L450 120 L450 150" stroke="#c2410c" stroke-width="1.8" fill="none"/>
  <rect x="300" y="150" width="300" height="50" rx="10" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="450" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">二、多元正态 N_p(μ,Σ)</text>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="210" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="236" text-anchor="middle" fill="#7c2d12" font-size="12">密度 f(x)含|Σ|^(-1/2)exp</text>
  <line x1="450" y1="250" x2="450" y2="260" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="260" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" fill="#7c2d12" font-size="12">线性变换仍正态</text>
  <line x1="450" y1="300" x2="450" y2="310" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="310" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="336" text-anchor="middle" fill="#7c2d12" font-size="12">Σ对角⇒各分量独立</text>
  <line x1="450" y1="350" x2="450" y2="360" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="360" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="386" text-anchor="middle" fill="#7c2d12" font-size="12">不相关⇔独立（正态特有）</text>
  <line x1="450" y1="400" x2="450" y2="410" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="410" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="436" text-anchor="middle" fill="#7c2d12" font-size="12">边缘正态但反之不真</text>
  <path d="M450 90 L450 120 L720 120 L720 150" stroke="#c2410c" stroke-width="1.8" fill="none"/>
  <rect x="580" y="150" width="280" height="50" rx="10" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="720" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">三、四大抽样分布</text>
  <line x1="720" y1="200" x2="720" y2="210" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="580" y="210" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="720" y="236" text-anchor="middle" fill="#7c2d12" font-size="12">χ²→Wishart W_p(n,Σ)</text>
  <line x1="720" y1="250" x2="720" y2="260" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="580" y="260" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="720" y="286" text-anchor="middle" fill="#7c2d12" font-size="12">t→Hotelling T²</text>
  <line x1="720" y1="300" x2="720" y2="310" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="580" y="310" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="720" y="336" text-anchor="middle" fill="#7c2d12" font-size="12">F→Wilks Λ</text>
  <line x1="720" y1="350" x2="720" y2="360" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="580" y="360" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="720" y="386" text-anchor="middle" fill="#7c2d12" font-size="12">T²化F: (n-p+1)/(pn)T²~F</text>
  <line x1="720" y1="400" x2="720" y2="410" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="580" y="410" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="720" y="436" text-anchor="middle" fill="#7c2d12" font-size="12">Λ=|E|/|B+E|组内/总</text>
  <rect x="80" y="500" width="740" height="80" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="450" y="528" text-anchor="middle" fill="#7c2d12" font-size="14" font-weight="bold">🔗 概念关系链</text>
  <text x="450" y="552" text-anchor="middle" fill="#7c2d12" font-size="13">均值向量μ → 协差阵Σ → 马氏距离 → 多元正态 → Wishart/T²/Λ</text>
  <text x="450" y="622" text-anchor="middle" fill="#c2410c" font-size="13" font-style="italic">💡 整个多元统计分析的理论基石</text>
  <text x="450" y="682" text-anchor="middle" fill="#c2410c" font-size="11.5">📚 相关：第2章 均值检验 / 第4章 距离判别</text>
</svg>