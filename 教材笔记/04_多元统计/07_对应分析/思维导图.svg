  <text x="180" y="236" text-anchor="middle" fill="#7c2d12" font-size="12">R×C列联表行类×列类</text>
  <line x1="180" y1="250" x2="180" y2="260" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="260" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="286" text-anchor="middle" fill="#7c2d12" font-size="12">行剖面：每行频率分布</text>
  <line x1="180" y1="300" x2="180" y2="310" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="310" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="336" text-anchor="middle" fill="#7c2d12" font-size="12">列剖面：每列频率分布</text>
  <line x1="180" y1="350" x2="180" y2="360" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="40" y="360" width="280" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="180" y="386" text-anchor="middle" fill="#7c2d12" font-size="12">总惯量 = χ²/n</text>
  <path d="M450 90 L450 120 L450 120 L450 150" stroke="#c2410c" stroke-width="1.8" fill="none"/>
  <rect x="300" y="150" width="300" height="50" rx="10" fill="#fb923c" stroke="#c2410c" stroke-width="1.5"/>
  <text x="450" y="181" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">二、R型Q型对等</text>
  <line x1="450" y1="200" x2="450" y2="210" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="210" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="236" text-anchor="middle" fill="#7c2d12" font-size="12">R型：对列变量作因子分析</text>
  <line x1="450" y1="250" x2="450" y2="260" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="260" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="286" text-anchor="middle" fill="#7c2d12" font-size="12">Q型：对行变量作因子分析</text>
  <line x1="450" y1="300" x2="450" y2="310" stroke="#c2410c" stroke-width="1.2"/>
  <rect x="300" y="310" width="300" height="42" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.2"/>
  <text x="450" y="336" text-anchor="middle" fill="#7c2d12" font-size="12">两型特征值完全相同</text>
