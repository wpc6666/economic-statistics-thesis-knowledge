<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
<style>
text { font-family: "PingFang SC","Microsoft YaHei",sans-serif; }
.title { font-size: 18px; font-weight: bold; fill: #1a1a2e; text-anchor: middle; }
.q { font-size: 13px; font-weight: bold; fill: #fff; text-anchor: middle; }
.box { rx: 8; }
</style>
<rect width="800" height="1100" fill="#fafbfc"/>
<text x="400" y="30" class="title">多元统计方法选择决策图</text>
<rect x="180" y="60" width="440" height="36" fill="#e74c3c" class="box"/>
<text x="400" y="83" class="q">你的数据有分组标签吗？</text>
<rect x="180" y="160" width="440" height="36" fill="#e67e22" class="box"/>
<text x="400" y="183" class="q">没有标签→想自动分组</text>
<rect x="180" y="260" width="440" height="36" fill="#f1c40f" class="box"/>
<text x="400" y="283" class="q">样本有序还是无序？</text>
<rect x="180" y="340" width="440" height="36" fill="#2ecc71" class="box"/>
<text x="400" y="363" class="q">无序→系统聚类/K-means</text>
<rect x="180" y="420" width="440" height="36" fill="#9b59b6" class="box"/>
<text x="400" y="443" class="q">有序→Fisher最优分割</text>
<rect x="180" y="500" width="440" height="36" fill="#3498db" class="box"/>
<text x="400" y="523" class="q">有标签→预测新样本归类</text>
<rect x="180" y="580" width="440" height="36" fill="#1abc9c" class="box"/>
<text x="400" y="603" class="q">距离判别/Bayes/Fisher</text>
<rect x="180" y="660" width="440" height="36" fill="#d35400" class="box"/>
<text x="400" y="683" class="q">变量太多想降维？</text>
<rect x="180" y="740" width="440" height="36" fill="#c0392b" class="box"/>
<text x="400" y="763" class="q">只要方差最大→PCA</text>
<rect x="180" y="820" width="440" height="36" fill="#8e44ad" class="box"/>
<text x="400" y="843" class="q">要找隐藏因子可旋转→因子分析</text>
<rect x="180" y="900" width="440" height="36" fill="#2980b9" class="box"/>
<text x="400" y="923" class="q">只有距离矩阵→MDS</text>
<rect x="180" y="980" width="440" height="36" fill="#27ae60" class="box"/>
<text x="400" y="1003" class="q">两组变量相关→典型相关</text>
</svg>