<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" width="900" height="1500" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <style>
      .root { fill: #0e7490; stroke: #164e63; }
      .sec  { fill: #06b6d4; stroke: #0e7490; }
      .kp   { fill: #ecfeff; stroke: #06b6d4; }
      .txt-root { fill: #ffffff; font-size: 20px; font-weight: bold; }
      .txt-sec  { fill: #ffffff; font-size: 13px; font-weight: bold; }
      .txt-kp   { fill: #164e63; font-size: 11px; }
      .line { stroke: #0e7490; stroke-width: 1.2; fill: none; }
    </style>
  </defs>

  <rect x="250" y="20" width="400" height="56" rx="12" class="root"/>
  <text x="450" y="55" text-anchor="middle" class="txt-root">第三章 统计数据的整理与显示</text>

  <!-- 四步流程横条 -->
  <rect x="60" y="110" width="780" height="40" rx="8" class="kp"/>
  <text x="450" y="135" text-anchor="middle" class="txt-kp" style="font-weight:bold;font-size:13px;">四步流程：审核 → 分组 → 汇总 → 制表绘图</text>

  <!-- 7节 两列布局 -->
  <!-- 左列 4节 -->
  <line x1="450" y1="150" x2="200" y2="180" class="line"/>
  <line x1="450" y1="150" x2="450" y2="180" class="line"/>
  <line x1="450" y1="150" x2="700" y2="180" class="line"/>

  <!-- 左列 -->
  <rect x="60" y="180" width="280" height="36" rx="6" class="sec"/>
  <text x="200" y="203" text-anchor="middle" class="txt-sec">第一节 意义与程序</text>

  <rect x="60" y="230" width="280" height="36" rx="6" class="sec"/>
  <text x="200" y="253" text-anchor="middle" class="txt-sec">第二节 数据审核</text>

  <rect x="60" y="280" width="280" height="36" rx="6" class="sec"/>
  <text x="200" y="303" text-anchor="middle" class="txt-sec">第三节 统计分组</text>

  <rect x="60" y="330" width="280" height="36" rx="6" class="sec"/>
  <text x="200" y="353" text-anchor="middle" class="txt-sec">第四节 数据汇总</text>

  <!-- 右列 -->
  <rect x="560" y="180" width="280" height="36" rx="6" class="sec"/>
  <text x="700" y="203" text-anchor="middle" class="txt-sec">第五节 分布数列</text>

  <rect x="560" y="230" width="280" height="36" rx="6" class="sec"/>
  <text x="700" y="253" text-anchor="middle" class="txt-sec">第六节 数据显示</text>

  <rect x="560" y="280" width="280" height="36" rx="6" class="sec"/>
  <text x="700" y="303" text-anchor="middle" class="txt-sec">第七节 Excel 直方图</text>

  <!-- KP 节点 -->
  <line x1="200" y1="266" x2="200" y2="380" class="line"/>
  <rect x="60" y="380" width="280" height="30" rx="4" class="kp"/>
  <text x="200" y="400" text-anchor="middle" class="txt-kp">KP01 审核：完整性/及时性/正确性</text>

  <line x1="200" y1="316" x2="200" y2="420" class="line"/>
  <rect x="60" y="420" width="280" height="30" rx="4" class="kp"/>
  <text x="200" y="440" text-anchor="middle" class="txt-kp">KP02 分组种类（品质/数量/单项式/组距式）</text>

  <rect x="60" y="455" width="280" height="30" rx="4" class="kp"/>
  <text x="200" y="475" text-anchor="middle" class="txt-kp">KP03 组限与组中值</text>

  <rect x="60" y="490" width="280" height="30" rx="4" class="kp"/>
  <text x="200" y="510" text-anchor="middle" class="txt-kp">KP04 斯特吉斯公式 n=1+3.3lgN</text>

  <!-- 右列 KP -->
  <line x1="700" y1="216" x2="700" y2="380" class="line"/>
  <rect x="560" y="380" width="280" height="30" rx="4" class="kp"/>
  <text x="700" y="400" text-anchor="middle" class="txt-kp">KP05 频数分布数列（钟形/U形/J形）</text>

  <rect x="560" y="415" width="280" height="30" rx="4" class="kp"/>
  <text x="700" y="435" text-anchor="middle" class="txt-kp">KP06 累计次数（以下/以上；洛伦茨）</text>

  <line x1="700" y1="266" x2="700" y2="460" class="line"/>
  <rect x="560" y="460" width="280" height="30" rx="4" class="kp"/>
  <text x="700" y="480" text-anchor="middle" class="txt-kp">KP07 统计表结构（三线表）</text>

  <rect x="560" y="495" width="280" height="30" rx="4" class="kp"/>
  <text x="700" y="515" text-anchor="middle" class="txt-kp">KP08 统计图（条形/折线/饼/直方图）</text>

  <!-- 核心公式区 -->
  <rect x="60" y="560" width="780" height="180" rx="10" class="kp"/>
  <text x="450" y="590" text-anchor="middle" class="txt-kp" style="font-weight:bold;font-size:14px;">核心公式</text>
  <text x="80" y="620" class="txt-kp">全距 R = Xmax − Xmin</text>
  <text x="80" y="645" class="txt-kp">斯特吉斯组数 n = 1 + 3.3 lg N</text>
  <text x="80" y="670" class="txt-kp">组距 d = R / n（取整成 100/200/500…）</text>
  <text x="80" y="695" class="txt-kp">组中值 = (下限 + 上限) / 2</text>
  <text x="80" y="720" class="txt-kp">频率 = f / Σf × 100%</text>

  <!-- 易混辨析 -->
  <rect x="60" y="770" width="780" height="120" rx="10" class="kp"/>
  <text x="450" y="800" text-anchor="middle" class="txt-kp" style="font-weight:bold;font-size:14px;">三组易混辨析</text>
  <text x="80" y="828" class="txt-kp">① 直方图（连续变量，矩形紧挨） vs 条形图（离散类别，矩形有空隙）</text>
  <text x="80" y="852" class="txt-kp">② 以下累计（上限以下） vs 以上累计（下限以上）</text>
  <text x="80" y="876" class="txt-kp">③ Excel 上组限在内 ≠ 教材"含下限不含上限"</text>

  <text x="450" y="940" text-anchor="middle" class="txt-kp" style="font-size:13px;fill:#0e7490;">本章产出：一张频数分布表 + 一张直方图 → 进入第4–5章指标计算</text>
</svg>
