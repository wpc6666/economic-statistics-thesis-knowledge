<script src="db.js"></script>
<script>
(function() {
  'use strict';

  // ---------- 科目注册表 + 按需加载 ----------
  // 每科各拆成 data-<key>.js，
  // 切到哪一科才下载哪一科，首屏不再背 2.7MB。
  var SUBJECT_META = {
    west_econ: { name: '西方经济学', file: 'data-west_econ.js', expl: 'data-expl-west_econ.js' },
    pol_econ:  { name: '政治经济学', file: 'data-pol_econ.js',  expl: 'data-expl-pol_econ.js' },
    zonghe:    { name: '综合评价',   file: 'data-zonghe.js', expl: 'data-expl-zonghe.js' },
    jiliang:   { name: '计量经济学', file: 'data-jiliang.js', expl: 'data-expl-jiliang.js' },
    shixu:     { name: '时间序列分析', file: 'data-shixu.js', expl: 'data-expl-shixu.js' },
    duoyuan:   { name: '多元统计分析', file: 'data-duoyuan.js', expl: 'data-expl-duoyuan.js' },
    tongyuan:  { name: '统计学原理', file: 'data-tongyuan.js', expl: 'data-expl-tongyuan.js' }
  };
  var SUBJECT_KEYS = Object.keys(SUBJECT_META);
  // 选择题可用科目（全部）与主观题可用科目（有简答/论述的）
  var SUBJECT_ORDER = SUBJECT_KEYS.slice();

  // 已加载的科目数据：sub -> {name, choice:{chapters:[]}, subjective:{chapters:[]}}
  var SUBJ_DATA = Object.create(null);
  var SUBJ_EXPL = Object.create(null);      // sub -> {qid: 解析}
  var subjLoading = Object.create(null);    // sub -> Promise

  // 模拟卷单独一个文件，进模拟卷 tab 才下载
  var mockLoading = null;
  function loadMockPapers(cb) {
    if (window.EXAM_MOCK_PAPERS) { if (cb) cb(); return Promise.resolve(); }
    if (mockLoading) { if (cb) mockLoading.then(cb, function () {}); return mockLoading; }
    mockLoading = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = 'data-mock.js';
      s.async = true;
      s.onload = function () { resolve(); if (cb) cb(); };
      s.onerror = function () { mockLoading = null; reject(new Error('模拟卷加载失败')); };
      document.head.appendChild(s);
    });
    return mockLoading;
  }

  // 兼容旧引用：DATA.choice[sub] / DATA.subjective[sub] / DATA.mock_papers
  // 用 Proxy 懒取，切科目后自动能读到新加载的数据。
  var DATA = {
    get choice() {
      var o = {};
      SUBJECT_KEYS.forEach(function(sub) {
        var d = SUBJ_DATA[sub];
        o[sub] = (d && d.choice) || { chapters: [] };
      });
      return o;
    },
    get subjective() {
      var o = {};
      SUBJECT_KEYS.forEach(function(sub) {
        var d = SUBJ_DATA[sub];
        o[sub] = (d && d.subjective) || { chapters: [] };
      });
      return o;
    },
    get mock_papers() { return window.EXAM_MOCK_PAPERS || []; }
  };

  // 加载某科数据（幂等）：返回 Promise，已加载则立即 resolve
  // 单个源等多久算超时；到点还没 onload/onerror 就换下一个源
  var SUBJ_TIMEOUT = 12000;
  function loadSubject(sub) {
    if (!SUBJECT_META[sub]) return Promise.resolve();
    if (SUBJ_DATA[sub]) return Promise.resolve();
    if (subjLoading[sub]) return subjLoading[sub];
    var meta = SUBJECT_META[sub];
    var p = new Promise(function(resolve, reject) {
      var settled = false;
      var timer = null;
      var done = function(err) {
        if (settled) return;
        settled = true;
        if (timer) clearTimeout(timer);
        if (err) { delete subjLoading[sub]; reject(err); return; }
        var bucket = (window.EXAM_SUBJECT_DATA || {})[sub];
        if (!bucket) { delete subjLoading[sub]; reject(new Error('科目数据缺失: ' + sub)); return; }
        SUBJ_DATA[sub] = bucket;
        buildIndexForSubject(sub);
        resolve();
      };
      var s = document.createElement('script');
      s.src = meta.file;
      s.async = true;
      s.onload = function() { done(null); };
      s.onerror = function() { done(new Error('科目数据加载失败: ' + meta.file)); };
      // 关键：网络半死不活时 <script> 既不 onload 也不 onerror，回调永不到来，
      // 页面就永久停在「加载中」。加硬超时兜底，让失败可见、可重试。
      timer = setTimeout(function() {
        done(new Error('科目数据加载超时: ' + meta.file));
      }, SUBJ_TIMEOUT);
      document.head.appendChild(s);
    });
    subjLoading[sub] = p;
    return p;
  }

  // 加载某科的选择题解析（幂等：下载中的请求会排队复用，不会重复插 <script>）
  var explLoading = {};
  var explQueue = {};
  function loadSubjectExpl(sub, cb) {
    var meta = SUBJECT_META[sub];
    if (!meta) { if (cb) cb(); return; }
    if (SUBJ_EXPL[sub]) { if (cb) cb(); return; }
    if (explLoading[sub]) { if (cb) explQueue[sub].push(cb); return; }
    explLoading[sub] = true;
    explQueue[sub] = cb ? [cb] : [];
    var s = document.createElement('script');
    s.src = meta.expl;
    s.async = true;
    var done = function () {
      explLoading[sub] = false;
      var qs = explQueue[sub] || [];
      explQueue[sub] = [];
      qs.forEach(function (f) { try { f(); } catch (e) {} });
    };
    s.onload = function () {
      SUBJ_EXPL[sub] = (window.EXAM_SUBJECT_EXPL || {})[sub] || {};
      done();
    };
    s.onerror = function () { console.warn('解析文件加载失败: ' + meta.expl); done(); };
    document.head.appendChild(s);
  }

  // 取某题解析文本
  function explTextOf(sub, qid) {
    if (SUBJ_EXPL[sub]) return SUBJ_EXPL[sub][qid] || '';
    return '';
  }

  // 当前科目选择题是否已经加载到 qIndex
  function subjectReady(sub) { return !!SUBJ_DATA[sub]; }

  // 确保某科就绪后执行 cb：已就绪同步执行，未就绪先下载再执行。
  // 失败时自动重试 2 次（退避 1.5s / 3s），仍失败才在页面内提示并给「重试」按钮——
  // 用 alert 会把整页交互锁死，用户只能刷新，体验上就是「永远打不开」。
  var SUBJ_RETRY = 2;
  function ensureSubject(sub, cb, errCb) {
    if (SUBJ_DATA[sub]) { if (cb) cb(); return; }
    var attempt = 0;
    var tryLoad = function () {
      loadSubject(sub).then(
        function () { if (cb) cb(); },
        function (e) {
          console.warn('[科目加载失败]', sub, attempt, e && e.message);
          if (attempt < SUBJ_RETRY) {
            attempt++;
            setTimeout(tryLoad, 1500 * attempt);
            return;
          }
          if (errCb) errCb(e);
          else subjectLoadFailed(sub, e);
        }
      );
    };
    tryLoad();
  }

  // 加载彻底失败：在当前页面内提示（不弹窗、不锁死），并给一键重试
  function subjectLoadFailed(sub, e) {
    var meta = SUBJECT_META[sub] || {};
    var name = meta.name || sub;
    var host = document.querySelector('.tab-content:not(.hidden)') || document.body;
    var old = host.querySelector('.subj-fail');
    if (old) old.remove();
    var box = document.createElement('div');
    box.className = 'subj-fail';
    box.innerHTML =
      '<div class="subj-fail-title">「' + escapeHtml(name) + '」的数据没能加载下来</div>' +
      '<div class="subj-fail-sub">多半是网络抖动或页面缓存了半份文件，已经自动重试过 2 次。' +
          '下面若仍显示着旧题目，是上一次打开时的残留，点「重新加载这一科」才会更新。</div>' +
      '<div class="subj-fail-actions">' +
        '<button type="button" class="user-btn" id="subjFailRetry">重新加载这一科</button>' +
        '<button type="button" class="user-btn" id="subjFailReload">刷新整页</button>' +
      '</div>';
    host.insertBefore(box, host.firstChild);
    var rb = box.querySelector('#subjFailRetry');
    if (rb) rb.addEventListener('click', function () {
      box.remove();
      delete subjLoading[sub];
      ensureSubject(sub, function () {
        // 重试成功后按当前 tab 重画
        var active = document.querySelector('.tab.active');
        if (active) active.click();
      }, function () { subjectLoadFailed(sub, e); });
    });
    var rl = box.querySelector('#subjFailReload');
    if (rl) rl.addEventListener('click', function () { location.reload(); });
  }

  // 空闲时预取某科解析，答题时不用再等
  function preloadSubjectExpl(sub) {
    var kick = function () { loadSubjectExpl(sub, null); };
    if (window.requestIdleCallback) requestIdleCallback(kick, { timeout: 6000 });
    else setTimeout(kick, 2000);
  }

  // ---------- 题目索引：qid → 题目对象 + 元信息 ----------
  // 用于错题本反查题目、全局统计
  const qIndex = {};
  function buildIndexForSubject(sub) {
    var d = SUBJ_DATA[sub];
    if (!d) return;
    (d.choice.chapters || []).forEach(function(ch) {
      (ch.kps || []).forEach(function(kp) {
        (kp.questions || []).forEach(function(q) {
          qIndex[q.id] = { q: q, type: 'choice', subject: sub, chapterName: ch.name, kpName: kp.name, kpFile: kp.file || '' };
        });
      });
    });
    (d.subjective.chapters || []).forEach(function(ch) {
      (ch.short_questions || []).forEach(function(q) {
        qIndex[q.id] = { q: q, type: 'short', subject: sub, chapterName: ch.name, kpFile: q.kp_file || '' };
      });
      (ch.essay_questions || []).forEach(function(q) {
        qIndex[q.id] = { q: q, type: 'essay', subject: sub, chapterName: ch.name, kpFile: q.kp_file || '' };
      });
    });
  }
  ['west_econ', 'pol_econ'].forEach(buildIndexForSubject);

  // ---------- 解析文本：按科目按需加载 ----------
  // 解析体积和题库相当，但只有答完题才需要，按科目拆成 data-expl-<科目>.js。
  // 切到哪一科才下哪一科的解析，不再拉 2.3MB 的全量文件。

  // 取解析：优先内联，其次查按需加载的表
  function explOf(q) {
    if (!q) return '';
    if (q.explanation) return q.explanation;
    if (!q.id) return '';
    // 按 qid 前缀判断所属科目，避免跨科误取
    var sub = subjectOfQid(q.id);
    if (sub) {
      var t = explTextOf(sub, q.id);
      if (t) return t;
    }
    // 旧版合并解析文件（已停用），仅兼容浏览器缓存里残留的情况
    if (window.EXAM_EXPL && window.EXAM_EXPL[q.id]) return window.EXAM_EXPL[q.id];
    for (var i = 0; i < SUBJECT_KEYS.length; i++) {
      var s = SUBJECT_KEYS[i];
      if (SUBJ_EXPL[s] && SUBJ_EXPL[s][q.id]) return SUBJ_EXPL[s][q.id];
    }
    return '';
  }

  // qid 首段即科目 key（west_econ_... / zonghe_... / jiliang_...）
  function subjectOfQid(qid) {
    if (!qid) return null;
    for (var i = 0; i < SUBJECT_KEYS.length; i++) {
      var s = SUBJECT_KEYS[i];
      if (qid === s || qid.indexOf(s + '_') === 0) return s;
    }
    return null;
  }

  // 把页面上还没填上解析的 .exp-body 回填（解析文件到达后调用）
  function hydrateExpl(root) {
    var scope = root || document;
    var nodes = scope.querySelectorAll('.exp-body[data-qid]');
    var filled = 0;
    nodes.forEach(function (el) {
      if (el.getAttribute('data-filled') === '1') return;
      var qid = el.getAttribute('data-qid');
      if (!qid) return;
      // 用 qid 反查题目，才能按科目定位解析文件
      var txt = '';
      if (qIndex[qid] && qIndex[qid].q) txt = explOf(qIndex[qid].q);
      if (!txt && window.EXAM_EXPL) txt = window.EXAM_EXPL[qid] || '';
      if (!txt) return;
      el.innerHTML = renderMd(txt);
      el.setAttribute('data-filled', '1');
      filled++;
    });
    if (filled) enhanceMd(scope);
    return filled;
  }

  // 渲染解析区：数据在就直出，不在就给占位并登记回填
  function explHtmlFor(q) {
    if (!q) return '';
    var txt = explOf(q);
    if (txt) {
      return '<div class="exp-body" data-qid="' + escapeHtml(q.id) + '" data-filled="1">'
             + renderMd(txt) + '</div>';
    }
    var _sub = subjectOfQid(q.id);
    if (_sub) loadSubjectExpl(_sub, function () { hydrateExpl(document); drawFcExpIfNeeded(); });
    return '<div class="exp-body" data-qid="' + escapeHtml(q.id) + '" data-filled="0">'
           + '<span class="exp-loading">解析加载中…</span></div>';
  }

  // ---------- 工具函数 ----------
  // 易错点：数据里没有独立字段，惯例是把「易错：…」写在 scoring 末尾（也有写在 answer 里的）。
  // 这里从两处抽出来单独成块，抽不到就不显示。
  function extractPitfalls(q) {
    var out = [];
    [q.scoring, q.answer].forEach(function (src) {
      if (!src) return;
      String(src).split(/\n+/).forEach(function (line) {
        // 数据里主流的写法是「易丢分处：…」，也有「易错：…」「陷阱：…」
        var m = line.match(/(?:易错点?|易丢分处?|陷阱)[:：]\s*(.+)$/);
        if (m && m[1]) {
          m[1].split(/[；;、]/).forEach(function (piece) {
            var t = piece.trim().replace(/[。.]$/, '');
            if (t.length > 1 && out.indexOf(t) < 0) out.push(t);
          });
        }
      });
    });
    return out;
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 渲染 markdown 文本：支持 markdown、mermaid 图、KaTeX 公式
  // 渐进增强：marked/mermaid/katex 任一未加载时退回纯文本
  // 先把 $$...$$ 与 $...$ 从 markdown 里挖出来占位，避免 marked 把公式里的 _ * \ 当语法吃掉
  function protectMath(src) {
    var store = [];
    var out = src.replace(/\$\$([\s\S]+?)\$\$/g, function (m) {
      store.push(m); return '\u0000M' + (store.length - 1) + '\u0000';
    }).replace(/\$([^\$\n]+?)\$/g, function (m) {
      store.push(m); return '\u0000M' + (store.length - 1) + '\u0000';
    });
    return { text: out, store: store };
  }
  function restoreMath(html, store) {
    return html.replace(/\u0000M(\d+)\u0000/g, function (m, i) {
      var v = store[+i];
      return v == null ? m : v;
    });
  }
  function renderMd(text) {
    if (!text) return '';
    var raw = String(text);
    var html;
    if (window.marked) {
      try {
        var pm = protectMath(raw);
        html = restoreMath(marked.parse(pm.text), pm.store);
      } catch (e) {
        html = '<p>' + escapeHtml(raw).replace(/\n/g, '<br>') + '</p>';
      }
    } else {
      html = '<p>' + escapeHtml(raw).replace(/\n/g, '<br>') + '</p>';
    }
    return '<div class="md-body">' + html + '</div>';
  }

  // 渲染后处理：扫描容器里的 mermaid 图和 KaTeX 公式
  function enhanceMd(container) {
    if (!container) return;

    // 库还在异步加载：等 __EXAM_LIBS_READY 落定后对同一个容器重跑一次，
    // 否则背题卡片会在 mermaid/KaTeX 到位前渲染完，图和公式以源码形式留在页面上。
    // 公式与 mermaid 分别判断：mermaid 是 2.5MB 的大包，常比公式晚到好几秒，
    // 用「两者都缺」做条件会让已经能渲染的公式白等。
    if ((!window.mermaid || !window.renderMathInElement) && window.__EXAM_LIBS_READY
        && !container.getAttribute('data-reenhance')) {
      container.setAttribute('data-reenhance', '1');
      // 公式链先到就先重跑：它通常 5-6 秒就绪，而 mermaid 可能 25 秒以上
      var mathReady = window.__EXAM_MATH_READY || window.__EXAM_LIBS_READY;
      mathReady.then(function () {
        if (container.isConnected) enhanceMd(container);
      }).catch(function () {});
      // 全部库落定后再收尾一次（mermaid 到位），然后清标记
      window.__EXAM_LIBS_READY.then(function () {
        container.removeAttribute('data-reenhance');
        if (container.isConnected) enhanceMd(container);
      }).catch(function () {});
    }

    // mermaid：把 <pre><code class="language-mermaid"> 转成 <div class="mermaid">
    if (window.mermaid) {
      container.querySelectorAll('pre code.language-mermaid').forEach(function(el) {
        var div = document.createElement('div');
        div.className = 'mermaid';
        div.textContent = el.textContent;
        el.closest('pre').replaceWith(div);
      });
      // 还有可能是 ```mermaid 开头的代码块，marked解析后可能class不对
      container.querySelectorAll('pre code').forEach(function(el) {
        if (el.textContent.trim().startsWith('graph ') || el.textContent.trim().startsWith('flowchart ')) {
          var div = document.createElement('div');
          div.className = 'mermaid';
          div.textContent = el.textContent;
          el.closest('pre').replaceWith(div);
        }
      });
      // 只渲染尚未处理过的节点：重复对已出图的节点调用 run() 会抛错并把错误塞回正文
      var pending = container.querySelectorAll('.mermaid:not([data-processed])');
      if (pending.length) {
        try {
          mermaid.run({ nodes: pending });
        } catch (e) {
          console.warn('mermaid render error:', e);
        }
      }
    }
    
    // KaTeX 公式
    if (window.renderMathInElement) {
      try {
        renderMathInElement(container, {
          delimiters: [
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false},
            {left: '\\(', right: '\\)', display: false},
            {left: '\\[', right: '\\]', display: true}
          ],
          // 已经渲染过公式的子树跳过：enhanceMd 会被重跑多次（库迟到），
          // 重复对同一段 $...$ 调用会把 KaTeX 生成的 MathML 注释文本再渲染一遍，页面上出现三份重复公式。
          ignoredTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
          ignoredClasses: ['katex', 'katex-display', 'no-math'],
          throwOnError: false
        });
      } catch (e) {
        console.warn('katex render error:', e);
      }
    }

    // mermaid 渲染时会把自己的 <style> 一起塞进容器（里面的 #mermaid-xxx 规则），
    // 这些样式在 document.head 里已有一份，留在正文里只会让 textContent 读到一堆 CSS 噪声。
    container.querySelectorAll('style').forEach(function (el) { el.remove(); });
    // mermaid.run() 是异步的：它渲染完成后才把自己那份 <style> 插进容器，
    // 所以再补几轮剥离（最多 6 秒），否则正文 textContent 里会混进 CSS 规则文本。
    if (!container.getAttribute('data-style-swept')) {
      container.setAttribute('data-style-swept', '1');
      var sweeps = 0;
      var sweepTimer = setInterval(function () {
        sweeps++;
        if (!container.isConnected || sweeps > 6) { clearInterval(sweepTimer); return; }
        container.querySelectorAll('style').forEach(function (el) { el.remove(); });
      }, 1000);
    }
  }

  // Fisher-Yates 洗牌（返回新数组，不改原数组）
  function shuffleArray(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // 把一道选择题的选项打乱：返回 [{display:'A', original:'A', text:'...'}, ...]
  // display 是打乱后位置上显示的 A/B/C/D；original 是题库里的原始字母（用于判对错、写 DB）
  // 打乱后 q.answer（原始字母）对应的显示位置字母，用于「正确答案：X」文案
  function displayLetterOf(opts, original) {
    for (var i = 0; i < opts.length; i++) {
      if (opts[i].original === original) return opts[i].display;
    }
    return original;
  }

  function buildShuffledOptions(q) {
    const letters = ['A','B','C','D'].filter(function(l){ return q.options[l]; });
    const pool = letters.map(function(l){ return { original: l, text: q.options[l] }; });
    const shuffled = shuffleArray(pool);
    return shuffled.map(function(item, i) {
      return { display: 'ABCD'[i], original: item.original, text: item.text };
    });
  }

  function getChapters(subject, type) {
    if (type === 'choice') return (DATA.choice[subject] || {}).chapters || [];
    return (DATA.subjective[subject] || {}).chapters || [];
  }

  // ---------- 全局进度统计（顶部统计栏） ----------
  // 全局统计只算已加载的科目 —— 未加载的科不计入分母，
  // 否则首屏显示「已做 5 / 1565」会让人以为漏了很多。
  function countAllQuestions() {
    let choiceTotal = 0, shortTotal = 0, essayTotal = 0;
    SUBJECT_KEYS.forEach(function(sub) {
      var d = SUBJ_DATA[sub];
      if (!d) return;
      (d.choice.chapters || []).forEach(function(ch) {
        (ch.kps || []).forEach(function(kp) { choiceTotal += (kp.questions || []).length; });
      });
      (d.subjective.chapters || []).forEach(function(ch) {
        shortTotal += (ch.short_questions || []).length;
        essayTotal += (ch.essay_questions || []).length;
      });
    });
    return { choiceTotal: choiceTotal, shortTotal: shortTotal, essayTotal: essayTotal };
  }

  function updateGlobalProgress() {
    const totals = countAllQuestions();
    const p = DB.loadProgress();

    // 选择题：已做 + 正确率
    let choiceDone = 0, choiceCorrect = 0;
    Object.keys(p.choice).forEach(function(qid) {
      const r = p.choice[qid];
      if (r && r.done) {
        choiceDone++;
        if (r.correct) choiceCorrect++;
      }
    });
    document.getElementById('gpChoice').textContent = '已做 ' + choiceDone + '/' + totals.choiceTotal;
    const accEl = document.getElementById('gpChoiceAcc');
    if (choiceDone > 0) {
      const acc = Math.round(choiceCorrect / choiceDone * 100);
      accEl.textContent = '正确率 ' + acc + '%';
      accEl.classList.toggle('zero', acc < 60);
    } else {
      accEl.textContent = '正确率 --';
      accEl.classList.remove('zero');
    }

    // 简答题：从 progress.subjective 里筛 type=short 的
    let shortDone = 0, essayDone = 0;
    Object.keys(p.subjective).forEach(function(qid) {
      const meta = qIndex[qid];
      if (meta && meta.type === 'short') shortDone++;
      else if (meta && meta.type === 'essay') essayDone++;
    });
    document.getElementById('gpShort').textContent = '已看答案 ' + shortDone + '/' + totals.shortTotal;
    document.getElementById('gpEssay').textContent = '已看答案 ' + essayDone + '/' + totals.essayTotal;

    // 错题本数量
    const wrongCnt = (p.wrong_questions || []).length;
    document.getElementById('gpWrong').textContent = '待复习 ' + wrongCnt;
  }

  // ---------- 顶栏收起 ----------
  // 点过任意 tab 就说明已经进入答题状态，顶栏不再占位；刷新页面时重新出现。
  function hideTopBar() {
    const bar = document.querySelector('.top-bar');
    if (!bar || bar.getAttribute('data-hidden') === '1') return;
    bar.setAttribute('data-hidden', '1');
    bar.style.display = 'none';
  }


  // ---------- 右侧侧栏（答题卡 + 进度 + 快捷操作） ----------
  // 只用一份 DOM，各 tab 渲染完成后调用 sideRender 覆写内容；
  // 切换 tab 时先 sideClear，避免上一个 tab 的卡片残留。
  var sideCurrentRef = null;   // { list, idx, onJump }
  var sideHandlers = null;     // 导航/评分按钮的绑定函数
  var sideClockTimer = null;
  var sideClockBase = 0;

  function sidePanelEl() { return document.getElementById('sidePanel'); }

  function sideShow(on) {
    var el = sidePanelEl();
    if (!el) return;
    sideMountToggle();
    el.classList.toggle('hidden', !on);
    document.body.classList.toggle('has-side', !!on);
    // 窄屏默认收成工具条（用户点「答题卡」再展开）；宽屏直接展开
    if (window.innerWidth < 1080) el.classList.add('is-bar');
    else el.classList.remove('is-bar');
    if (!on && sideClockTimer) { clearInterval(sideClockTimer); sideClockTimer = null; }
  }

  function sideClear() {
    sideCurrentRef = null;
    sideHandlers = null;
    var b = document.getElementById('spBubbles');
    if (b) b.innerHTML = '';
    var a = document.getElementById('spActions');
    if (a) a.innerHTML = '';
    var s = document.getElementById('spStat');
    if (s) s.textContent = '已做 0 / 0';
    var p = document.getElementById('spPbar');
    if (p) p.style.width = '0%';
    var c = document.getElementById('spCount');
    if (c) c.textContent = '答题卡';
    var k = document.getElementById('spClock');
    if (k) k.textContent = '00:00';
    if (sideClockTimer) { clearInterval(sideClockTimer); sideClockTimer = null; }
  }

  function sideClock(startTs) {
    if (sideClockTimer) { clearInterval(sideClockTimer); sideClockTimer = null; }
    sideClockBase = startTs || Date.now();
    var tick = function () {
      var el = document.getElementById('spClock');
      if (!el) return;
      var sec = Math.floor((Date.now() - sideClockBase) / 1000);
      var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
      var pad = function (n) { return (n < 10 ? '0' : '') + n; };
      el.textContent = (h ? pad(h) + ':' : '') + pad(m) + ':' + pad(s);
    };
    tick();
    sideClockTimer = setInterval(tick, 1000);
  }

  // 答题卡网格：item = { id, label, status: 'undone'|'done'|'right'|'wrong', flag }
  function sideBubbles(items, currentIdx, onJump) {
    var box = document.getElementById('spBubbles');
    if (!box) return;
    if (!items || !items.length) { box.innerHTML = '<div class="sp-count">本组暂无题号</div>'; return; }
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      html += '<button class="bubble b-' + it.status + (it.flag ? ' b-flag' : '') + '"' +
              ' data-side-jump="' + i + '"' + (i === currentIdx ? ' data-current="1"' : '') +
              ' title="' + escapeHtml(it.label) + '">' + escapeHtml(String(i + 1)) + '</button>';
    }
    box.innerHTML = html;
    box.querySelectorAll('[data-side-jump]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        onJump(parseInt(btn.getAttribute('data-side-jump'), 10));
      });
    });
  }

  function sideStat(done, total, right, wrong, label) {
    var s = document.getElementById('spStat');
    var head = label || '已做';
    if (s) s.textContent = head + ' ' + done + ' / ' + total +
      (right !== null && right !== undefined ? ' · 掌握 ' + right + ' · 待攻坚 ' + wrong : '');
    var p = document.getElementById('spPbar');
    if (p) p.style.width = (total ? Math.round(done / total * 100) : 0) + '%';
  }

  function sideTitle(txt) {
    var c = document.getElementById('spCount');
    if (c) c.textContent = txt;
  }

  // buttons = [{ label, onClick, disabled, cls, id }]
  function sideActions(buttons) {
    var box = document.getElementById('spActions');
    if (!box) return;
    box.innerHTML = '';
    (buttons || []).forEach(function (b) {
      var el = document.createElement(b.href ? 'a' : 'button');
      el.className = 'sp-btn' + (b.cls ? ' ' + b.cls : '') + (b.wide ? ' wide' : '');
      el.textContent = b.label;
      if (b.href) { el.href = b.href; } else { el.type = 'button'; }
      if (b.disabled) el.disabled = true;
      if (b.onClick) el.addEventListener('click', b.onClick);
      box.appendChild(el);
    });
  }

  function sideToggleCollapse() {
    var el = sidePanelEl();
    if (!el) return;
    el.classList.toggle('is-bar');
    sideSyncToggleLabel();
  }

  function sideSyncToggleLabel() {
    var el = sidePanelEl();
    var btn = document.getElementById('spToggle');
    if (!el || !btn) return;
    var bar = el.classList.contains('is-bar');
    btn.textContent = bar ? '📋 答题卡' : '✕ 收起';
  }

  // 窄屏工具条上的展开/收起按钮（宽屏隐藏）
  function sideMountToggle() {
    var head = document.querySelector('.side-panel .sp-title');
    if (!head || document.getElementById('spToggle')) return;
    var btn = document.createElement('button');
    btn.id = 'spToggle';
    btn.type = 'button';
    btn.className = 'sp-toggle';
    btn.textContent = '📋 答题卡';
    btn.addEventListener('click', sideToggleCollapse);
    head.appendChild(btn);
  }

  // ---------- 标签页切换 ----------
  document.querySelectorAll('.tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
      tab.classList.add('active');
      const tabName = tab.dataset.tab;
      document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.add('hidden'); });
      document.getElementById('tab-' + tabName).classList.remove('hidden');

      // 进入答题后收起顶栏（返回主页/标题/登录），把竖直空间让给题面。
      // 首屏保留顶栏，方便还没进来时能回主页或登录。
      hideTopBar();

      // 侧栏每个 tab 自行铺内容，先清空再交给渲染函数
      sideClear();
      sideShow(true);
      sideSyncToggleLabel();
      sideClock(Date.now());

      if (tabName === 'choice') { ensureSubject(choiceState.subject, function () { updateChapterOptions('choice'); renderChoice(); preloadSubjectExpl(choiceState.subject); }); }
      else if (tabName === 'random') renderRandomHome();
      else if (tabName === 'short') { ensureSubject(subjStates.short.subject, function () { updateChapterOptions('short'); renderSubjective('short'); }); }
      else if (tabName === 'essay') { ensureSubject(subjStates.essay.subject, function () { updateChapterOptions('essay'); renderSubjective('essay'); }); }
      else if (tabName === 'fc') { ensureSubject(fcState.subject, function () { initFcFilters(); fcUpdateChapters(); renderFlashcard(); }); }
      else if (tabName === 'mock') loadMockPapers(function () { renderMockList(); });
      else if (tabName === 'wrong') renderWrongBook();
    });
  });

  // ---------- 选择题 ----------
  let choiceState = { subject: 'west_econ', chapterIdx: 0, qIdx: 0, currentQuestions: [] };

  function initChoiceFilters() {
    const subjectSel = document.getElementById('choiceSubject');
    const chapterSel = document.getElementById('choiceChapter');

    subjectSel.addEventListener('change', function() {
      var sub = subjectSel.value;
      choiceState.subject = sub;
      choiceState.chapterIdx = 0;
      choiceState.qIdx = 0;
      ensureSubject(sub, function() {
        updateChapterOptions('choice');
        renderChoice();
        updateGlobalProgress();
        preloadSubjectExpl(sub);
      });
    });

    chapterSel.addEventListener('change', function() {
      choiceState.chapterIdx = parseInt(chapterSel.value) || 0;
      choiceState.qIdx = 0;
      renderChoice();
    });
  }

  function updateChapterOptions(prefix) {
    const subject = document.getElementById(prefix + 'Subject').value;
    const chapters = getChapters(subject, prefix === 'choice' ? 'choice' : prefix);
    const sel = document.getElementById(prefix + 'Chapter');
    sel.innerHTML = chapters.map(function(ch, i) {
      return '<option value="' + i + '">' + escapeHtml(ch.name) + '</option>';
    }).join('');
  }

  function refreshChoiceChapterProgress() {
    const allQ = choiceState.currentQuestions;
    if (!allQ.length) return;
    let done = 0, correct = 0;
    const p = DB.loadProgress();
    allQ.forEach(function(q) {
      const r = p.choice[q.id];
      if (r && r.done) {
        done++;
        if (r.correct) correct++;
      }
    });
    document.getElementById('choiceProgressText').textContent = '已做 ' + done + ' / ' + allQ.length;
    document.getElementById('choiceProgressFill').style.width = (done / allQ.length * 100) + '%';
    document.getElementById('choiceAccuracy').textContent = done ? ('正确率 ' + Math.round(correct/done*100) + '%') : '正确率 --';
  }

  function renderChoice() {
    const subject = choiceState.subject;
    const chapters = (DATA.choice[subject] || {}).chapters || [];
    if (!chapters.length) return;

    const chapter = chapters[choiceState.chapterIdx];
    if (!chapter) return;

    // 收集当前章节所有题目，然后乱序（每次进入本章题目顺序都不同）
    let allQ = [];
    chapter.kps.forEach(function(kp) {
      kp.questions.forEach(function(q) {
        allQ.push(Object.assign({}, q, { kpName: kp.name, kpId: kp.id, kpFile: kp.file || '' }));
      });
    });
    choiceState.currentQuestions = shuffleArray(allQ);
    choiceState.qIdx = 0;

    refreshChoiceChapterProgress();
    renderChoiceQuestion();
  }

  function renderChoiceQuestion() {
    const area = document.getElementById('choiceArea');
    const qs = choiceState.currentQuestions;
    if (!qs.length) {
      area.innerHTML = '<div class="empty-state">本章暂无题目</div>';
      sideBubbles([], -1, function () {});
      sideActions([]);
      return;
    }
    const q = qs[choiceState.qIdx];
    const recorded = DB.loadProgress().choice[q.id];
    const opts = buildShuffledOptions(q);

    let html = `
      <div class="question-card">
        <div class="question-meta">
          <span>${escapeHtml(q.kpId)} · ${q.kpFile
            ? `<a class="kp-link" href="index.html#/${encodeURI(q.kpFile)}" target="_blank" rel="noopener" title="打开知识点原文（新标签页）">${escapeHtml(q.kpName)}</a>`
            : escapeHtml(q.kpName)}</span>
          <span>第 ${choiceState.qIdx + 1} / ${qs.length} 题</span>
        </div>
        <div class="question-stem">${escapeHtml(q.stem)}</div>
        <div class="options-list">
    `;

    opts.forEach(function(o) {
      let cls = 'option-btn';
      if (recorded && recorded.done) {
        cls += ' disabled';
        if (o.original === q.answer) cls += ' correct';
        else if (o.original === recorded.selected) cls += ' wrong';
      }
      html += `
        <button class="${cls}" data-letter="${o.display}" data-original="${o.original}">
          <span class="opt-letter">${o.display}</span>
          <span>${escapeHtml(o.text)}</span>
        </button>
      `;
    });

    html += '</div>';

    if (recorded && recorded.done) {
      html += `
        <div class="mt-12">
          <span class="answer-badge ${recorded.correct ? 'correct' : 'wrong'}">
            ${recorded.correct ? '✓ 回答正确' : '✗ 回答错误'}
          </span>
          <div class="explanation-box">
            <div class="exp-title">正确答案：${displayLetterOf(opts, q.answer)}. ${escapeHtml(q.options[q.answer] || '')}</div>
            <div>${explHtmlFor(q)}</div>
          </div>
        </div>
      `;
    }

    // 按钮 ID 加 choice 前缀，避免与其他 tab 冲突
    html += `
      <div class="nav-row">
        <button class="nav-btn" id="choicePrevQ" ${choiceState.qIdx === 0 ? 'disabled' : ''}>← 上一题</button>
        <button class="nav-btn" id="choiceNextQ" ${choiceState.qIdx === qs.length - 1 ? 'disabled' : ''}>下一题 →</button>
      </div>
    </div>
    `;

    area.innerHTML = html;
    enhanceMd(area);

    // 绑定选项点击
    if (!recorded || !recorded.done) {
      // 按需加载：只下当前这一科的解析，不再拉 2.3MB 的全量文件
      loadSubjectExpl(choiceState.subject, function () { hydrateExpl(area); });
      area.querySelectorAll('.option-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          const letter = btn.dataset.original; // 原始字母（显示位置可能被打乱）
          const correct = letter === q.answer;
          // 写本地+云端（recordChoice 内部自动更新错题统计）
          DB.recordChoice(q.id, { done: true, correct: correct, selected: letter });
          updateGlobalProgress();
          refreshChoiceChapterProgress();
          // 答对 → 自动进入下一题（不停留、不展开解析）；答错 → 停在本题自动展开解析等手动翻页
          if (correct && choiceState.qIdx < qs.length - 1) {
            choiceState.qIdx++;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
          renderChoiceQuestion();
        });
      });
    }

    // ---- 侧栏：答题卡 + 进度 + 上一题/下一题 ----
    const prog = DB.loadProgress().choice;
    var rightN = 0, wrongN = 0, doneN = 0;
    const cards = qs.map(function (item) {
      const rec = prog[item.id];
      var status = 'undone';
      if (rec && rec.done) {
        doneN++;
        if (rec.correct) { status = 'right'; rightN++; } else { status = 'wrong'; wrongN++; }
      }
      return { id: item.id, label: '第 ' + (qs.indexOf(item) + 1) + ' 题', status: status };
    });
    sideTitle('答题卡 · ' + qs.length + ' 题');
    sideBubbles(cards, choiceState.qIdx, function (idx) {
      choiceState.qIdx = idx;
      renderChoiceQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    sideStat(doneN, qs.length, rightN, wrongN, '已做');
    sideActions([
      { label: '← 上一题', disabled: choiceState.qIdx === 0, onClick: function () {
          choiceState.qIdx--; renderChoiceQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '下一题 →', disabled: choiceState.qIdx === qs.length - 1, onClick: function () {
          choiceState.qIdx++; renderChoiceQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '🎲 打乱重做', wide: true, onClick: function () {
          choiceState.currentQuestions = shuffleArray(choiceState.currentQuestions);
          choiceState.qIdx = 0; renderChoiceQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    ]);

    // 绑定导航（用带前缀的新 ID）
    const prevBtn = document.getElementById('choicePrevQ');
    const nextBtn = document.getElementById('choiceNextQ');
    if (prevBtn) prevBtn.addEventListener('click', function() {
      if (choiceState.qIdx > 0) {
        choiceState.qIdx--;
        renderChoiceQuestion();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    });
    if (nextBtn) nextBtn.addEventListener('click', function() {
      if (choiceState.qIdx < qs.length - 1) {
        choiceState.qIdx++;
        renderChoiceQuestion();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    });
  }

  // ---------- 随机30题 ----------
  const RANDOM_QUIZ_SIZE = 30;
  let randomState = {
    subject: 'all', // 抽题科目：all / west_econ / pol_econ
    queue: [],      // [{qid, q}] 本次抽中的题目
    idx: 0,         // 当前第几题
    correct: 0,     // 本次答对
    answered: 0,    // 本次已答
    finished: false,
    results: {},    // 本次作答记录 {qid: true|false}，供侧栏答题卡上色
    wrongList: []   // 本次错题 [{qid, stem, yourSel, rightAns, explanation}]
  };

  function renderRandomHome() {
    const area = document.getElementById('randomArea');

    // 已结束 → 成绩页
    if (randomState.finished) {
      area.innerHTML = renderRandomResult();
      bindRandomResult(area);
      sideTitle('本次成绩');
      sideBubbles([], -1, function () {});
      sideStat(randomState.answered, randomState.queue.length, randomState.correct, randomState.answered - randomState.correct);
      sideActions([{ label: '🔄 再抽一组', wide: true, onClick: function () {
        randomState = { queue: [], idx: 0, correct: 0, answered: 0, finished: false, results: {}, wrongList: [] };
        renderRandomHome();
      } }]);
      return;
    }
    // 未开始 → 引导页
    if (!randomState.queue.length) {
      const poolOf = function (sub) {
        return Object.keys(qIndex).filter(function(qid){
          if (qIndex[qid].type !== 'choice') return false;
          return sub === 'all' || qIndex[qid].subject === sub;
        });
      };
      const curSub = randomState.subject || 'all';
      const curPool = poolOf(curSub);
      area.innerHTML = `
        <div class="question-card" style="text-align:center; padding:40px 20px;">
          <div style="font-size:40px; margin-bottom:14px;">🎲</div>
          <div style="font-size:18px; font-weight:600; margin-bottom:8px;">随机 ${RANDOM_QUIZ_SIZE} 题挑战</div>
          <div class="filter-row" style="justify-content:center; margin-bottom:16px;">
            <span class="filter-label">科目</span>
            <select class="filter-select" id="randomSubject" style="max-width:200px;">
              <option value="all"${curSub === 'all' ? ' selected' : ''}>全部科目</option>
              <option value="west_econ"${curSub === 'west_econ' ? ' selected' : ''}>西方经济学</option>
              <option value="pol_econ"${curSub === 'pol_econ' ? ' selected' : ''}>政治经济学</option>
            </select>
          </div>
          <div class="text-mute" style="margin-bottom:20px;">
            从当前科目题库（共 <b id="randomPoolSize">${curPool.length}</b> 题）中随机抽取 ${RANDOM_QUIZ_SIZE} 道<br>
            题目顺序、选项顺序每次都会打乱，答错自动记入错题本
          </div>
          <button class="show-answer-btn" id="randomStartBtn" style="max-width:260px; margin:0 auto;">开始挑战</button>
        </div>
      `;
      document.getElementById('randomStartBtn').addEventListener('click', startRandomQuiz);
      const subSel = document.getElementById('randomSubject');
      if (subSel) subSel.addEventListener('change', function () {
        randomState.subject = subSel.value;
        const sizeEl = document.getElementById('randomPoolSize');
        if (sizeEl) sizeEl.textContent = poolOf(subSel.value).length;
        sideStat(0, Math.min(RANDOM_QUIZ_SIZE, poolOf(subSel.value).length), 0, 0);
      });
      sideTitle('随机抽题');
      sideBubbles([], -1, function () {});
      sideStat(0, RANDOM_QUIZ_SIZE, 0, 0);
      sideActions([{ label: '▶ 开始挑战', wide: true, onClick: startRandomQuiz }]);
      return;
    }
    // 进行中 → 当前题
    area.innerHTML = renderRandomQuestion();
    bindRandomQuestion(area);
  }

  function startRandomQuiz() {
    const sub = randomState.subject || 'all';
    const allQids = Object.keys(qIndex).filter(function(qid){
      if (qIndex[qid].type !== 'choice') return false;
      return sub === 'all' || qIndex[qid].subject === sub;
    });
    const shuffled = shuffleArray(allQids);
    const picked = shuffled.slice(0, Math.min(RANDOM_QUIZ_SIZE, shuffled.length));
    randomState.queue = picked.map(function(qid) {
      return { qid: qid, q: qIndex[qid].q };
    });
    randomState.idx = 0;
    randomState.correct = 0;
    randomState.answered = 0;
    randomState.finished = false;
    randomState.wrongList = [];
    renderRandomHome();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function randomStatsHtml() {
    const total = randomState.queue.length;
    const acc = randomState.answered > 0 ? Math.round(randomState.correct / randomState.answered * 100) : null;
    return `
      <div class="exam-header" style="display:flex; justify-content:space-around; text-align:center; padding:12px;">
        <div>
          <div style="font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;">${randomState.answered}<span style="color:var(--fg-faint); font-size:14px;">/${total}</span></div>
          <div class="gp-label">已做</div>
        </div>
        <div>
          <div style="font-size:20px; font-weight:700; color:var(--green); font-variant-numeric:tabular-nums;">${randomState.correct}</div>
          <div class="gp-label">答对</div>
        </div>
        <div>
          <div style="font-size:20px; font-weight:700; color:${acc===null?'var(--fg-faint)':(acc>=60?'var(--green)':'var(--red)')}; font-variant-numeric:tabular-nums;">${acc===null?'--':acc+'%'}</div>
          <div class="gp-label">正确率</div>
        </div>
      </div>
    `;
  }

  function renderRandomQuestion() {
    const item = randomState.queue[randomState.idx];
    const q = item.q;
    const opts = buildShuffledOptions(q);
    const total = randomState.queue.length;

    let optsHtml = '';
    opts.forEach(function(o) {
      optsHtml += `
        <button class="option-btn" data-original="${o.original}">
          <span class="opt-letter">${o.display}</span>
          <span>${escapeHtml(o.text)}</span>
        </button>
      `;
    });

    return `
      ${randomStatsHtml()}
      <div class="progress-info">
        <span>第 ${randomState.idx + 1} / ${total} 题</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${(randomState.idx/total*100)}%"></div></div>
        <span style="color:var(--fg-faint);">随机抽题</span>
      </div>
      <div class="question-card">
        <div class="question-meta">
          <span>${escapeHtml((qIndex[item.qid].chapterName) || '')}</span>
          <span>#${randomState.idx + 1}</span>
        </div>
        <div class="question-stem">${escapeHtml(q.stem)}</div>
        <div class="options-list" id="randomOptions">${optsHtml}</div>
        <div id="randomFeedback"></div>
      </div>
    `;
  }

  function bindRandomQuestion(area) {
    const item = randomState.queue[randomState.idx];
    const q = item.q;
    loadSubjectExpl(randomState.subject && randomState.subject !== 'all' ? randomState.subject : subjectOfQid(q.id), function () { hydrateExpl(area); });

    // ---- 侧栏：题号答题卡 + 上一题/下一题 ----
    sideTitle('随机答题卡 · ' + randomState.queue.length + ' 题');
    sideRefreshRandomCards();
    sideStat(randomState.answered, randomState.queue.length, randomState.correct, randomState.answered - randomState.correct);
    sideActions([
      { label: '← 上一题', disabled: randomState.idx === 0, onClick: function () {
          randomState.idx--; randomState.finished = false; renderRandomHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '下一题 →', disabled: randomState.idx >= randomState.queue.length - 1, onClick: function () {
          randomState.idx++; renderRandomHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '📊 交卷看成绩', wide: true, onClick: function () {
          randomState.finished = true; renderRandomHome(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    ]);
    area.querySelectorAll('#randomOptions .option-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        const sel = btn.dataset.original;
        const correct = sel === q.answer;
        randomState.answered++;
        if (correct) randomState.correct++;
        else {
          randomState.wrongList.push({
            qid: item.qid, stem: q.stem,
            yourSel: sel, rightAns: q.answer,
            rightText: q.options[q.answer], yourText: q.options[sel],
            explanation: explOf(q),
            chapter: qIndex[item.qid].chapterName
          });
        }
        // 写库：联动错题本 + 全局进度
        DB.recordChoice(item.qid, { done: true, correct: correct, selected: sel });
        updateGlobalProgress();

        // 高亮选项
        area.querySelectorAll('#randomOptions .option-btn').forEach(function(b) {
          b.classList.add('disabled');
          const orig = b.dataset.original;
          if (orig === q.answer) b.classList.add('correct');
          else if (orig === sel && !correct) b.classList.add('wrong');
        });

        randomState.results = randomState.results || {};
        randomState.results[q.id] = correct;
        const isLast = randomState.idx >= randomState.queue.length - 1;
        const goNext = function () {
          if (isLast) randomState.finished = true;
          else randomState.idx++;
          renderRandomHome();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        const fb = document.getElementById('randomFeedback');
        // 答对不展开解析、稍作停顿后自动进下一题；答错才展开解析，停住等手动翻页
        fb.innerHTML = `
          <div class="mt-12">
            <span class="answer-badge ${correct ? 'correct' : 'wrong'}">
              ${correct ? '✓ 回答正确' : '✗ 回答错误'}
            </span>
            ${correct ? '' : `
            <div class="explanation-box">
              <div class="exp-title">正确答案：${displayLetterOf(opts, q.answer)}. ${escapeHtml(q.options[q.answer] || '')}</div>
              <div>${explHtmlFor(q)}</div>
            </div>
            <button class="show-answer-btn" id="randomNextBtn" style="margin-top:12px;">${isLast ? '查看成绩 →' : '下一题 →'}</button>`}
          </div>
        `;
        // 实时刷新统计栏（不重渲染整个题，只更新数字，避免用户滚动位置跳）
        refreshRandomStatsOnly();
        if (correct) {
          setTimeout(goNext, 550);
        } else {
          document.getElementById('randomNextBtn').addEventListener('click', goNext);
        }
      });
    });
  }

  // 只更新顶部统计数字，不重渲染题目
  function refreshRandomStatsOnly() {
    const total = randomState.queue.length;
    const acc = randomState.answered > 0 ? Math.round(randomState.correct / randomState.answered * 100) : null;
    const header = document.querySelector('#randomArea .exam-header');
    if (!header) return;
    header.innerHTML = `
      <div>
        <div style="font-size:20px; font-weight:700; font-variant-numeric:tabular-nums;">${randomState.answered}<span style="color:var(--fg-faint); font-size:14px;">/${total}</span></div>
        <div class="gp-label">已做</div>
      </div>
      <div>
        <div style="font-size:20px; font-weight:700; color:var(--green); font-variant-numeric:tabular-nums;">${randomState.correct}</div>
        <div class="gp-label">答对</div>
      </div>
      <div>
        <div style="font-size:20px; font-weight:700; color:${acc===null?'var(--fg-faint)':(acc>=60?'var(--green)':'var(--red)')}; font-variant-numeric:tabular-nums;">${acc===null?'--':acc+'%'}</div>
        <div class="gp-label">正确率</div>
      </div>
    `;
    // 同时更新进度条
    const bar = document.querySelector('#randomArea .progress-fill');
    if (bar) bar.style.width = (randomState.answered / total * 100) + '%';
    // 侧栏同步
    sideStat(randomState.answered, total, randomState.correct, randomState.answered - randomState.correct);
    sideRefreshRandomCards();
  }

  // 复习模式题号状态：已答的题给出对错色块
  function sideRefreshRandomCards() {
    const res = randomState.results || {};
    const cards = randomState.queue.map(function (item, i) {
      var st = 'undone';
      if (res[item.qid] === true) st = 'right';
      else if (res[item.qid] === false) st = 'wrong';
      return { id: item.qid, label: '第 ' + (i + 1) + ' 题', status: st };
    });
    sideBubbles(cards, randomState.idx, function (idx) {
      randomState.idx = idx;
      randomState.finished = false;
      renderRandomHome();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  }

  function renderRandomResult() {
    const total = randomState.queue.length;
    const acc = Math.round(randomState.correct / total * 100);
    const score = Math.round(randomState.correct / RANDOM_QUIZ_SIZE * 100); // 满分100
    let verdict = '';
    if (acc >= 90) verdict = '🏆 太棒了，接近满分！';
    else if (acc >= 75) verdict = '🎉 优秀，继续保持！';
    else if (acc >= 60) verdict = '💪 及格了，错题再巩固下';
    else verdict = '📚 还需努力，多看错题本';

    let wrongHtml = '';
    if (randomState.wrongList.length) {
      wrongHtml = '<div style="margin-top:18px;"><div style="font-weight:600; margin-bottom:10px;">本次错题（' + randomState.wrongList.length + '）</div>';
      randomState.wrongList.forEach(function(w, i) {
        wrongHtml += `
          <div class="wrong-item">
            <div class="wi-meta">第 ${i+1} 题 · ${escapeHtml(w.chapter||'')}</div>
            <div class="wi-stem">${escapeHtml(w.stem)}</div>
            <div class="wi-wrong-ans">✗ 你的答案：${w.yourSel}. ${escapeHtml(w.yourText||'')}</div>
            <div class="wi-right-ans">✓ 正确答案：${w.rightAns}. ${escapeHtml(w.rightText||'')}</div>
            ${w.explanation ? '<div class="ref-content" style="margin-top:8px; font-size:13px;">' + escapeHtml(w.explanation) + '</div>' : ''}
          </div>
        `;
      });
      wrongHtml += '</div>';
    } else {
      wrongHtml = '<div style="text-align:center; margin-top:18px; color:var(--green); font-size:15px;">🎉 全部答对，一道错题都没有！</div>';
    }

    return `
      <div class="question-card" style="text-align:center; padding:30px 20px;">
        <div style="font-size:15px; color:var(--fg-mute);">本次随机 ${total} 题成绩</div>
        <div style="font-size:56px; font-weight:800; margin:10px 0; color:${acc>=60?'var(--green)':'var(--red)'}; font-variant-numeric:tabular-nums;">${score}<span style="font-size:20px; color:var(--fg-faint);"> 分</span></div>
        <div style="font-size:15px; margin-bottom:6px;">${randomState.correct} / ${total} 正确 · 正确率 <b>${acc}%</b></div>
        <div class="text-mute">${verdict}</div>
      </div>
      ${wrongHtml}
      <div class="nav-row" style="margin-top:18px;">
        <button class="nav-btn" id="randomAgainBtn">🔄 再来一组</button>
        <button class="nav-btn" id="randomExitBtn" style="color:var(--fg-mute); background:var(--bg-sunken); border-color:var(--border-strong);">返回选择题</button>
      </div>
    `;
  }

  function bindRandomResult(area) {
    document.getElementById('randomAgainBtn').addEventListener('click', startRandomQuiz);
    document.getElementById('randomExitBtn').addEventListener('click', function() {
      // 重置回引导态，切到选择题 tab
      randomState = { queue: [], idx: 0, correct: 0, answered: 0, finished: false, results: {}, wrongList: [] };
      document.querySelector('.tab[data-tab="choice"]').click();
    });
  }

  // ---------- 主观题（简答/论述） ----------
  // 简答与论述各自独立的状态（两套下拉框互不干扰）
  function newSubjState() { return { subject: 'west_econ', chapterIdx: 0, qIdx: 0, currentQuestions: [] }; }
  let subjStates = { short: newSubjState(), essay: newSubjState() };
  // 当前正在渲染的那一套（renderSubjectiveQuestion 里用）
  let subjState = subjStates.short;

  function initSubjectiveFilters(type) {
    const subjectSel = document.getElementById(type + 'Subject');
    const chapterSel = document.getElementById(type + 'Chapter');

    subjectSel.addEventListener('change', function() {
      var sub = subjectSel.value;
      var st = subjStates[type];
      st.subject = sub;
      st.chapterIdx = 0;
      st.qIdx = 0;
      ensureSubject(sub, function() {
        if (subjStates[type].subject !== sub) return; // 期间又切走了，丢弃这次渲染
        updateChapterOptions(type);
        renderSubjective(type);
        updateGlobalProgress();
      });
    });

    chapterSel.addEventListener('change', function() {
      var st = subjStates[type];
      st.chapterIdx = parseInt(chapterSel.value) || 0;
      st.qIdx = 0;
      renderSubjective(type);
    });
  }

  function renderSubjective(type) {
    subjState = subjStates[type];
    const subject = subjState.subject;
    const chapters = (DATA.subjective[subject] || {}).chapters || [];
    if (!chapters.length) return;

    const chapter = chapters[subjState.chapterIdx];
    if (!chapter) return;

    const qs = type === 'short' ? (chapter.short_questions || []) : (chapter.essay_questions || []);
    subjState.currentQuestions = qs;

    // 章节内进度
    let seen = 0;
    qs.forEach(function(q) { if (DB.loadProgress().subjective[q.id]) seen++; });
    document.getElementById(type + 'ProgressText').textContent = '已看答案 ' + seen + ' / ' + qs.length;
    document.getElementById(type + 'ProgressFill').style.width = qs.length ? (seen / qs.length * 100) + '%' : '0%';

    subjState.qIdx = Math.min(subjState.qIdx || 0, Math.max(0, qs.length - 1));
    renderSubjectiveQuestion();

    // ---- 侧栏：题号（看过答案=蓝）+ 上一题/下一题 ----
    const progSub = DB.loadProgress().subjective;
    const cards = qs.map(function (q, i) {
      return { id: q.id,
               label: (type === 'short' ? '简答' : '论述') + '第 ' + (i + 1) + ' 题',
               status: progSub[q.id] ? 'done' : 'undone' };
    });
    sideTitle((type === 'short' ? '简答题' : '论述题') + ' · ' + qs.length + ' 道');
    sideBubbles(cards, subjState.qIdx, function (idx) {
      subjState.qIdx = idx;
      renderSubjectiveQuestion();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    sideStat(seen, qs.length, null, null);
    sideActions([
      { label: '← 上一题', disabled: subjState.qIdx === 0, onClick: function () {
          subjState.qIdx--; renderSubjectiveQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '下一题 →', disabled: subjState.qIdx >= qs.length - 1, onClick: function () {
          subjState.qIdx++; renderSubjectiveQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    ]);
  }

  function renderSubjectiveQuestion() {
    const type = subjState === subjStates.essay ? 'essay' : 'short';
    const area = document.getElementById(type + 'Area');
    const qs = subjState.currentQuestions;
    if (!qs.length) {
      const userName = (SUBJECT_META[subjState.subject] || {}).name || '本科目';
      const label = type === 'short' ? '简答题' : '论述题';
      area.innerHTML = '<div class="empty-state">'
        + userName + ' 暂无' + label + '（该科目题库尚未收录这一题型，可切换到其他科目）'
        + '</div>';
      return;
    }
    const q = qs[subjState.qIdx];
    const seen = !!DB.loadProgress().subjective[q.id];

    // 按钮 ID 加 type 前缀（short 或 essay）
    const toggleId = type + 'ToggleAnswer';
    const refId = type + 'RefBox';
    const prevId = type + 'PrevQ';
    const nextId = type + 'NextQ';

    let html = `
      <div class="question-card">
        <div class="question-meta">
          <span>${type === 'short' ? '简答题' : '论述题'} · ${escapeHtml(getChapters(subjState.subject, type)[subjState.chapterIdx].name)}${q.kp_file
            ? ` · <a class="kp-link" href="index.html#/${encodeURI(q.kp_file)}" target="_blank" rel="noopener" title="打开知识点原文（新标签页）">回知识点</a>`
            : ''}</span>
          <span>第 ${subjState.qIdx + 1} / ${qs.length} 题</span>
        </div>
        <div class="question-stem">${escapeHtml(q.stem)}</div>
        <textarea class="answer-textarea" placeholder="先自己写一遍参考答案，再对照..."></textarea>
        <button class="show-answer-btn" id="${toggleId}">${seen ? '收起参考答案' : '显示参考答案'}</button>
        <div class="reference-box ${seen ? 'visible' : ''}" id="${refId}">
    `;

    if (q.derivation) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🔍 核心推导</div>
          <div class="ref-content">${renderMd(q.derivation)}</div>
        </div>
      `;
    }
    if (q.why_points) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🧭 为什么要答这几点</div>
          <div class="ref-content">${renderMd(q.why_points)}</div>
        </div>
      `;
    }
    if (q.how_to_analyze) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🪜 如何分析题目</div>
          <div class="ref-content">${renderMd(q.how_to_analyze)}</div>
        </div>
      `;
    }
    if (q.framework && q.framework.length) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">📝 答题框架</div>
          <div class="ref-content framework-list">
            ${q.framework.map(function(f) { return '<div class="framework-item">' + escapeHtml(f) + '</div>'; }).join('')}
          </div>
        </div>
      `;
    }

    if (q.answer) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">✅ 参考答案</div>
          <div class="ref-content">${renderMd(q.answer)}</div>
        </div>
      `;
    }

    if (q.scoring) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🎯 得分点</div>
          <div class="ref-content">${renderMd(q.scoring)}</div>
        </div>
      `;
    }

    if (q.life_example) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">💡 生活实例</div>
          <div class="ref-content">${renderMd(q.life_example)}</div>
        </div>
      `;
    }

    const pitfalls = extractPitfalls(q);
    if (pitfalls.length) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">⚠️ 易错点</div>
          <div class="ref-content pitfall-list">
            ${pitfalls.map(function(p) { return '<div class="pitfall-item">' + escapeHtml(p) + '</div>'; }).join('')}
          </div>
        </div>
      `;
    }

    html += `
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="${prevId}" ${subjState.qIdx === 0 ? 'disabled' : ''}>← 上一题</button>
        <button class="nav-btn" id="${nextId}" ${subjState.qIdx === qs.length - 1 ? 'disabled' : ''}>下一题 →</button>
      </div>
    `;

    area.innerHTML = html;
    enhanceMd(area);

    // 绑定显示答案按钮
    const toggleBtn = document.getElementById(toggleId);
    const refBox = document.getElementById(refId);
    toggleBtn.addEventListener('click', function() {
      refBox.classList.toggle('visible');
      if (refBox.classList.contains('visible')) {
        DB.recordSubjective(q.id);
        toggleBtn.textContent = '收起参考答案';
        updateGlobalProgress();
        // 侧栏题号同步变色
        var bub = document.querySelector('#spBubbles [data-side-jump="' + subjState.qIdx + '"]');
        if (bub) { bub.classList.remove('b-undone'); bub.classList.add('b-done'); }
      } else {
        toggleBtn.textContent = '显示参考答案';
      }
    });

    // 绑定导航
    const prevBtn = document.getElementById(prevId);
    const nextBtn = document.getElementById(nextId);
    if (prevBtn) prevBtn.addEventListener('click', function() {
      if (subjState.qIdx > 0) {
        subjState.qIdx--;
        renderSubjectiveQuestion();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    });
    if (nextBtn) nextBtn.addEventListener('click', function() {
      if (subjState.qIdx < qs.length - 1) {
        subjState.qIdx++;
        renderSubjectiveQuestion();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    });
  }

  // ---------- 模拟卷 ----------
  function renderMockList() {
    const area = document.getElementById('mockListArea');
    const examArea = document.getElementById('mockExamArea');
    area.classList.remove('hidden');
    examArea.classList.add('hidden');

    let html = '<div class="mock-grid">';
    DATA.mock_papers.forEach(function(paper, idx) {
      const done = DB.loadProgress().mock[paper.id];
      const shortCnt = paper.questions.filter(function(q) { return q.type === 'short'; }).length;
      const essayCnt = paper.questions.filter(function(q) { return q.type === 'essay'; }).length;
      html += `
        <div class="mock-card" data-idx="${idx}">
          <h3>${escapeHtml(paper.title)}</h3>
          <div class="mock-meta">
            <span>难度：${escapeHtml(paper.difficulty)}</span>
            <span>题量：${paper.questions.length}题（${shortCnt}简答+${essayCnt}论述）</span>
            <span>时长：${paper.duration_min}分钟</span>
          </div>
          ${done ? '<div class="mock-status">✓ 已完成模拟</div>' : ''}
        </div>
      `;
    });
    html += '</div>';
    area.innerHTML = html;

    area.querySelectorAll('.mock-card').forEach(function(card) {
      card.addEventListener('click', function() {
        const idx = parseInt(card.dataset.idx);
        startMockExam(idx);
      });
    });

    sideTitle('模拟卷 · ' + DATA.mock_papers.length + ' 套');
    sideBubbles([], -1, function () {});
    sideStat(0, DATA.mock_papers.length, null, null);
    sideActions([]);
  }

  let mockState = { paperIdx: 0, qIdx: 0, timerInterval: null, remainingSec: 0, paused: false };

  function startMockExam(paperIdx) {
    const paper = DATA.mock_papers[paperIdx];
    mockState.paperIdx = paperIdx;
    mockState.qIdx = 0;
    mockState.remainingSec = paper.duration_min * 60;
    mockState.paused = false;

    document.getElementById('mockListArea').classList.add('hidden');
    const examArea = document.getElementById('mockExamArea');
    examArea.classList.remove('hidden');

    renderMockExam();
    startTimer();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function startTimer() {
    stopTimer();
    mockState.timerInterval = setInterval(function() {
      if (!mockState.paused) {
        mockState.remainingSec--;
        updateTimerDisplay();
        if (mockState.remainingSec <= 0) {
          stopTimer();
          alert('时间到！考试结束');
        }
      }
    }, 1000);
  }

  function stopTimer() {
    if (mockState.timerInterval) {
      clearInterval(mockState.timerInterval);
      mockState.timerInterval = null;
    }
  }

  function formatTime(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return (h<10?'0':'')+h + ':' + (m<10?'0':'')+m + ':' + (s<10?'0':'')+s;
  }

  function updateTimerDisplay() {
    const el = document.getElementById('mockTimerDisplay');
    if (el) {
      el.textContent = formatTime(mockState.remainingSec);
      if (mockState.remainingSec < 1800) el.classList.add('warning');
    }
  }

  function renderMockExam() {
    const paper = DATA.mock_papers[mockState.paperIdx];
    const q = paper.questions[mockState.qIdx];
    const examArea = document.getElementById('mockExamArea');

    // 按钮 ID 加 mock 前缀
    let html = `
      <div class="exam-header">
        <div style="text-align:center; font-weight:600; font-size:15px; margin-bottom:4px;">${escapeHtml(paper.title)}</div>
        <div class="timer-display" id="mockTimerDisplay">${formatTime(mockState.remainingSec)}</div>
        <div class="timer-controls">
          <button class="timer-btn primary" id="mockPauseBtn">${mockState.paused ? '继续' : '暂停'}</button>
          <button class="timer-btn" id="mockResetBtn">重置</button>
          <button class="timer-btn" id="mockExitBtn">退出</button>
        </div>
      </div>

      <div class="question-card">
        <div class="question-meta">
          <span>${q.type === 'short' ? '简答题' : '论述题'} · ${q.subject === 'pol_econ' ? '政治经济学' : '西方经济学'} · ${q.score}分</span>
          <span>第 ${mockState.qIdx + 1} / ${paper.questions.length} 题</span>
        </div>
        <div class="question-stem">${escapeHtml(q.stem)}</div>
        <textarea class="answer-textarea" placeholder="在此作答..."></textarea>

    if (q.derivation) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🔍 核心推导</div>
          <div class="ref-content">${renderMd(q.derivation)}</div>
        </div>
      `;
    }
    if (q.why_points) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🧭 为什么要答这几点</div>
          <div class="ref-content">${renderMd(q.why_points)}</div>
        </div>
      `;

    if (q.how_to_analyze) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🪜 如何分析题目</div>

        </div>
      `;
    }
    if (q.framework && q.framework.length) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">📝 答题框架</div>
          <div class="ref-content framework-list">
            ${q.framework.map(function(f) { return '<div class="framework-item">' + escapeHtml(f) + '</div>'; }).join('')}
          </div>
        </div>
      `;
    }
    if (q.answer) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">✅ 参考答案</div>
          <div class="ref-content">${renderMd(q.answer)}</div>
        </div>
      `;
    }
    if (q.scoring) {
      html += `
        <div class="ref-section">
          <div class="ref-section-title">🎯 得分点</div>
          <div class="ref-content">${renderMd(q.scoring)}</div>
        </div>
      `;
    }

    html += `
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="mockPrevQ" ${mockState.qIdx === 0 ? 'disabled' : ''}>← 上一题</button>
        <button class="nav-btn" id="mockNextQ">${mockState.qIdx === paper.questions.length - 1 ? '完成模拟' : '下一题 →'}</button>
      </div>
    `;

    examArea.innerHTML = html;
    enhanceMd(examArea);

    // 绑定计时器控制
    document.getElementById('mockPauseBtn').addEventListener('click', function() {
      mockState.paused = !mockState.paused;
      document.getElementById('mockPauseBtn').textContent = mockState.paused ? '继续' : '暂停';
    });
    document.getElementById('mockResetBtn').addEventListener('click', function() {
      mockState.remainingSec = paper.duration_min * 60;
      mockState.paused = false;
      updateTimerDisplay();
    });
    document.getElementById('mockExitBtn').addEventListener('click', function() {
      if (confirm('确定退出模拟吗？进度将不保存')) {
        stopTimer();
        renderMockList();
      }

    // ---- 侧栏：模拟卷题号 + 计时 + 控制 ----
    sideTitle('模拟卷 · ' + paper.questions.length + ' 题');
    sideBubbles(paper.questions.map(function (it, i) {
      return { id: it.id, label: '第 ' + (i + 1) + ' 题', status: 'undone' };
    }), mockState.qIdx, function (idx) {
      mockState.qIdx = idx;
      renderMockExam();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    sideStat(mockState.qIdx, paper.questions.length, null, null);
    sideActions([
      { label: mockState.paused ? '▶ 继续计时' : '⏸ 暂停计时', onClick: function () {
          var b = document.getElementById('mockPauseBtn');
          if (b) b.click();
          renderMockExam();
        } },
      { label: '← 上一题', disabled: mockState.qIdx === 0, onClick: function () {
          var b = document.getElementById('mockPrevQ'); if (b) b.click(); } },
      { label: mockState.qIdx === paper.questions.length - 1 ? '完成模拟' : '下一题 →', wide: true, onClick: function () {
          var b = document.getElementById('mockNextQ'); if (b) b.click(); } }
    ]);

    // 绑定显示答案
    document.getElementById('mockToggleAnswer').addEventListener('click', function() {
      document.getElementById('mockRefBox').classList.toggle('visible');
    });

    // 绑定导航
    document.getElementById('mockPrevQ').addEventListener('click', function() {
      if (mockState.qIdx > 0) {
        mockState.qIdx--;
        renderMockExam();
        window.scrollTo({top: 0, behavior: 'smooth'});
      }
    });
    document.getElementById('mockNextQ').addEventListener('click', function() {
      if (mockState.qIdx < paper.questions.length - 1) {
        mockState.qIdx++;
        renderMockExam();
        window.scrollTo({top: 0, behavior: 'smooth'});
      } else {
        const p = DB.loadProgress();
        p.mock[paper.id] = { completed: true, time: new Date().toISOString() };
        DB.saveProgress(p);
        stopTimer();
        alert('🎉 恭喜完成本次模拟！');
        renderMockList();
