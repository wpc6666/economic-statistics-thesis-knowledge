  }

// ---------- 错题本（v2：连续对3次过关 + 随机练习） ----------
  // wrongMode: 'list' 列表视图 | 'practice' 随机练习视图
  let wrongMode = 'list';
  let practiceQueue = [];   // 练习队列 [{qid, source:'wrong'|'key'}]
  let practiceIdx = 0;       // 当前练习到第几题

  function renderWrongBook() {
    const area = document.getElementById('wrongArea');
    const p = DB.loadProgress();
    const wrongIds = p.wrong_questions || [];
    const meta = p.wrong_meta || {};

    // 统计：已掌握数量
    let masteredCnt = 0;
    Object.keys(meta).forEach(function(qid) { if (meta[qid].mastered) masteredCnt++; });

    let html = `
      <div class="wrong-summary">
        <div class="ws-card">
          <div class="ws-num red">${wrongIds.length}</div>
          <div class="ws-label">待掌握</div>
        </div>
        <div class="ws-card">
          <div class="ws-num green">${masteredCnt}</div>
          <div class="ws-label">已掌握（连续对3次）</div>
        </div>
      </div>
      <div class="nav-row" style="margin-bottom:14px;">
        <button class="nav-btn" id="wpListBtn">📋 错题列表</button>
        <button class="nav-btn" id="wpPracticeBtn">🎯 随机练习</button>
      </div>
    `;

    // 侧栏：错题号答题卡
    sideTitle('错题本 · ' + wrongIds.length + ' 道待掌握');
    sideBubbles(wrongIds.map(function (qid, i) {
      var mt = meta[qid] || {};
      return { id: qid, label: '错题 ' + (i + 1),
               status: mt.mastered ? 'right' : 'wrong',
               flag: (mt.consecutive_correct || 0) > 0 };
    }), -1, function (idx) {
      var q = qIndex[wrongIds[idx]] ? qIndex[wrongIds[idx]].q : null;
      if (!q) return;
      practiceQueue = wrongIds.map(function (id) { return { qid: id, source: 'wrong' }; });
      practiceIdx = idx;
      wrongMode = 'practice';
      renderWrongBook();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    sideStat(masteredCnt, wrongIds.length + masteredCnt, masteredCnt, wrongIds.length);
    sideActions([
      { label: '📋 错题列表', onClick: function () { var b = document.getElementById('wpListBtn'); if (b) b.click(); } },
      { label: '🎯 随机练习', onClick: function () { var b = document.getElementById('wpPracticeBtn'); if (b) b.click(); } }
    ]);

    if (wrongMode === 'practice' && practiceQueue.length) {
      html += renderPracticeView();
    } else if (wrongMode === 'practice' && practiceIdx >= practiceQueue.length) {
      // 练习完成
      html += `
        <div class="empty-state">
          🎉 本轮练习完成！<br>
          <span style="font-size:12px;color:var(--fg-mute);">连续对3次的错题会自动标记为"已掌握"</span>
        </div>
      `;
      wrongMode = 'list';
    } else {
      html += renderWrongList(wrongIds, meta);
    }

    area.innerHTML = html;

    // 绑定按钮
    const listBtn = document.getElementById('wpListBtn');
    const pracBtn = document.getElementById('wpPracticeBtn');
    if (listBtn) listBtn.onclick = function() { wrongMode = 'list'; practiceQueue = []; renderWrongBook(); };
    if (pracBtn) pracBtn.onclick = function() { startPractice(); };

    // 列表里的重做按钮
    area.querySelectorAll('[data-redo]').forEach(function(btn) {
      btn.onclick = function() { startPractice([btn.dataset.redo]); };
    });

    // 练习模式：退出按钮
    const exitBtn = document.getElementById('wpExitBtn');
    if (exitBtn) exitBtn.onclick = function() { wrongMode = 'list'; practiceQueue = []; renderWrongBook(); };

    // 练习模式：选项点击
    const opts = area.querySelectorAll('#practiceOptions .option-btn');
    opts.forEach(function(obtn) {
      obtn.onclick = function() {
        const item = practiceQueue[practiceIdx];
        const m = qIndex[item.qid];
        if (!m) return;
        const q = m.q;
        const letter = obtn.dataset.original;
        const correct = letter === q.answer;
        DB.recordChoice(item.qid, { done: true, correct: correct, selected: letter });
        updateGlobalProgress();

        const fb = document.getElementById('practiceFeedback');
        const wm = DB.loadProgress().wrong_meta[item.qid] || {};
        let badge = '';
        if (correct) {
          badge = wm.mastered
            ? '<span class="answer-badge correct">✓ 已掌握！连续对3次</span>'
            : '<span class="answer-badge correct">✓ 正确（连续对 ' + (wm.consecutive_correct||0) + '/3）</span>';
        } else {
          badge = '<span class="answer-badge wrong">✗ 错误（连续对计数清零）</span>';
        }
        fb.innerHTML = `
          <div class="mt-12">
            ${badge}
            <div class="explanation-box">
              <div class="exp-title">正确答案：${displayLetterOf(opts, q.answer)}. ${escapeHtml(q.options[q.answer] || '')}</div>
              <div>${explHtmlFor(q)}</div>
            </div>
            <button class="show-answer-btn" id="wpNextQ" style="margin-top:12px;">${practiceIdx + 1 >= practiceQueue.length ? '完成练习' : '下一题 →'}</button>
          </div>
        `;
        document.getElementById('wpNextQ').onclick = function() {
          practiceIdx++;
          renderWrongBook();
          window.scrollTo({top: 0, behavior: 'smooth'});
        };
      };
    });
  }

  function renderWrongList(wrongIds, meta) {
    if (!wrongIds.length) {
      return '<div class="empty-state">🎉 暂无错题<br><span style="font-size:12px;color:var(--fg-mute);">选择题答错的题会自动收集到这里</span></div>';
    }
    let html = '';
    wrongIds.forEach(function(qid) {
      const m = qIndex[qid];
      if (!m) return;
      const q = m.q;
      const wm = meta[qid] || {};
      const lastWrong = wm.last_wrong_at
        ? new Date(wm.last_wrong_at).toLocaleString('zh-CN', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})
        : '?';
      html += `
        <div class="wrong-item">
          <div class="wi-meta">
            ${escapeHtml(m.chapterName||'')} · 错 ${wm.total_wrong||0} 次 · 最近 ${lastWrong}
            <span style="float:right;">连续对 ${wm.consecutive_correct||0}/3</span>
          </div>
          <div class="wi-stem">${escapeHtml(q.stem)}</div>
          <div class="wi-wrong-ans">✗ 上次选了 ${wm.last_wrong_selected||'?'}</div>
          <div class="wi-right-ans">✓ 正确答案：${q.answer}</div>
          <button class="show-answer-btn" data-redo="${qid}" style="width:auto;padding:8px 20px;">🔄 重做这道题</button>
        </div>
      `;
    });
    return html;
  }

  // 随机练习：80%错题 + 20%重点题（从未做过错的选择题里随机抽）
  function startPractice(specificQids) {
    const p = DB.loadProgress();
    const wrongIds = p.wrong_questions || [];

    let pool = [];
    if (specificQids && specificQids.length) {
      specificQids.forEach(function(qid) { pool.push({ qid: qid, source: 'wrong' }); });
    } else {
      // 错题入池
      wrongIds.forEach(function(qid) { pool.push({ qid: qid, source: 'wrong' }); });
      // 重点题：从未做过错的选择题里随机抽（错题数的 1/4 道）
      const allChoiceQids = Object.keys(qIndex).filter(function(qid) { return qIndex[qid].type === 'choice'; });
      const neverWrong = allChoiceQids.filter(function(qid) { return !p.wrong_meta[qid]; });
      const keyCnt = Math.max(1, Math.round(wrongIds.length * 0.25));
      const shuffled = neverWrong.sort(function() { return Math.random() - 0.5; });
      for (let i = 0; i < keyCnt && i < shuffled.length; i++) {
        pool.push({ qid: shuffled[i], source: 'key' });
      }
      // 打乱整个池
      pool.sort(function() { return Math.random() - 0.5; });
    }

    practiceQueue = pool;
    practiceIdx = 0;
    wrongMode = 'practice';
    renderWrongBook();
    window.scrollTo({top: 0, behavior: 'smooth'});
  }

  function renderPracticeView() {
    if (practiceIdx >= practiceQueue.length) return '';
    const item = practiceQueue[practiceIdx];
    const m = qIndex[item.qid];
    if (!m) { practiceIdx++; return renderPracticeView(); }
    const q = m.q;
    const pct = Math.round(practiceIdx / practiceQueue.length * 100);
    const opts = buildShuffledOptions(q);

    let optsHtml = '';
    opts.forEach(function(o) {
      optsHtml += `
        <button class="option-btn" data-letter="${o.display}" data-original="${o.original}">
          <span class="opt-letter">${o.display}</span>
          <span>${escapeHtml(o.text)}</span>
        </button>
      `;
    });

    return `
      <div class="progress-info">
        <span>练习 ${practiceIdx + 1}/${practiceQueue.length}</span>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${item.source === 'wrong' ? '📕 错题' : '⭐ 重点'}</span>
      </div>
      <div class="question-card">
        <div class="question-meta">
          <span>${item.source === 'wrong' ? '本题来自错题本' : '本题为重点练习（非错题）'}</span>
          <span>${escapeHtml(m.chapterName || '')}</span>
        </div>
        <div class="question-stem">${escapeHtml(q.stem)}</div>
        <div class="options-list" id="practiceOptions">${optsHtml}</div>
        <div id="practiceFeedback"></div>
      </div>
      <button class="user-btn" id="wpExitBtn" style="margin-top:10px;">退出练习</button>
    `;
  }

  // ---------- 背题（flashcard） ----------
  // 只读错题本（DB.recordChoice 写错），自身状态单独存 localStorage，
  // 不进 DB 的结构，避免改坏 Supabase 同步的 schema。
  var FC_KEY = 'exam_flashcard_v1';
  var FC_LEECH = 3;          // 连续 N 次「没印象」→ 转入错题本
  var FC_MASTER = 2;         // 连续 N 次「已掌握」→ 移出背题队列
  var FC_WEIGHT = { 0: 6, 1: 3, 2: 1 };   // 没印象 / 模糊 / 已掌握 的抽取权重

  var fcState = { subject: 'west_econ', chapterIdx: -1, type: 'all', current: null, answered: false };
  var fcMem = null;

  function fcLoad() {
    if (fcMem) return fcMem;
    try { fcMem = JSON.parse(localStorage.getItem(FC_KEY) || '{}') || {}; }
    catch (e) { fcMem = {}; }
    return fcMem;
  }
  function fcSave() {
    try { localStorage.setItem(FC_KEY, JSON.stringify(fcMem || {})); } catch (e) {}
  }
  function fcMeta(qid) {
    var m = fcLoad()[qid];
    return m || { s: 0, streak: 0, seen: 0, last: 0 };
  }

  // 卡片��池：当前学科（+章节/题型筛选）下的全部题目
  function fcBuildPool() {
    var pool = [];
    var subj = fcState.subject;

    if (fcState.type === 'all' || fcState.type === 'choice') {
      var chs = (DATA.choice[subj] || {}).chapters || [];
      chs.forEach(function (ch, i) {
        if (fcState.chapterIdx >= 0 && i !== fcState.chapterIdx) return;
        ch.kps.forEach(function (kp) {
          kp.questions.forEach(function (q) {
            pool.push({
              id: q.id, type: 'choice', stem: q.stem, options: q.options,
              answer: q.answer, chapterName: ch.name,
              kpName: kp.name, kpFile: kp.file || ''
            });
          });
        });
      });
    }

    if (fcState.type === 'all' || fcState.type === 'short' || fcState.type === 'essay') {
      var schs = (DATA.subjective[subj] || {}).chapters || [];
      schs.forEach(function (ch, i) {
        if (fcState.chapterIdx >= 0 && i !== fcState.chapterIdx) return;
        ['short', 'essay'].forEach(function (t) {
          if (fcState.type !== 'all' && fcState.type !== t) return;
          (ch[t === 'short' ? 'short_questions' : 'essay_questions'] || []).forEach(function (q) {
            pool.push({
              id: q.id, type: t, stem: q.stem, options: null,
              answer: q.answer || '', framework: q.framework || [],
              scoring: q.scoring || '', life_example: q.life_example || '',
              derivation: q.derivation || '', why_points: q.why_points || '',
              how_to_analyze: q.how_to_analyze || '',
              kpFile: q.kp_file || '', chapterName: ch.name, kpName: ch.name
            });
          });
        });
      });
    }
    return pool;
  }

  // 加权随机抽下一张：越没记住权重越大，刚看过的降权，
  // 同一道题不会被连续抽到两次（除非只剩一张）。
  function fcPick(pool) {
    var cands = pool.filter(function (c) {
      var m = fcMeta(c.id);
      return !(m.streak >= FC_MASTER);
    });
    if (!cands.length) return null;

    if (cands.length > 1 && fcState.current) {
      var filtered = cands.filter(function (c) { return c.id !== fcState.current.id; });
      if (filtered.length) cands = filtered;
    }

    var now = Date.now(), bucket = [];
    cands.forEach(function (c) {
      var m = fcMeta(c.id);
      var w = FC_WEIGHT[m.s] === undefined ? 6 : FC_WEIGHT[m.s];
      // 反复记不住的题优先回炉：连续没印象次数越多权重越高，下一次必被抽回
      if (m.streak < 0) w = w * (1 - m.streak);
      if (m.last && now - m.last < 60000) w = Math.max(1, Math.floor(w / 3));
      for (var k = 0; k < w; k++) bucket.push(c);
    });
    return bucket[Math.floor(Math.random() * bucket.length)] || cands[0];
  }

  function fcProgress(pool) {
    var stat = { mastered: 0, learning: 0, fresh: 0, leech: 0, remain: 0 };
    pool.forEach(function (c) {
      var m = fcMeta(c.id);
      if (m.streak >= FC_MASTER) stat.mastered++;
      else {
        stat.remain++;
        if (!m.seen) stat.fresh++;
        else { stat.learning++; if (m.streak <= -FC_LEECH) stat.leech++; }
      }
    });
    return stat;
  }

  function initFcFilters() {
    var subjSel = document.getElementById('fcSubject');
    var chapSel = document.getElementById('fcChapter');
    var typeSel = document.getElementById('fcType');
    if (!subjSel || subjSel.dataset.bound === '1') return;
    subjSel.dataset.bound = '1';

    subjSel.addEventListener('change', function () {
      var sub = subjSel.value;
      fcState.subject = sub;
      fcState.chapterIdx = -1;
      fcState.current = null;
      ensureSubject(sub, function () {
        fcUpdateChapters();
        renderFlashcard();
        updateGlobalProgress();
        preloadSubjectExpl(sub);
      });
    });
    chapSel.addEventListener('change', function () {
      fcState.chapterIdx = parseInt(chapSel.value, 10);
      if (isNaN(fcState.chapterIdx)) fcState.chapterIdx = -1;
      fcState.current = null;
      renderFlashcard();
    });
    typeSel.addEventListener('change', function () {
      fcState.type = typeSel.value;
      fcState.current = null;
      renderFlashcard();
    });
    fcUpdateChapters();
  }

  function fcUpdateChapters() {
    var chapSel = document.getElementById('fcChapter');
    if (!chapSel) return;
    var chs = (DATA.choice[fcState.subject] || {}).chapters || [];
    var html = '<option value="-1">全部章节</option>';
    chs.forEach(function (ch, i) {
      html += '<option value="' + i + '">' + escapeHtml(ch.name) + '</option>';
    });
    chapSel.innerHTML = html;
    chapSel.value = String(fcState.chapterIdx);
  }

  // 按「上一张 / 下一张」顺序取相邻卡片（顺序背诵用）
  function fcAdjacent(pool, dir) {
    if (!fcState.current) return fcPick(pool);
    var joined = pool.filter(function (c) { return fcMeta(c.id).streak < FC_MASTER; });
    var list = joined.length ? joined : pool;
    var idx = -1;
    list.forEach(function (c, i) { if (c.id === fcState.current.id) idx = i; });
    if (idx < 0) return fcPick(pool);
    return list[(idx + dir + list.length) % list.length];
  }

  function renderFlashcard() {
    if (fcState.chapterIdx === undefined) fcState.chapterIdx = -1;
    var area = document.getElementById('fcArea');
    if (!area) return;

    var pool = fcBuildPool();
    var stat = fcProgress(pool);

    if (!pool.length) {
      area.innerHTML = '<div class="empty-state">当前筛选下暂无题目</div>';
      return;
    }

    if (!fcState.current || !pool.some(function (c) { return c.id === fcState.current.id; })) {
      fcState.current = fcPick(pool);
    }

    var bar =
      '<div class="fc-bar">' +
        '<span class="fc-chip">总数 <b>' + pool.length + '</b></span>' +
        '<span class="fc-chip">已掌握 <b>' + stat.mastered + '</b></span>' +
        '<span class="fc-chip">学习中 <b>' + stat.learning + '</b></span>' +
        '<span class="fc-chip">未看过 <b>' + stat.fresh + '</b></span>' +
        '<span class="fc-chip">待攻坚 <b>' + stat.leech + '</b></span>' +
      '</div>';

    if (!fcState.current) {
      area.innerHTML = bar +
        '<div class="fc-card fc-done">' +
          '<div class="fc-done-title">🎉 本节题目全部掌握</div>' +
          '<div class="fc-done-sub">连续答对 ' + FC_MASTER + ' 次即算掌握。想看一遍全部卡片可点下面的按钮。</div>' +
          '<button class="user-btn" id="fcRestartBtn">重新过一遍</button>' +
        '</div>';
      var rb = document.getElementById('fcRestartBtn');
      if (rb) rb.addEventListener('click', function () {
        var mem = fcLoad();
        pool.forEach(function (c) { if (mem[c.id]) mem[c.id].streak = 0; });
        fcSave();
        fcState.current = null;
        renderFlashcard();
      });
      return;
    }

    var q = fcState.current;
    var meta = fcMeta(q.id);
    var typeName = q.type === 'choice' ? '选择题' : (q.type === 'short' ? '简答题' : '论述题');

    // 背题：题干、答案、解析一次性铺开，不折叠、不用点「显示答案」
    var html = bar + '<div class="fc-card">' +
      '<div class="fc-head">' +
        '<span class="fc-type">' + typeName + '</span>' +
        '<span class="fc-idx">' + escapeHtml(q.chapterName) + ' · 已看 ' + meta.seen + ' 次' +
          (meta.streak > 0 ? ' · 连对 ' + meta.streak : '') +
          (meta.streak < 0 ? ' · 连错 ' + Math.abs(meta.streak) : '') + '</span>' +
      '</div>' +
      '<div class="fc-stem">' + escapeHtml(q.stem) + '</div>';

    if (q.type === 'choice' && q.options) {
      ['A', 'B', 'C', 'D'].forEach(function (L) {
        if (!q.options[L]) return;
        var hit = q.answer === L;
        html += '<div class="fc-opt' + (hit ? ' fc-opt-hit' : '') + '">' +
                '<span class="fc-opt-key">' + L + '.</span>' +
                '<span class="fc-opt-text">' + escapeHtml(q.options[L]) + '</span></div>';
      });
    }

    html += '<div class="fc-answer">';
    if (q.type === 'choice') {
      html += '<div class="fc-answer-key">正确答案：' + escapeHtml(q.answer) + '. ' +
              escapeHtml((q.options && q.options[q.answer]) || '') + '</div>';
    } else {
      // 简答/论述题：背题要能看到完整答案，不只是框架
      // 正文一律留空，交给 fcFillMd 在 marked 就绪后按 markdown 渲染回填——
      // 直接 escapeHtml 的话，**加粗** 与 $...$ 公式会以源码形式永久留在页面上。
      var _mk = function (title, key) {
        return '<div class="fc-fw-title">' + title + '</div>' +
               '<div class="fc-ans-body fc-mdhost" data-md="' + key + '"></div>';
      };
      // 答案优先：先铺「参考答案」，其余展开料收进可折叠区。
      // 原因：【核心推导】动辄 2000+ 字，排在最前面会把参考答案顶到首屏之外，
      // 用户以为「背题里没有答案」——其实有，只是要滚很久才看得到。
      if (q.answer) html += _mk('参考答案', 'answer');
      if (q.scoring) html += _mk('评分标准', 'scoring');
      var rest = '';
      if (q.framework && q.framework.length) {
        rest += '<div class="fc-fw-title">答题框架</div>' +
                '<div class="md-body"><ul>' +
                q.framework.map(function (t) { return '<li>' + escapeHtml(t) + '</li>'; }).join('') +
                '</ul></div>';
      }
      if (q.derivation) rest += _mk('核心推导', 'derivation');
      if (q.why_points) rest += _mk('为什么要答这几点', 'why_points');
      if (q.how_to_analyze) rest += _mk('如何分析题目', 'how_to_analyze');
      if (q.life_example) rest += _mk('生活实例', 'life_example');
      var pits = extractPitfalls(q);
      if (pits.length) {
        rest += '<div class="fc-fw-title">易错点</div>' +
                '<div class="fc-ans-body pitfall-list">' +
                pits.map(function (t) { return '<div class="pitfall-item">' + escapeHtml(t) + '</div>'; }).join('') +
                '</div>';
      }
      if (rest) {
        html += '<details class="fc-more"><summary>展开：答题框架 · 核心推导 · 为什么答这几点 · 如何分析 · 生活实例 · 易错点</summary>' +
                '<div class="fc-more-body">' + rest + '</div></details>';
      }
    }
    // 解析块一律留空，交给渲染完成后的统一回填：
    // 这里如果直接 renderMd，会在 marked 就绪前走「整段转义」兜底分支，
    // 而下面 !expTxt 的回填条件又不成立，兜底结果就永久留在页面上了。
    html += '<div class="fc-exp" data-qid="' + escapeHtml(q.id) + '"></div>';
    html += '</div>';

    // 评分与翻页按钮全部放到右侧固定侧栏（sideActions），
    // 卡片底部只保留「回知识点 / 去做题」这一个与当前题相关的跳转链接。
    html += '<div class="fc-nav">' +
      (q.type === 'choice'
        ? '<a class="user-btn" href="#" id="fcToChoice">去做题</a>'
        : '<a class="user-btn" href="index.html#/' + encodeURI(q.kpFile) + '" target="_blank" rel="noopener">回知识点</a>') +
      '</div>';

    html += '</div>';
    area.innerHTML = html;

    // 整个卡片一起增强：解析块 .fc-exp 与 .fc-answer 是兄弟节点，只增强 .fc-answer 会让
    // 解析里的公式（$...$）和 mermaid 图以源码形式漏出来
    enhanceMd(area);
    // 选择题解析在 data-expl-<科目>.js 里才到齐：按需加载后回填这一块（主观题无解析，块留空不占位）
    var expEl = area.querySelector('.fc-exp');
    if (expEl && q.type === 'choice') {
      var qid = expEl.getAttribute('data-qid');
      expEl.innerHTML = '<span class="exp-loading">解析加载中…</span>';
      // marked 是异步 CDN 库：必须等它就位再 renderMd，
      // 否则会走「整段转义 + 换行变 <br>」的兜底分支，公式和 mermaid 源码全漏出来
      var drawExp = function () {
        var el = area.querySelector('.fc-exp[data-qid="' + qid + '"]');
        if (!el) return;
        var txt = explOf(q) || '';
        if (!txt) { el.innerHTML = ''; return; }
        // marked 未就绪时 renderMd 会退回「整段转义」，** 和围栏都会以源码留在页面上。
        // 所以这里必须以「marked 是否到位」为准，而不是靠 data-loaded 标记：
        // 标记只能防重复，不能证明上一次画的时候库已经在了。
        if (!window.marked) return;
        var html = renderMd(txt);
        if (el.getAttribute('data-drawn') === html) return;
        el.innerHTML = html;
        el.setAttribute('data-drawn', html);
        el.setAttribute('data-loaded', '1');
        enhanceMd(el);
      };
      // marked 可能比 __EXAM_MATH_READY 还晚到（CDN 抖动时全部库都会超时重试），
      // 所以再加一层轮询兜底：库到位就重画，最多等 40 秒
      var tries = 0;
      var timer = setInterval(function () {
        tries++;
        var cur = area.querySelector('.fc-exp[data-qid="' + qid + '"]');
        if (!cur || cur.getAttribute('data-loaded') === '1' || tries > 40) {
          clearInterval(timer);
          return;
        }
        drawExp();
      }, 1000);
      if (window.__EXAM_MATH_READY) window.__EXAM_MATH_READY.then(drawExp).catch(drawExp);
      else drawExp();
      loadSubjectExpl(subjectOfQid(q.id), function () { drawExp(); });
    } else if (expEl) {
      expEl.setAttribute('data-loaded', '1');
    }

    // ---- 简答/论述三块正文：同样等 marked 就绪再渲染 ----
    // 这三块（核心推导/为什么要答这几点/如何分析题目）是 markdown + LaTeX 混排，
    // 必须在 marked 到位后统一渲染，否则 ** 和 $ 会以源码形式漏出来。
    var fillMd = function () {
      if (!window.marked) return;
      area.querySelectorAll('.fc-mdhost[data-md]').forEach(function (el) {
        var key = el.getAttribute('data-md');
        var txt = q[key];
        if (!txt) return;
        var out = renderMd(txt);
        if (el.getAttribute('data-drawn') === out) return;
        el.innerHTML = out;
        el.setAttribute('data-drawn', out);
        enhanceMd(el);
      });
    };
    var mdTries = 0;
    var mdTimer = setInterval(function () {
      mdTries++;
      if (!area.isConnected || mdTries > 40) { clearInterval(mdTimer); return; }
      if (window.marked) {
        fillMd();
        if (area.querySelector('.fc-mdhost[data-md][data-drawn]')) clearInterval(mdTimer);
      }
    }, 1000);
    if (window.__EXAM_LIBS_READY) window.__EXAM_LIBS_READY.then(fillMd).catch(fillMd);
    fillMd();

    var toChoice = document.getElementById('fcToChoice');
    if (toChoice) toChoice.addEventListener('click', function (e) {
      e.preventDefault();
      document.querySelector('.tab[data-tab="choice"]').click();
    });

    // ---- 侧栏：本题组题号（已掌握=绿、看过未掌握=橙）+ 三档评分 + 翻页 ----
    var poolIds = pool.map(function (c) { return c.id; });
    var mem = fcLoad();
    var cardsFc = pool.map(function (c) {
      var mm = mem[c.id] || {};
      var st = 'undone';
      if ((mm.streak || 0) >= FC_MASTER) st = 'right';
      else if ((mm.seen || 0) > 0) st = 'done';
      return { id: c.id, label: '第 ' + (poolIds.indexOf(c.id) + 1) + ' 张', status: st, flag: (mm.streak || 0) <= -FC_LEECH };
    });
    sideTitle('背题卡 · ' + pool.length + ' 张');
    sideBubbles(cardsFc, poolIds.indexOf(q.id), function (idx) {
      fcState.current = pool[idx];
      renderFlashcard();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    // 背题不是答题，侧栏数字走「已掌握 / 学习中 / 未看过」口径
    sideStat(stat.mastered + stat.learning, pool.length, stat.mastered, stat.leech, '已看');
    sideActions([
      { label: '😵 没印象', cls: 'g0', onClick: function () { fcGrade(0); } },
      { label: '🤔 模糊', cls: 'g1', onClick: function () { fcGrade(1); } },
      { label: '✅ 已掌握', cls: 'g2', wide: true, onClick: function () { fcGrade(2); } },
      { label: '← 上一张', onClick: function () {
          fcState.current = fcAdjacent(pool, -1); renderFlashcard(); window.scrollTo({ top: 0, behavior: 'smooth' }); } },
      { label: '下一张 →', onClick: function () {
          fcState.current = fcAdjacent(pool, 1); renderFlashcard(); window.scrollTo({ top: 0, behavior: 'smooth' }); } }
    ]);
  }

  function fcGrade(level) {
    var q = fcState.current;
    if (!q) return;
    var mem = fcLoad();
    var m = mem[q.id] || { s: 0, streak: 0, seen: 0, last: 0 };

    m.s = level;
    m.seen = (m.seen || 0) + 1;
    m.last = Date.now();
    // streak：正数=连续记住次数，负数=连续没印象次数（模糊只记状态，不动 streak）
    if (level === 2) m.streak = Math.max(0, m.streak || 0) + 1;
    else if (level === 0) m.streak = Math.min(0, m.streak || 0) - 1;

    // 连续 FC_LEECH 次「没印象」→ 转入错题本集中攻坚（只走公开 API，自带连续对3次过关逻辑）
    if (q.type === 'choice' && m.streak <= -FC_LEECH && !m.leechDone) {
      DB.recordChoice(q.id, { done: true, correct: false, selected: '' });
      m.leechDone = true;
      updateGlobalProgress();
    }
    mem[q.id] = m;
    fcSave();

    var pool = fcBuildPool();
    fcState.current = fcPick(pool);
    renderFlashcard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- 登录/注册 UI ----------

  function refreshUserUI() {
    const emailEl = document.getElementById('userEmail');
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    if (DB.isLoggedIn()) {
      emailEl.textContent = DB.getUser().email || '';
      emailEl.style.display = '';
      loginBtn.style.display = 'none';
      logoutBtn.style.display = '';
    } else {
      emailEl.style.display = 'none';
      loginBtn.style.display = '';
      logoutBtn.style.display = 'none';
    }
  }

  function initAuthUI() {
    const loginBtn = document.getElementById('loginBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const modal = document.getElementById('loginModal');
    const modalTitle = document.getElementById('modalTitle');
    const submitBtn = document.getElementById('loginSubmit');
    const msg = document.getElementById('loginMsg');
    const emailInput = document.getElementById('loginEmail');
    const pwdInput = document.getElementById('loginPassword');

    // 打开弹窗
    loginBtn.addEventListener('click', function() {
      modal.classList.add('visible');
      msg.textContent = '';
      msg.className = 'modal-msg';
    });

    // 点遮罩关闭
    modal.addEventListener('click', function(e) {
      if (e.target === modal) modal.classList.remove('visible');
    });

    // 提交
    submitBtn.addEventListener('click', async function() {
      const email = emailInput.value.trim();
      const pwd = pwdInput.value;
      if (!email || !pwd) {
        msg.textContent = '请输入邮箱和密码';
        msg.className = 'modal-msg error';
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = '处理中...';
      try {
        await DB.signIn(email, pwd);
        msg.textContent = '登录成功';
        msg.className = 'modal-msg success';
        setTimeout(function() {
          modal.classList.remove('visible');
          refreshUserUI();
          updateGlobalProgress();
          renderChoice();
        }, 600);
      } catch (e) {
        msg.textContent = e.message || '操作失败';
        msg.className = 'modal-msg error';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '登录';
      }
    });

    // 退出
    logoutBtn.addEventListener('click', async function() {
      if (!confirm('确定退出登录吗？本地进度会保留，但云端同步将暂停')) return;
      await DB.signOut();
      refreshUserUI();
      updateGlobalProgress();
      renderChoice();
    });

    // 数据变化时刷新 UI（云端拉取完成后）
    DB.onChange(function() {
      refreshUserUI();
      updateGlobalProgress();
    });

    refreshUserUI();
  }

  // ---------- 初始化 ----------
  // 首屏只保证「西经」就绪（按需下载 data-west_econ.js），
  // 其余 6 科等用户真的切过去时才拉 data-<key>.js。
  function init() {
    initChoiceFilters();
    initFcFilters();
    initSubjectiveFilters('short');
    initSubjectiveFilters('essay');

    // 首屏只下西经选择题（约 250KB）；简答/论述/其他科目等切过去再下
    ensureSubject('west_econ', function () {
      updateChapterOptions('choice');
      initAuthUI();
      updateGlobalProgress();
      renderChoice();
    });
  }

  // 首屏渲染完成后，趁空闲提前把解析拉下来（用户答题时无感）
  function idleKick(fn, delay) {
    if (window.requestIdleCallback) requestIdleCallback(fn, { timeout: delay || 4000 });
    else setTimeout(fn, (delay || 4000) - 1500);
  }
  idleKick(function () { loadSubjectExpl('west_econ'); }, 4000);
  // 西经解析到齐后再把另外 4 个待用科目的数据在后台排队预取，
  // 用户下次切科目基本是瞬开。download 走浏览器 HTTP 缓存，不重复流量。
  // 只预热「最可能马上用的下一科」——政治经济学（西经之后的第二选择）。
  // 其余 5 科共约 4MB，等用户真的切过去再下，不必用他的流量替别人铺路。
  function warmSubjects() {
    loadSubject('pol_econ').catch(function () {});
  }
  if ('requestIdleCallback' in window) {
    setTimeout(function () {
      requestIdleCallback(warmSubjects, { timeout: 15000 });
    }, 12000);
  } else {
    setTimeout(warmSubjects, 15000);
  }

  // 首屏立刻渲染（不等 CDN）；库到齐后再增强公式与图表
  init();
  if (window.__EXAM_LIBS_READY) {
    window.__EXAM_LIBS_READY.then(function () {
      try { if (typeof renderChoice === 'function') renderChoice(); } catch (e) {}
    });
  }
})();
</script>
