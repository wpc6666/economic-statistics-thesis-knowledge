<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>答题系统 - 经济统计学知识库</title>
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="exam.css">
<!-- markdown / mermaid / KaTeX：异步加载，绝不阻塞首屏。
     旧版用 4 个同步 <script src>，bootcdn 慢时整页白屏（用户说的"加载有炸弹"）。
     现在：先渲染题目，库到了再增强；多源兜底，单个 CDN 挂掉不影响。-->
<script>
(function () {
  var CDN = [
    'https://cdn.bootcdn.net/ajax/libs/',
    'https://cdn.jsdelivr.net/npm/',
    'https://unpkg.com/'
  ];
  // bootcdn 用「库@版本/文件」，jsdelivr/unpkg 用 npm 包名，这里分开写
  var PKGS = {
    marked:  ['marked/12.0.0/marked.min.js', 'marked@12.0.2/marked.min.js'],
    mermaid: ['mermaid/10.9.1/mermaid.min.js', 'mermaid@10.9.1/dist/mermaid.min.js'],
    katex:   ['KaTeX/0.16.9/katex.min.js', 'katex@0.16.9/dist/katex.min.js'],
    autoRender: ['KaTeX/0.16.9/contrib/auto-render.min.js', 'katex@0.16.9/dist/contrib/auto-render.min.js'],
    katexCss: ['KaTeX/0.16.9/katex.min.css', 'katex@0.16.9/dist/katex.min.css']
  };
  // 单个 CDN 的等待上限。最多尝试 3 个源，限制网络故障时的兜底总等待。
  var TIMEOUT = 2500;

  function loadOne(kind) {
    var variants = PKGS[kind], i = 0;
    return new Promise(function (resolve) {
      (function next() {
        if (i >= CDN.length) return resolve(false);
        // 每个源只尝试其对应的一种 URL，避免 3 个 CDN × 多版本的长串行等待。
        var url = CDN[i] + variants[i === 0 ? 0 : variants.length - 1];
        i++;
        var el, settled = false, timer;
        function finish(ok) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          if (!ok && el.parentNode) el.remove();
          if (ok) resolve(true); else next();
        }
        if (/\.css$/.test(url)) {
          el = document.createElement('link');
          el.rel = 'stylesheet'; el.href = url;
        } else {
          el = document.createElement('script');
          el.src = url;
        }
        el.onload = function () { finish(true); };
        el.onerror = function () { finish(false); };
        timer = setTimeout(function () { finish(false); }, TIMEOUT);
        document.head.appendChild(el);
      })();
    });
  }

  // 各库并行加载：任何一个慢都不拖累其它库。
  // 公式链（katex → autoRender）只依赖 katex 自己，
  // 不能让 2.5MB 的 mermaid 卡住公式渲染——那是用户看到「公式变源码」的直接原因。
  var katexP = loadOne('katex');
  var mathP = katexP.then(function () { return loadOne('autoRender'); });
  // 公式链单独暴露：它通常 5-6 秒就到，而 mermaid 可能要 25 秒以上。
  // 让公式先渲染，不要被 mermaid 拖住。
  window.__EXAM_MATH_READY = mathP;

  window.__EXAM_LIBS_READY = Promise.all([
    loadOne('katexCss'),
    loadOne('marked'),
    mathP
  ])
    .then(function () {
      return true;
    })
    .catch(function () { return false; });

  // Mermaid 体积较大，只在当前内容确实包含流程图时加载。
  var mermaidLoading = null;
  window.__EXAM_MERMAID_READY = function () {
    if (window.mermaid) return Promise.resolve(true);
    if (mermaidLoading) return mermaidLoading;
    mermaidLoading = loadOne('mermaid').then(function (ok) {
      if (!ok || !window.mermaid) return false;
      try {
        // 画布保持透明，背景色交给页面主题变量。
        mermaid.initialize({
          startOnLoad: false,
          theme: 'neutral',
          securityLevel: 'loose',
          fontFamily: '-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif',
          flowchart: { htmlLabels: true, useMaxWidth: true },
          themeVariables: { background: 'transparent', fontSize: '14px' }
        });
        return true;
      } catch (e) {
        mermaidLoading = null;
        return false;
      }
    });
    return mermaidLoading;
  };
})();
</script>
</head>
<body>

<!-- 右侧固定侧栏：答题卡 / 进度 / 控制。进答题页才出现，移动端折成底部工具条 -->
<aside id="sidePanel" class="side-panel hidden" aria-label="答题卡与快捷操作">
  <div class="sp-sec sp-sec-head">
    <div class="sp-title">
      <span class="sp-title-main" id="spCount">答题卡</span>
      <span class="sp-clock" id="spClock">00:00</span>
    </div>
    <div class="sp-pbar"><i id="spPbar" style="width:0%"></i></div>
    <div class="sp-count" id="spStat">已做 0 / 0</div>
  </div>
  <div class="sp-sec side-body">
    <div class="sp-legend">
      <span><i class="lg-undone"></i>未做</span>
      <span><i class="lg-right"></i>答对</span>
      <span><i class="lg-wrong"></i>答错</span>
      <span><i class="lg-flag"></i>标记</span>
    </div>
    <div class="bubble-wrap" id="spBubbles"></div>
  </div>
  <div class="sp-actions" id="spActions"></div>
</aside>

<div class="top-bar">
  <a href="index.html" class="back-link">← 返回主页</a>
  <div class="title">答题系统</div>
  <div class="user-area" id="userArea">
    <span class="user-email" id="userEmail" style="display:none;"></span>
    <button class="user-btn" id="loginBtn">登录</button>
    <button class="user-btn danger" id="logoutBtn" style="display:none;">退出</button>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="modal-mask" id="loginModal">
  <div class="modal-card">
    <h3 id="modalTitle">登录</h3>
    <input type="email" class="modal-input" id="loginEmail" placeholder="邮箱">
    <input type="password" class="modal-input" id="loginPassword" placeholder="密码" minlength="6">
    <button class="modal-submit" id="loginSubmit">登录</button>
    <div class="modal-msg" id="loginMsg"></div>
  </div>
</div>

<!-- 全局进度统计栏 -->
<div class="global-progress">
  <div class="gp-item">
    <span class="gp-label">选择题</span>
    <span class="gp-value" id="gpChoice">已做 0/0</span>
    <span class="gp-acc" id="gpChoiceAcc">正确率 --</span>
  </div>
  <div class="gp-item">
    <span class="gp-label">简答题</span>
    <span class="gp-value" id="gpShort">已看答案 0/0</span>
  </div>
  <div class="gp-item">
    <span class="gp-label">论述题</span>
    <span class="gp-value" id="gpEssay">已看答案 0/0</span>
  </div>
  <div class="gp-item">
    <span class="gp-label">错题本</span>
    <span class="gp-value" id="gpWrong">待复习 0</span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="choice">选择题</button>
  <button class="tab" data-tab="random">🎲 随机30题</button>
  <button class="tab" data-tab="short">简答题</button>
  <button class="tab" data-tab="essay">论述题</button>
  <button class="tab" data-tab="fc">🧠 背题</button>
  <button class="tab" data-tab="mock">模拟卷</button>
  <button class="tab" data-tab="wrong">错题本</button>
</div>

<div class="container">

  <!-- 选择题标签页 -->
  <div id="tab-choice" class="tab-content">
    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">学科</span>
        <select class="filter-select" id="choiceSubject">
          <option value="west_econ">西方经济学</option>
          <option value="pol_econ">政治经济学</option>
          <option value="zonghe">综合评价</option>
          <option value="jiliang">计量经济学</option>
          <option value="shixu">时间序列分析</option>
          <option value="duoyuan">多元统计分析</option>
          <option value="tongyuan">统计学原理</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">章节</span>
        <select class="filter-select" id="choiceChapter"></select>
      </div>
    </div>

    <div class="progress-info">
      <span id="choiceProgressText">已做 0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="choiceProgressFill" style="width:0%"></div></div>
      <span id="choiceAccuracy">正确率 --</span>
    </div>

    <div id="choiceArea"></div>
  </div>

  <!-- 随机30题标签页 -->
  <div id="tab-random" class="tab-content hidden">
    <div id="randomArea"></div>
  </div>

  <!-- 简答题标签页 -->
  <div id="tab-short" class="tab-content hidden">
    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">学科</span>
        <select class="filter-select" id="shortSubject">
          <option value="west_econ">西方经济学</option>
          <option value="pol_econ">政治经济学</option>
          <option value="zonghe">综合评价</option>
          <option value="jiliang">计量经济学</option>
          <option value="shixu">时间序列分析</option>
          <option value="duoyuan">多元统计分析</option>
          <option value="tongyuan">统计学原理</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">章节</span>
        <select class="filter-select" id="shortChapter"></select>
      </div>
    </div>

    <div class="progress-info">
      <span id="shortProgressText">已看答案 0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="shortProgressFill" style="width:0%"></div></div>
      <span></span>
    </div>

    <div id="shortArea"></div>
  </div>

  <!-- 论述题标签页 -->
  <div id="tab-essay" class="tab-content hidden">
    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">学科</span>
        <select class="filter-select" id="essaySubject">
          <option value="west_econ">西方经济学</option>
          <option value="pol_econ">政治经济学</option>
          <option value="zonghe">综合评价</option>
          <option value="jiliang">计量经济学</option>
          <option value="shixu">时间序列分析</option>
          <option value="duoyuan">多元统计分析</option>
          <option value="tongyuan">统计学原理</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">章节</span>
        <select class="filter-select" id="essayChapter"></select>
      </div>
    </div>

    <div class="progress-info">
      <span id="essayProgressText">已看答案 0 / 0</span>
      <div class="progress-bar"><div class="progress-fill" id="essayProgressFill" style="width:0%"></div></div>
      <span></span>
    </div>

    <div id="essayArea"></div>
  </div>

  <!-- 背题标签页 -->
  <div id="tab-fc" class="tab-content hidden">
    <div class="filter-bar">
      <div class="filter-row">
        <span class="filter-label">学科</span>
        <select class="filter-select" id="fcSubject">
          <option value="west_econ">西方经济学</option>
          <option value="pol_econ">政治经济学</option>
          <option value="zonghe">综合评价</option>
          <option value="jiliang">计量经济学</option>
          <option value="shixu">时间序列分析</option>
          <option value="duoyuan">多元统计分析</option>
          <option value="tongyuan">统计学原理</option>
        </select>
      </div>
      <div class="filter-row">
        <span class="filter-label">章节</span>
        <select class="filter-select" id="fcChapter"></select>
      </div>
      <div class="filter-row">
        <span class="filter-label">题型</span>
        <select class="filter-select" id="fcType">
          <option value="all">全部</option>
          <option value="choice">选择题</option>
          <option value="short">简答题</option>
          <option value="essay">论述题</option>
        </select>
      </div>
    </div>

    <div id="fcArea"></div>
  </div>

  <!-- 模拟卷标签页 -->
  <div id="tab-mock" class="tab-content hidden">
    <div id="mockListArea"></div>
    <div id="mockExamArea" class="hidden"></div>
  </div>

  <!-- 错题本标签页 -->
  <div id="tab-wrong" class="tab-content hidden">
    <div id="wrongArea"></div>
  </div>

</div>


<script src="db.js"></script>
<script src="data-index.js"></script>
<script src="exam-app.js"></script>

</body>
</html>
